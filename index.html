<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Setoran Hafalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--surface:#fffefb;--ink:#1d2b25;--mute:#66756d;--line:#e4dfd0;--em:#0f6b4f;--em-d:#0a4f3a;--sage:#dfe9df;--sage-d:#b9cfbf;--ok:#0f6b4f;--ok-bg:#dcefe4;--mid:#8a6410;--mid-bg:#f6ebc9;--bad:#a2432f;--bad-bg:#f6dcd4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--surface:#1a2520;--ink:#e8efe9;--mute:#9bb0a4;--line:#2b3a33;--em:#4fc196;--em-d:#7fd8b4;--sage:#22332b;--sage-d:#36503f;--ok:#7fd8b4;--ok-bg:#1f3a2e;--mid:#e5c15c;--mid-bg:#3a3217;--bad:#ee9a86;--bad-bg:#40231c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--surface:#1a2520;--ink:#e8efe9;--mute:#9bb0a4;--line:#2b3a33;--em:#4fc196;--em-d:#7fd8b4;--sage:#22332b;--sage-d:#36503f;--ok:#7fd8b4;--ok-bg:#1f3a2e;--mid:#e5c15c;--mid-bg:#3a3217;--bad:#ee9a86;--bad-bg:#40231c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--em-d);color:#eaf4ee;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Amiri,serif;font-size:30px;line-height:1.1;margin:0 8px 2px}
.brand-sub{font-size:13px;opacity:.75;margin:0 8px 24px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
nav button svg{width:20px;height:20px;flex:none}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current=page]{background:#f6f3ea;color:#0a4f3a;font-weight:700}
.side-foot{margin-top:auto;font-size:13px;opacity:.8;padding:0 8px}
main{padding:32px clamp(16px,4vw,48px) 48px;max-width:1100px;width:100%}
h1{font-family:Amiri,serif;font-size:clamp(30px,5vw,40px);margin:0 0 4px;line-height:1.15;color:var(--em-d)}
:root[data-theme="dark"] h1{color:var(--em-d)}
.lead{color:var(--mute);margin:0 0 24px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.stat b{display:block;font-size:34px;line-height:1.1;color:var(--em-d);font-weight:700}
.stat span{color:var(--mute);font-size:14px}
.stat.main{background:var(--em-d);border-color:var(--em-d);color:#eaf4ee}.stat.main b{color:#fff}.stat.main span{color:#c6dccf}
.bar{height:10px;background:var(--sage);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--em);border-radius:99px}
.stat.main .bar{background:rgba(255,255,255,.2)}.stat.main .bar i{background:#bfe6cf}
h2{font-size:18px;margin:0 0 12px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{color:var(--mute);display:block}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.Lancar{background:var(--ok-bg);color:var(--ok)}.Cukup{background:var(--mid-bg);color:var(--mid)}.Ulang{background:var(--bad-bg);color:var(--bad)}
.tag{background:var(--sage);color:var(--em-d);font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px}
.btn{border:1px solid var(--em);background:var(--em);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0b1712}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b1712}}
.btn.ghost{background:transparent;color:var(--em-d);border-color:var(--sage-d)}
.btn.sm{padding:5px 12px;font-size:14px}.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad-bg)}
.btn:hover{filter:brightness(1.07)}
.bar-tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.bar-tools>*{flex:1 1 160px}.bar-tools .grow{flex:3 1 240px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.form{grid-template-columns:repeat(2,1fr)}.form .full{grid-column:1/-1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;padding:9px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--sage);border-color:var(--em);color:var(--em-d);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--em)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{color:var(--mute);font-weight:600;font-size:13px}
td.act{white-space:nowrap;text-align:right}
.empty{text-align:center;color:var(--mute);padding:32px 12px}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{cursor:pointer;text-align:left;width:100%}.pcard:hover{border-color:var(--em)}
.pcard h3{margin:0 0 2px}
.back{background:none;border:0;color:var(--em-d);cursor:pointer;font-weight:600;padding:0;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--em-d);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:380px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-act{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
#print{display:none}
@media (max-width:820px){
.app{display:block}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.brand,.brand-sub,.side-foot{display:none}
nav{flex-direction:row;width:100%;justify-content:space-around}
nav button{flex-direction:column;gap:2px;font-size:12px;padding:6px 8px;flex:1;align-items:center}
main{padding-bottom:96px;padding-top:24px}
.form{grid-template-columns:1fr}
}
@media print{
body{background:#fff;color:#000}.app{display:none}#print{display:block;font-family:Figtree,sans-serif}
#print h1{color:#0a4f3a}#print table{min-width:0}#print th,#print td{font-size:12px;border-bottom:1px solid #bbb}
}

.gif-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gif-slot{border:1px dashed var(--sage-d);border-radius:14px;padding:14px;background:var(--bg);min-width:0}
.gif-preview{height:180px;border-radius:10px;background:var(--sage);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:var(--mute);text-align:center;padding:10px}
.gif-preview img{width:100%;height:100%;object-fit:contain}
.gif-slot input{font-size:13px;padding:8px}
.quote-form{display:grid;gap:10px;margin-bottom:18px}
.quote-list{display:grid;gap:12px}
.quote-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--surface)}
.quote-text{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 12px}
.quote-meta{font-size:13px;color:var(--mute)}
.like-btn{border:1px solid var(--line);border-radius:99px;background:var(--bg);padding:6px 12px;cursor:pointer;font-weight:600}
.like-btn.liked{border-color:#d68a9b;background:#fff0f3;color:#b4234b}
@media(max-width:560px){.gif-grid{grid-template-columns:1fr}.gif-preview{height:160px}}

</style>
</head>
<body>
<div class="app">
<aside>
  <p class="brand">Buku Setoran</p>
  <p class="brand-sub">Catatan hafalan Al-Qur’an</p>
  <nav id="nav"></nav>
  <p class="side-foot">Data tersimpan otomatis di perangkat ini.</p>
</aside>
<main id="view"></main>
</div>
<div id="print"></div>
<dialog id="dlg"><p id="dlgMsg" style="margin:0"></p><div class="dlg-act"><button class="btn ghost sm" id="dlgNo">Batal</button><button class="btn sm" id="dlgYes">Hapus</button></div></dialog>

<script>
const KEY="setoran-hafalan-v2";
const NILAI=["Lancar","Cukup Lancar","Perlu Diulang"];
const SURAH=[["Al-Fatihah",7],["Al-Baqarah",286],["Ali ’Imran",200],["An-Nisa",176],["Al-Ma’idah",120],["Al-An’am",165],["Al-A’raf",206],["Al-Anfal",75],["At-Taubah",129],["Yunus",109],["Hud",123],["Yusuf",111],["Ar-Ra’d",43],["Ibrahim",52],["Al-Hijr",99],["An-Nahl",128],["Al-Isra",111],["Al-Kahf",110],["Maryam",98],["Taha",135],["Al-Anbiya",112],["Al-Hajj",78],["Al-Mu’minun",118],["An-Nur",64],["Al-Furqan",77],["Asy-Syu’ara",227],["An-Naml",93],["Al-Qasas",88],["Al-’Ankabut",69],["Ar-Rum",60],["Luqman",34],["As-Sajdah",30],["Al-Ahzab",73],["Saba",54],["Fatir",45],["Yasin",83],["As-Saffat",182],["Sad",88],["Az-Zumar",75],["Ghafir",85],["Fussilat",54],["Asy-Syura",53],["Az-Zukhruf",89],["Ad-Dukhan",59],["Al-Jasiyah",37],["Al-Ahqaf",35],["Muhammad",38],["Al-Fath",29],["Al-Hujurat",18],["Qaf",45],["Az-Zariyat",60],["At-Tur",49],["An-Najm",62],["Al-Qamar",55],["Ar-Rahman",78],["Al-Waqi’ah",96],["Al-Hadid",29],["Al-Mujadilah",22],["Al-Hasyr",24],["Al-Mumtahanah",13],["As-Saff",14],["Al-Jumu’ah",11],["Al-Munafiqun",11],["At-Tagabun",18],["At-Talaq",12],["At-Tahrim",12],["Al-Mulk",30],["Al-Qalam",52],["Al-Haqqah",52],["Al-Ma’arij",44],["Nuh",28],["Al-Jinn",28],["Al-Muzzammil",20],["Al-Muddassir",56],["Al-Qiyamah",40],["Al-Insan",31],["Al-Mursalat",50],["An-Naba",40],["An-Nazi’at",46],["Abasa",42],["At-Takwir",29],["Al-Infitar",19],["Al-Mutaffifin",36],["Al-Insyiqaq",25],["Al-Buruj",22],["At-Tariq",17],["Al-A’la",19],["Al-Ghasyiyah",26],["Al-Fajr",30],["Al-Balad",20],["Asy-Syams",15],["Al-Lail",21],["Ad-Duha",11],["Asy-Syarh",8],["At-Tin",8],["Al-Alaq",19],["Al-Qadr",5],["Al-Bayyinah",8],["Az-Zalzalah",8],["Al-Adiyat",11],["Al-Qari’ah",11],["At-Takasur",8],["Al-Asr",3],["Al-Humazah",9],["Al-Fil",5],["Quraisy",4],["Al-Ma’un",7],["Al-Kausar",3],["Al-Kafirun",6],["An-Nasr",3],["Al-Lahab",5],["Al-Ikhlas",4],["Al-Falaq",5],["An-Nas",6]];
const nCls=n=>n==="Lancar"?"Lancar":n==="Cukup Lancar"?"Cukup":"Ulang";
const ICON={dash:'<path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',add:'<path d="M12 5v14M5 12h14"/>',hist:'<path d="M4 6h16M4 12h16M4 18h10"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const TABS=[["dash","Ringkasan"],["add","Setor"],["hist","Riwayat"],["user","Peserta"]];
let S={peserta:[],setoran:[],quotes:[]},tab="dash",editId=null,selP=null,flt={q:"",nilai:"",jenis:""};

function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function seed(){
  S.peserta=[{id:"p1",nama:"Reski",target:600},{id:"p2",nama:"Ima Sholeha",target:600}];
  S.setoran=[];
  S.quotes=[];
}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(!Array.isArray(S.peserta)||!Array.isArray(S.setoran))throw 0;S.peserta=[{id:"p1",nama:"Reski",target:S.peserta.find(p=>p.nama==="Reski")?.target||600},{id:"p2",nama:"Ima Sholeha",target:S.peserta.find(p=>p.nama==="Ima Sholeha")?.target||600}];S.setoran=S.setoran.filter(x=>["p1","p2"].includes(x.pid));S.quotes=Array.isArray(S.quotes)?S.quotes.filter(q=>["p1","p2"].includes(q.pid)&&Number.isFinite(Number(q.createdAt))&&(Date.now()-Number(q.createdAt)<24*60*60*1000)).map(q=>({...q,likes:Array.isArray(q.likes)?q.likes:[]})):[];save();return}}catch(e){}seed();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Penyimpanan penuh. Hapus data lama atau kurangi isi.")}}
function cleanExpiredQuotes(){
  const before=(S.quotes||[]).length;
  S.quotes=(S.quotes||[]).filter(q=>Number.isFinite(Number(q.createdAt))&&(Date.now()-Number(q.createdAt)<24*60*60*1000));
  if(S.quotes.length!==before){save();if(tab==="dash"&&$("quoteList"))render()}
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pName=id=>(S.peserta.find(p=>p.id===id)||{nama:"(dihapus)"}).nama;
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const sorted=a=>[...a].sort((x,y)=>y.tgl.localeCompare(x.tgl)||y.id.localeCompare(x.id));
const ayatOf=l=>l.filter(s=>s.jenis==="Ziyadah").reduce((a,s)=>a+(+s.ayat||0),0);
function weekStart(){const d=new Date(),k=(d.getDay()+6)%7;return daysAgo(k)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;t.setAttribute("role","status");document.body.append(t);setTimeout(()=>t.remove(),2200)}
const GIF_DB="buku-setoran-gif",GIF_STORE="animasi";
function gifDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(GIF_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(GIF_STORE))req.result.createObjectStore(GIF_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveGif(slot,file){const db=await gifDB();await new Promise((resolve,reject)=>{const tx=db.transaction(GIF_STORE,"readwrite");tx.objectStore(GIF_STORE).put(file,slot);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function readGif(slot){const db=await gifDB();const blob=await new Promise((resolve,reject)=>{const tx=db.transaction(GIF_STORE,"readonly"),req=tx.objectStore(GIF_STORE).get(slot);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return blob}
async function showGif(slot){const box=$("gifPreview"+slot);if(!box)return;try{const blob=await readGif(slot);if(blob&&$("gifPreview"+slot)){const url=URL.createObjectURL(blob);box.innerHTML=`<img src="${url}" alt="Animasi GIF ${slot}">`;}}catch(e){box.textContent="Belum ada GIF. Pilih file untuk menambahkan animasi."}}

function ask(msg,yes="Hapus"){return new Promise(r=>{dlgMsg.textContent=msg;dlgYes.textContent=yes;const d=$("dlg");d.showModal();const done=v=>{d.close();r(v)};dlgYes.onclick=()=>done(true);dlgNo.onclick=()=>done(false)})}
const $=id=>document.getElementById(id);

function renderNav(){
  $("nav").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.t==="add")editId=null;go(b.dataset.t)});
}
function go(t){tab=t;if(t!=="user")selP=null;render();window.scrollTo(0,0)}
function render(){renderNav();({dash,add:formView,hist,user:pesertaView})[tab]()}

function chip(n){return `<span class="chip ${nCls(n)}">${esc(n)}</span>`}
function dash(){
  cleanExpiredQuotes();
  const tot=S.setoran.length,ay=ayatOf(S.setoran),tg=S.peserta.reduce((a,p)=>a+(+p.target||0),0);
  const pct=tg?Math.min(100,Math.round(ay/tg*100)):0;
  const ws=weekStart(),wk=S.setoran.filter(s=>s.tgl>=ws).length;
  const rec=sorted(S.setoran).slice(0,6);
  const quotes=[...S.quotes].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $("view").innerHTML=`
  <h1>Assalamu’alaikum</h1><p class="lead">Ringkasan hafalan setoran peserta.</p>
  <section class="card" style="margin-bottom:14px">
   <h2>Animasi GIF</h2>
   <p class="quote-meta" style="margin-top:-6px;margin-bottom:12px">Sisipkan satu gambar GIF pilihan Anda. Animasi tersimpan di perangkat ini.</p>
   <div class="gif-grid" style="grid-template-columns:minmax(0,1fr)">
    <div class="gif-slot"><strong>Animasi</strong><div class="gif-preview" id="gifPreview1">Belum ada GIF. Pilih file untuk menambahkan animasi.</div><input type="file" id="gifFile1" accept="image/gif" aria-label="Pilih GIF"></div>
   </div>
  </section>
  <section class="card" style="margin-bottom:14px">
   <h2>Quotes Peserta</h2>
   <p class="quote-meta" style="margin-top:-6px">Reski dan Ima Sholeha dapat saling berbagi kata-kata penyemangat dan memberikan like.</p>
   <form class="quote-form" id="quoteForm">
    <div><label for="quoteBy">Kirim sebagai</label><select id="quoteBy"><option value="p1">Reski</option><option value="p2">Ima Sholeha</option></select></div>
    <div><label for="quoteText">Tulis quotes</label><textarea id="quoteText" maxlength="500" placeholder="Tuliskan pesan atau motivasi..." required></textarea></div>
    <div><button class="btn" type="submit">Kirim quotes</button></div>
   </form>
   <div class="quote-list" id="quoteList">${quotes.length?quotes.map(q=>`<article class="quote-card"><div class="head"><strong>${esc(pName(q.pid))}</strong><span class="quote-meta">${q.createdAt?new Date(q.createdAt).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}):""}</span></div><p class="quote-text">${esc(q.text)}</p><button class="like-btn ${q.likes.includes("p1")||q.likes.includes("p2")?"liked":""}" data-like="${esc(q.id)}">♡ Suka · ${q.likes.length}</button> <button class="btn danger sm" data-quote-delete="${esc(q.id)}">Hapus</button></article>`).join(""):'<div class="empty">Belum ada quotes. Jadilah yang pertama berbagi semangat!</div>'}</div>
  </section>
  <div class="grid stats">
   <div class="card stat main"><b>${ay}</b><span>ayat baru (Ziyadah) disetorkan</span><div class="bar"><i style="width:${pct}%"></i></div></div>
   <div class="card stat"><b>${pct}%</b><span>capaian dari target ${tg} ayat</span></div>
   <div class="card stat"><b>${wk}</b><span>setoran minggu ini</span></div>
   <div class="card stat"><b>${tot}</b><span>total catatan setoran</span></div>
  </div>
  <div class="card"><div class="head"><h2>Setoran terbaru</h2><button class="btn sm" id="n">Catat setoran</button></div>
  <div class="list">${rec.length?rec.map(s=>`<div class="row"><div><strong>${esc(pName(s.pid))}</strong> <span class="tag">${esc(s.jenis)}</span><small>${esc(s.materi)} · ${fmt(s.tgl)}</small></div>${chip(s.nilai)}</div>`).join(""):'<div class="empty">Belum ada setoran. Catat setoran pertama.</div>'}</div></div>`;
  $("n").onclick=()=>{editId=null;go("add")};
  showGif(1);
  $("gifFile1").onchange=async e=>{
    const file=e.target.files?.[0];if(!file)return;
    if(file.type!=="image/gif"){toast("Silakan pilih file gambar GIF.");e.target.value="";return}
    try{await saveGif("1",file);await showGif(1);toast("Animasi GIF berhasil disimpan.")}catch(err){console.error(err);toast("GIF gagal disimpan. Coba file yang lebih kecil.")}
  };
  $("quoteForm").onsubmit=e=>{
    e.preventDefault();
    const textValue=$("quoteText").value.trim(),pid=$("quoteBy").value;
    if(!textValue){toast("Quotes tidak boleh kosong.");return}
    S.quotes.push({id:uid(),pid,text:textValue,likes:[],createdAt:Date.now()});
    save();dash();toast("Quotes berhasil dikirim.");
  };
  $("quoteList").querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>{
    const q=S.quotes.find(x=>x.id===b.dataset.like);if(!q)return;
    const actor=$("quoteBy").value;q.likes=Array.isArray(q.likes)?q.likes:[];
    q.likes=q.likes.includes(actor)?q.likes.filter(x=>x!==actor):[...q.likes,actor];
    save();dash();
  });
  $("quoteList").querySelectorAll("[data-quote-delete]").forEach(b=>b.onclick=async()=>{
    const q=S.quotes.find(x=>x.id===b.dataset.quoteDelete);if(!q)return;
    if(await ask("Hapus quotes ini?")){S.quotes=S.quotes.filter(x=>x.id!==q.id);save();dash();toast("Quotes dihapus.")}
  });
}
function formView(){
  const e=S.setoran.find(s=>s.id===editId)||{pid:S.peserta[0]?.id||"p1",jenis:"Ziyadah",surah:1,awal:1,akhir:1,materi:"",ayat:1,tgl:today(),nilai:"Lancar",catatan:""};
  const sid=Number(e.surah)||1, info=SURAH[sid-1], awal=Number(e.awal)||1, akhir=Number(e.akhir)||awal;
  if(!S.peserta.length){seed()}
  $("view").innerHTML=`<h1>${editId?"Ubah setoran":"Setoran baru"}</h1><p class="lead">Catat hafalan yang baru disetorkan.</p>
  <form class="card grid form" id="f" autocomplete="off">
   <div><label for="pid">Nama santri</label><select id="pid" required>${S.peserta.map(p=>`<option value="${p.id}" ${p.id===e.pid?"selected":""}>${esc(p.nama)}</option>`).join("")}</select></div>
   <div><label for="tgl">Tanggal setoran</label><input type="date" id="tgl" required value="${e.tgl}"></div>
   <div class="full"><label>Jenis hafalan</label><div class="seg">
    <label><input type="radio" name="j" value="Ziyadah" ${e.jenis==="Ziyadah"?"checked":""}><span>Ziyadah (hafalan baru)</span></label>
    <label><input type="radio" name="j" value="Muroja'ah" ${e.jenis!=="Ziyadah"?"checked":""}><span>Muroja’ah (mengulang)</span></label></div></div>
   <div class="full"><label for="surah">Surah (114 surah)</label><select id="surah" required>${SURAH.map((x,i)=>`<option value="${i+1}" ${sid===i+1?"selected":""}>${i+1}. ${esc(x[0])} (${x[1]} ayat)</option>`).join("")}</select></div>
   <div><label for="awal">Ayat awal</label><select id="awal" required></select></div>
   <div><label for="akhir">Ayat akhir</label><select id="akhir" required></select></div>
   <div class="full"><label>Jumlah ayat terpilih</label><input id="jumlah" readonly value="${Math.max(1,akhir-awal+1)}"></div>
   <div class="full"><label>Penilaian</label><div class="seg">${NILAI.map(n=>`<label><input type="radio" name="n" value="${n}" ${e.nilai===n?"checked":""}><span>${n}</span></label>`).join("")}</div></div>
   <div class="full"><label for="cat">Catatan / komentar</label><textarea id="cat"></textarea></div>
   <div class="full" style="display:flex;gap:10px"><button class="btn" type="submit">${editId?"Simpan perubahan":"Simpan setoran"}</button>${editId?'<button class="btn ghost" type="button" id="cx">Batal</button>':""}</div>
  </form>`;
  const updateAyatFields=(reset=false)=>{
    const n=SURAH[+$("surah").value-1][1];
    const oldA=reset?1:(+$("awal").value||awal), oldB=reset?1:(+$("akhir").value||akhir);
    $("awal").innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(oldA,n)?"selected":""}>${i+1}</option>`).join("");
    const a=+$("awal").value;
    $("akhir").innerHTML=Array.from({length:n-a+1},(_,i)=>`<option value="${a+i}" ${a+i===Math.max(a,Math.min(oldB,n))?"selected":""}>${a+i}</option>`).join("");
    const b=+$("akhir").value;
    $("jumlah").value=(b>=a)?(b-a+1):"";
  };
  $("surah").onchange=()=>{updateAyatFields(true)};
  $("awal").onchange=()=>{updateAyatFields()};
  $("akhir").onchange=()=>{updateAyatFields()};
  updateAyatFields();
  if(editId)$("cx").onclick=()=>{editId=null;go("hist")};
  $("f").onsubmit=ev=>{
    ev.preventDefault();
    try{
      const jenis=document.querySelector('input[name="j"]:checked')?.value || "Ziyadah";
      const nilai=document.querySelector('input[name="n"]:checked')?.value || "Lancar";
      const surah=Number($("surah").value), a=Number($("awal").value), b=Number($("akhir").value);
      const batas=SURAH[surah-1]?.[1];
      if(!batas){toast("Silakan pilih surah terlebih dahulu.");return;}
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<a||b>batas){
        toast(`Isi ayat 1 sampai ${batas}, dan ayat akhir tidak boleh lebih kecil dari ayat awal.`);return;
      }
      const pid=$("pid").value, tgl=$("tgl").value;
      if(!pid||!tgl){toast("Nama santri dan tanggal setoran wajib diisi.");return;}
      const o={pid,jenis,surah,awal:a,akhir:b,materi:`Surah ${SURAH[surah-1][0]} ayat ${a}${b!==a?"–"+b:""}`,ayat:jenis==="Ziyadah"?(b-a+1):0,tgl,nilai,catatan:$("cat").value.trim()};
      if(editId){
        const existing=S.setoran.find(s=>s.id===editId);
        if(!existing) throw new Error("Data setoran yang akan diubah tidak ditemukan.");
        Object.assign(existing,o);
      }else{
        S.setoran.push({id:uid(),...o});
      }
      save();
      editId=null;
      go("hist");
      toast("Setoran berhasil disimpan.");
    }catch(err){
      console.error("Gagal menyimpan setoran:",err);
      toast("Setoran belum tersimpan. Periksa penyimpanan browser lalu coba lagi.");
    }
  };
}

function filtered(){const q=flt.q.toLowerCase();return sorted(S.setoran).filter(s=>(!flt.nilai||s.nilai===flt.nilai)&&(!flt.jenis||s.jenis===flt.jenis)&&(!q||(pName(s.pid)+" "+s.materi).toLowerCase().includes(q)))}
function rowsHtml(l,acts=true){return l.length?l.map(s=>`<tr><td>${fmt(s.tgl)}</td><td><strong>${esc(pName(s.pid))}</strong></td><td><span class="tag">${esc(s.jenis)}</span></td><td>${esc(s.materi)}${s.jenis==="Ziyadah"&&s.ayat?`<small style="color:var(--mute);display:block">${s.ayat} ayat</small>`:""}</td><td>${chip(s.nilai)}</td><td>${esc(s.catatan)||"–"}</td>${acts?`<td class="act"><button class="btn ghost sm" data-e="${s.id}">Ubah</button> <button class="btn danger sm" data-d="${s.id}">Hapus</button></td>`:""}</tr>`).join(""):`<tr><td colspan="7" class="empty">Tidak ada setoran yang cocok.</td></tr>`}
const THEAD=a=>`<thead><tr><th>Tanggal</th><th>Santri</th><th>Jenis</th><th>Materi</th><th>Nilai</th><th>Catatan</th>${a?"<th></th>":""}</tr></thead>`;
function hist(){
  $("view").innerHTML=`<div class="head"><div><h1>Riwayat setoran</h1><p class="lead" style="margin-bottom:12px">Cari, saring, ubah, atau hapus catatan.</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="jpg">Cetak rekap (JPG)</button><button class="btn sm" id="pr">Cetak rekap (PDF)</button></div></div>
   <div class="bar-tools"><input class="grow" id="q" type="search" placeholder="Cari nama atau materi" aria-label="Cari" value="${esc(flt.q)}">
   <select id="fn" aria-label="Penilaian"><option value="">Semua penilaian</option>${NILAI.map(n=>`<option ${flt.nilai===n?"selected":""}>${n}</option>`).join("")}</select>
   <select id="fj" aria-label="Jenis"><option value="">Semua jenis</option><option ${flt.jenis==="Ziyadah"?"selected":""}>Ziyadah</option><option ${flt.jenis==="Muroja'ah"?"selected":""}>Muroja'ah</option></select></div>
   <div class="card tbl" style="padding:6px 10px"><table>${THEAD(true)}<tbody id="tb">${rowsHtml(filtered())}</tbody></table></div>`;
  const body=()=>{$("tb").innerHTML=rowsHtml(filtered());bind()};
  $("q").oninput=e=>{flt.q=e.target.value;body()};$("fn").onchange=e=>{flt.nilai=e.target.value;body()};$("fj").onchange=e=>{flt.jenis=e.target.value;body()};
  $("jpg").onclick=()=>exportJPG(filtered(),"Rekap Setoran Hafalan");$("pr").onclick=()=>printRecap(filtered(),"Rekap Setoran Hafalan");
  const bind=()=>{
   $("tb").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{editId=b.dataset.e;go("add")});
   $("tb").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(await ask("Hapus setoran ini? Tindakan ini tidak bisa dibatalkan.")){S.setoran=S.setoran.filter(s=>s.id!==b.dataset.d);save();body();toast("Setoran dihapus")}})};
  bind();
}

function pesertaView(){
  $("view").innerHTML=`<h1>Peserta</h1><p class="lead">Daftar peserta tetap.</p>
  <div class="grid pgrid">${S.peserta.map(p=>{const l=S.setoran.filter(s=>s.pid===p.id),a=ayatOf(l),pc=p.target?Math.min(100,Math.round(a/p.target*100)):0;return `<button class="card pcard" data-p="${p.id}"><h3>${esc(p.nama)}</h3><small style="color:var(--mute)">${l.length} setoran · ${a} dari ${p.target} ayat</small><div class="bar"><i style="width:${pc}%"></i></div><small style="color:var(--em-d);font-weight:600">${pc}% dari target</small></button>`}).join("")}</div>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{selP=b.dataset.p;render();scrollTo(0,0)});
}
function detail(){
  const p=S.peserta.find(x=>x.id===selP),l=sorted(S.setoran.filter(s=>s.pid===p.id)),a=ayatOf(l),pc=p.target?Math.min(100,Math.round(a/p.target*100)):0;
  const c=n=>l.filter(s=>s.nilai===n).length;
  $("view").innerHTML=`<button class="back" id="bk">← Semua peserta</button><div class="head"><div><h1>${esc(p.nama)}</h1><p class="lead" style="margin-bottom:12px">${a} dari ${p.target} ayat tercapai (${pc}%)</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="et">Ubah target</button><button class="btn ghost sm" id="jpg">Cetak rekap (JPG)</button><button class="btn sm" id="pr">Cetak rekap (PDF)</button></div></div>
   <div class="card" style="margin-bottom:14px"><div class="bar"><i style="width:${pc}%"></i></div>
   <p style="margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap"><span class="chip Lancar">Lancar ${c("Lancar")}</span><span class="chip Cukup">Cukup Lancar ${c("Cukup Lancar")}</span><span class="chip Ulang">Perlu Diulang ${c("Perlu Diulang")}</span><span class="tag">Total ${l.length} setoran</span></p></div>
   <div class="card tbl" style="padding:6px 10px"><table>${THEAD(false)}<tbody>${rowsHtml(l,false).replace(/colspan="7"/,'colspan="6"')}</tbody></table></div>`;
  $("bk").onclick=()=>{selP=null;render()};
  $("jpg").onclick=()=>exportJPG(l,"Rekap Hafalan – "+p.nama);$("pr").onclick=()=>printRecap(l,"Rekap Hafalan – "+p.nama);
  $("et").onclick=()=>{const v=prompt?null:null;const n=+(window.prompt?window.prompt("Target jumlah ayat:",p.target):0);if(n>0){p.target=n;save();render()}};
  $("dp").onclick=async()=>{if(await ask(`Hapus ${p.nama} beserta seluruh setorannya?`)){S.peserta=S.peserta.filter(x=>x.id!==p.id);S.setoran=S.setoran.filter(s=>s.pid!==p.id);save();selP=null;render()}};
}

function xmlEsc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
function exportJPG(l,title){
  const W=1400, pad=48, cols=[150,180,150,390,190,244], headers=["Tanggal","Santri","Jenis","Materi","Penilaian","Catatan"];
  const wrap=(value,max)=>{const words=String(value??"–").split(/\s+/),out=[];let line="";for(const word of words){const test=line?line+" "+word:word;if(test.length>max&&line){out.push(line);line=word}else line=test}if(line)out.push(line);return out.length?out:["–"]};
  const rows=l.length?sorted(l).map(s=>[fmt(s.tgl),pName(s.pid),s.jenis,s.materi,s.nilai,s.catatan||"–"]):[];
  let y=190;const rowData=rows.map(r=>{const lines=r.map((v,i)=>wrap(v,[18,22,18,52,22,30][i]));const h=Math.max(58,...lines.map(a=>a.length*25+24));const o={lines,y,h};y+=h;return o});
  const H=y+pad+25;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#ffffff"/><rect x="0" y="0" width="${W}" height="16" fill="#0a684d"/><text x="${pad}" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#123b2e">${xmlEsc(title)}</text><text x="${pad}" y="126" font-family="Arial,sans-serif" font-size="21" fill="#52645d">Dicetak ${xmlEsc(fmt(today()))}  •  ${rows.length} setoran  •  ${ayatOf(l)} ayat baru</text>`;
  let x=pad;svg+=`<rect x="${pad}" y="155" width="${W-pad*2}" height="48" rx="8" fill="#e8f2ee"/>`;
  headers.forEach((h,i)=>{svg+=`<text x="${x+12}" y="186" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#174c3b">${xmlEsc(h)}</text>`;x+=cols[i]});
  rowData.forEach((r,ri)=>{svg+=`<rect x="${pad}" y="${r.y}" width="${W-pad*2}" height="${r.h}" fill="${ri%2===0?"#ffffff":"#f7faf8"}"/><path d="M ${pad} ${r.y+r.h} H ${W-pad}" stroke="#dce6e1" stroke-width="2"/>`;let cx=pad;r.lines.forEach((lines,i)=>{lines.forEach((line,j)=>{svg+=`<text x="${cx+12}" y="${r.y+30+j*25}" font-family="Arial,sans-serif" font-size="17" fill="#263b33">${xmlEsc(line)}</text>`});cx+=cols[i]})});
  if(!rows.length)svg+=`<text x="${pad+12}" y="244" font-family="Arial,sans-serif" font-size="20" fill="#66756e">Belum ada data setoran.</text>`;
  svg+="</svg>";
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{try{const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const ctx=c.getContext("2d");ctx.scale(2,2);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);c.toBlob(b=>{if(b){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(title.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"")||"rekap-hafalan")+".jpg";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}URL.revokeObjectURL(url)},"image/jpeg",0.95)}catch(e){toast("Gagal membuat gambar JPG");URL.revokeObjectURL(url)}};
  img.onerror=()=>{toast("Gagal membuat gambar JPG");URL.revokeObjectURL(url)};img.src=url;
}
function recapHtml(l,title){
  const a=ayatOf(l);
  return `<h1>${esc(title)}</h1><p>Dicetak ${fmt(today())} · ${l.length} setoran · ${a} ayat baru</p><table>${THEAD(false)}<tbody>${rowsHtml(l,false).replace(/colspan="7"/,'colspan="6"')}</tbody></table>`;
}
async function printRecap(l,title){
  $("print").innerHTML=recapHtml(l,title);
  try{window.print()}catch(e){toast("Tidak dapat membuka dialog cetak")}
}

load();render();
setInterval(cleanExpiredQuotes,60*1000);
