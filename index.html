<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngaji Bareng · Buku Setoran Hafalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea;
  --surface:#fffefb;
  --ink:#1d2b25;
  --mute:#62726a;
  --line:#e3decb;
  --em:#0f6b4f;
  --em-d:#0a4f3a;
  --sage:#e1ece2;
  --sage-d:#b7cfbc;
  --ok:#0f6b4f;
  --ok-bg:#dcf0e5;
  --mid:#8a6410;
  --mid-bg:#f6ebc9;
  --bad:#a2432f;
  --bad-bg:#f6dcd4;
  --shadow:0 10px 28px rgba(15,61,46,.06);
  --shadow-lg:0 18px 42px rgba(10,45,34,.14);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1713;
    --surface:#16201b;
    --ink:#eaf1ec;
    --mute:#9cb0a5;
    --line:#27362f;
    --em:#4bc094;
    --em-d:#7dd7b3;
    --sage:#1e2f27;
    --sage-d:#324b3c;
    --ok:#7dd7b3;
    --ok-bg:#1c352a;
    --mid:#e4c05c;
    --mid-bg:#362e15;
    --bad:#ee9a86;
    --bad-bg:#3d201a;
    --shadow:0 10px 28px rgba(0,0,0,.28);
    --shadow-lg:0 20px 44px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%, rgba(15,107,79,.08), transparent 42%),
    radial-gradient(circle at 92% 12%, rgba(138,100,16,.06), transparent 38%),
    var(--bg);
  color:var(--ink);
  font:15.5px/1.58 Figtree,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.hidden{display:none!important}

/* Halaman Publik (sebelum login) */
.pub-wrap{
  min-height:100vh;
  padding:22px clamp(14px,4vw,40px) 48px;
  max-width:1060px;
  margin:0 auto;
}
.pub-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}
.pub-brand{
  font-family:Amiri,serif;
  font-size:32px;
  line-height:1.1;
  color:var(--em-d);
  margin:0;
}
.pub-hero{text-align:center;padding:26px 16px}
.pub-hero h2{
  font-family:Amiri,serif;
  font-size:28px;
  color:var(--em-d);
  margin:0 0 4px;
}

/* Reels */
.reel-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
  margin-top:14px;
}
.reel-card{
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--bg);
  padding:10px;
  overflow:hidden;
}
.reel-frame{
  width:100%;
  aspect-ratio:9/16;
  border:0;
  border-radius:11px;
  background:#000;
  display:block;
}
.reel-title{font-weight:700;font-size:14px;margin:8px 2px 2px;overflow-wrap:anywhere}
.reel-thumb-box{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  border-radius:11px;
  overflow:hidden;
  background:#111915;
  cursor:pointer;
}
.reel-thumb-img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.reel-thumb-fallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  padding:16px;
  text-align:center;
  color:#eaf4ee;
  background:radial-gradient(circle at 75% 20%, rgba(75,192,148,.28), transparent 55%), linear-gradient(150deg, #0a4f3a 0%, #101d17 100%);
}
.reel-thumb-badge{
  position:absolute;
  top:9px;
  left:9px;
  z-index:2;
  background:rgba(10,20,15,.78);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  backdrop-filter:blur(4px);
}
.reel-play-btn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:2;
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  background:rgba(15,107,79,.92);
  color:#fff;
  font-size:20px;
  display:grid;
  place-items:center;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
  transition:transform .16s ease, background-color .16s ease;
}
.reel-thumb-box:hover .reel-play-btn{
  transform:translate(-50%,-50%) scale(1.06);
  background:var(--em);
}
.reel-link-preview{
  margin-top:9px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  background:var(--surface);
  display:none;
  gap:10px;
  align-items:center;
}
.reel-link-preview.show{display:flex}
.reel-link-preview img{
  width:56px;
  height:88px;
  object-fit:cover;
  border-radius:8px;
  background:#111915;
  flex:none;
}
.reel-preview{
  display:none;
  width:min(100%,200px);
  aspect-ratio:9/16;
  border-radius:12px;
  margin-top:9px;
  background:#000;
}
.upload-bar{
  display:none;
  height:9px;
  background:var(--sage);
  border-radius:999px;
  overflow:hidden;
  margin:10px 0 4px;
}
.upload-bar>i{
  display:block;
  height:100%;
  width:0;
  background:var(--em);
  border-radius:999px;
  transition:width .2s ease;
}

/* Slide (carousel) */
.car{position:relative}
.car-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start}
.car.reels .car-slide{flex:0 0 min(78%,270px)}
.car .quote-item{height:100%;display:flex;flex-direction:column;justify-content:center;padding:22px 24px}
.car .quote-body{font-size:17px;line-height:1.7;text-align:center;margin:12px 0 14px}
.car .quote-foot{justify-content:center}
.car .reel-card{height:100%}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--em-d);font-size:22px;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.car-btn.prev{left:-6px}
.car-btn.next{right:-6px}
.car-dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.car-dot{width:7px;height:7px;border-radius:50%;background:var(--sage-d);transition:all .2s ease}
.car-dot.on{width:20px;border-radius:999px;background:var(--em)}

/* Layar Masuk */
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px;
}
.login-card{
  width:100%;
  max-width:410px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px 26px;
  box-shadow:var(--shadow-lg);
}
.login-brand{
  font-family:Amiri,serif;
  font-size:34px;
  line-height:1.12;
  color:var(--em-d);
  margin:0 0 6px;
}
.login-sub{
  color:var(--mute);
  margin:0 0 22px;
  font-size:14px;
}
.field{margin-bottom:15px}
.field:last-of-type{margin-bottom:14px}
label{
  display:block;
  font-weight:600;
  font-size:13.5px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--em);
  background:var(--surface);
  box-shadow:0 0 0 3px rgba(15,107,79,.12);
}
.pass-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.pass-wrap input{padding-right:44px}
.eye-btn{
  position:absolute;
  right:8px;
  background:none;
  border:0;
  color:var(--mute);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:color .15s ease, background-color .15s ease;
}
.eye-btn:hover{
  color:var(--ink);
  background:rgba(0,0,0,.06);
}
.remember-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  font-size:13.5px;
}
.remember-row input[type="checkbox"]{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--em);
  cursor:pointer;
}
.remember-row label{
  margin:0;
  font-weight:500;
  cursor:pointer;
}
textarea{min-height:92px;resize:vertical}
.err-box{
  background:var(--bad-bg);
  color:var(--bad);
  border:1px solid transparent;
  border-radius:12px;
  padding:10px 12px;
  font-size:13.5px;
  font-weight:600;
  margin-bottom:14px;
}

/* Tata Letak Utama */
.app{
  display:grid;
  grid-template-columns:244px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:linear-gradient(180deg, var(--em-d) 0%, #073c2c 100%);
  color:#eaf4ee;
  padding:28px 16px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:8px;
  box-shadow:4px 0 24px rgba(0,0,0,.06);
}
.brand{
  font-family:Amiri,serif;
  font-size:30px;
  line-height:1.1;
  margin:0 8px 2px;
}
.brand-sub{
  font-size:12.5px;
  opacity:.78;
  margin:0 8px 14px;
}
.user-pill{
  margin:0 4px 10px;
  padding:11px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
}
.user-pill small{display:block;opacity:.76;font-size:11.5px;letter-spacing:.02em}
.user-pill strong{display:block;font-size:14.5px;margin-top:2px}
.sync-badge{
  margin:0 4px 12px;
  padding:7px 11px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  font-size:12px;
  display:flex;
  align-items:center;
  gap:7px;
  opacity:.92;
}
.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#7dd7b3;
  flex:none;
}
.sync-dot.warn{background:#e4c05c}
.sync-dot.err{background:#ee9a86}
nav{display:flex;flex-direction:column;gap:4px}
nav button{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  border:0;
  color:inherit;
  padding:10px 12px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
  font-weight:500;
  font-size:14px;
  transition:background-color .16s ease, transform .16s ease;
}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:rgba(255,255,255,.1)}
nav button[aria-current=page]{
  background:var(--bg);
  color:#0a4f3a;
  font-weight:700;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.side-foot{
  margin-top:auto;
  display:grid;
  gap:8px;
  padding:0 4px;
}

main{
  padding:30px clamp(16px,3.5vw,42px) 56px;
  max-width:1060px;
  width:100%;
  min-width:0;
}
.top-bar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:22px;
}
h1{
  font-family:Amiri,serif;
  font-size:clamp(29px,4.2vw,39px);
  line-height:1.14;
  color:var(--em-d);
  margin:0 0 4px;
}
.lead{
  color:var(--mute);
  margin:0;
  font-size:14.5px;
  max-width:60ch;
}
.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-left:auto;
}
.top-logout-btn{
  border:1px solid var(--bad-bg);
  background:var(--bad-bg);
  color:var(--bad);
  padding:8px 14px;
  border-radius:10px;
  font-weight:600;
  font-size:13.5px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:filter .16s ease, transform .14s ease, background-color .16s ease;
  white-space:nowrap;
}
.top-logout-btn:hover{
  filter:brightness(.97);
}
.top-logout-btn:active{
  transform:translateY(1px);
}
h2{
  font-size:17px;
  margin:0;
  font-weight:700;
}
.sec-sub{
  color:var(--mute);
  font-size:13.5px;
  margin:4px 0 0;
}
.sec-head{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 22px;
  min-width:0;
  box-shadow:var(--shadow);
  transition:border-color .18s ease, transform .18s ease;
}
.stack{display:grid;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.stat b{
  display:block;
  font-size:31px;
  line-height:1.12;
  font-weight:700;
  color:var(--em-d);
  letter-spacing:-.02em;
}
.stat span{
  display:block;
  font-size:13.5px;
  color:var(--mute);
  margin-top:5px;
}
.stat.main{
  background:linear-gradient(135deg, var(--em-d) 0%, var(--em) 100%);
  border-color:transparent;
  color:#eaf4ee;
}
.stat.main b{color:#fff}
.stat.main span{color:#d2ebdc}

.bar{
  height:9px;
  background:var(--sage);
  border-radius:999px;
  overflow:hidden;
  margin-top:11px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg, var(--em) 0%, var(--em-d) 100%);
  border-radius:999px;
  transition:width .3s ease;
}
.stat.main .bar{background:rgba(255,255,255,.22)}
.stat.main .bar>i{background:#d4f0df}

.prog-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:var(--bg);
}
.prog-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}
.prog-top strong{font-size:15.5px}
.prog-top span{font-size:14px;font-weight:700;color:var(--em-d)}
.prog-meta{
  font-size:13px;
  color:var(--mute);
  margin-top:4px;
}

/* Tombol buka/tutup formulir Quotes dan Materi */
.compose-toggle{
  margin:0 0 16px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--bg);
  overflow:hidden;
}
.compose-toggle summary{
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 15px;
  cursor:pointer;
  font-weight:700;
  color:var(--em-d);
  user-select:none;
}
.compose-toggle summary::-webkit-details-marker{display:none}
.compose-toggle summary::after{
  content:"+";
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  flex:none;
  border-radius:50%;
  background:var(--sage);
  color:var(--em-d);
  font-size:21px;
  line-height:1;
}
.compose-toggle[open] summary::after{content:"−"}
.compose-toggle .compose-content{
  padding:0 15px 15px;
}
.compose-toggle form{margin:0}
.compose-toggle .field:last-child{margin-bottom:12px}

.quote-box{
  display:grid;
  gap:12px;
  margin-bottom:16px;
}
.quote-item{
  border:1px solid var(--line);
  border-left:4px solid var(--em);
  border-radius:14px;
  padding:14px 16px;
  background:var(--bg);
}
.quote-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:13.5px;
}
.quote-time{color:var(--mute);font-size:12px}
.quote-body{
  margin:8px 0 12px;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.quote-foot{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.like-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .16s ease;
}
.like-btn:hover{border-color:var(--sage-d)}
.like-btn.liked{
  border-color:#d88b9c;
  background:#fff0f3;
  color:#b4234b;
}

/* Kartu Sapaan di Beranda */
.welcome-banner{
  display:flex;
  align-items:center;
  gap:18px;
  padding:16px 20px;
}
.welcome-banner-text h2{
  font-family:Amiri,serif;
  font-size:24px;
  color:var(--em-d);
  margin:0 0 4px;
}
.welcome-banner-text p{
  margin:0;
  color:var(--mute);
  font-size:14px;
}

/* Materi Belajar di Beranda */
.materi-list{
  display:grid;
  gap:12px;
  margin-top:14px;
}
.materi-card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px 17px;
  background:var(--bg);
}
.materi-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}
.materi-title{
  margin:4px 0 0;
  font-size:16px;
  font-weight:700;
}
.materi-photo{
  display:block;
  width:min(100%,360px);
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:13px;
  margin:12px 0;
  border:1px solid var(--line);
  background:var(--surface);
}
.materi-photo-preview{
  display:none;
  width:min(100%,240px);
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:12px;
  margin-top:9px;
  border:1px solid var(--line);
}
.materi-body{
  margin:8px 0 10px;
  font-size:14.5px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.materi-link{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:13.5px;
  font-weight:600;
  color:var(--em-d);
  text-decoration:none;
  word-break:break-all;
}
.materi-link:hover{text-decoration:underline}

.list{display:flex;flex-direction:column}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0;padding-top:2px}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

.done-surah-list{
  display:grid;
  gap:10px;
}
.done-group{
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 15px;
  background:var(--bg);
}
.done-date{
  font-size:13px;
  font-weight:700;
  color:var(--em-d);
  margin-bottom:8px;
}
.done-items{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.done-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 11px;
  border-radius:999px;
  background:var(--ok-bg);
  color:var(--ok);
  font-size:13px;
  font-weight:600;
}

.chip{
  display:inline-block;
  font-size:12.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.Lancar{background:var(--ok-bg);color:var(--ok)}
.Cukup{background:var(--mid-bg);color:var(--mid)}
.Ulang{background:var(--bad-bg);color:var(--bad)}
.tag{
  display:inline-block;
  background:var(--sage);
  color:var(--em-d);
  font-size:12.5px;
  font-weight:600;
  padding:2px 9px;
  border-radius:999px;
}

.btn{
  border:1px solid var(--em);
  background:var(--em);
  color:#fff;
  padding:9.5px 16px;
  border-radius:11px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:filter .16s ease, transform .14s ease, background-color .16s ease;
}
@media (prefers-color-scheme:dark){
  .btn{color:#091510}
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{
  background:transparent;
  color:var(--em-d);
  border-color:var(--sage-d);
}
.btn.light{
  background:rgba(255,255,255,.14);
  color:#fff;
  border-color:rgba(255,255,255,.28);
}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{
  background:transparent;
  color:var(--bad);
  border-color:var(--bad-bg);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.form-grid .full{grid-column:1/-1}
.readonly-box{
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  font-weight:600;
}
.ayat-summary{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  background:var(--sage);
  color:var(--em-d);
  font-size:13px;
  font-weight:700;
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500;font-size:14px}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{
  display:block;
  padding:8.5px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
  cursor:pointer;
  transition:all .16s ease;
}
.seg input:checked+span{
  background:var(--sage);
  border-color:var(--em);
  color:var(--em-d);
  font-weight:700;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px}
th,td{
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:14px;
}
th{color:var(--mute);font-weight:600;font-size:12.5px}
tbody tr:hover{background:rgba(15,107,79,.03)}
td.act{white-space:nowrap;text-align:right}
.empty{
  text-align:center;
  color:var(--mute);
  padding:28px 12px;
  font-size:14px;
}
.back{
  background:none;
  border:0;
  color:var(--em-d);
  font-weight:600;
  font-size:14px;
  padding:0 0 10px;
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--em-d);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:600;
  font-size:13.5px;
  z-index:80;
  box-shadow:var(--shadow-lg);
}
dialog{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--surface);
  color:var(--ink);
  max-width:420px;
  width:calc(100% - 32px);
  padding:22px;
  box-shadow:var(--shadow-lg);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-act{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:16px;
}
#print{display:none}

@media (max-width:900px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{display:block}
  aside{
    position:fixed;
    left:0;right:0;bottom:0;top:auto;
    height:auto;
    flex-direction:row;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:40;
    box-shadow:0 -4px 20px rgba(0,0,0,.14);
  }
  .brand,.brand-sub,.user-pill,.sync-badge{display:none}
  .side-foot{
    margin-top:0;
    display:flex;
    align-items:center;
    padding:0 2px;
    flex:none;
  }
  .side-foot .btn.sm{
    padding:7px 9px;
    font-size:11.5px;
    border-radius:9px;
    white-space:nowrap;
  }
  nav{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
  nav button{
    flex-direction:column;
    gap:2px;
    font-size:11px;
    padding:6px 2px;
    flex:1;
    align-items:center;
  }
  nav button svg{width:17px;height:17px}
  main{padding:20px 14px 92px}
  .card{padding:17px 16px;border-radius:16px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){
  .grid-2,.grid-4,.form-grid,.filters{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .login-wrap,.app,.toast,dialog,.pub-wrap{display:none!important}
  #print{display:block;font-family:Figtree,sans-serif}
  #print h1{color:#0a4f3a}
  #print table{min-width:0}
  #print th,#print td{font-size:12px;border-bottom:1px solid #bbb}
}

function getSurahInfo(surahNum){
  const idx = Number(surahNum) - 1;
  if(idx < 0 || idx >= SURAH.length) return null;
  return { no: idx + 1, name: SURAH[idx][0], totalAyat: SURAH[idx][1] };
}

function buildAyatOptions(totalAyat, selected){
  const max = Math.max(1, Number(totalAyat) || 1);
  const sel = Math.max(1, Math.min(max, Number(selected) || 1));
  const opts = [];
  for(let i = 1; i <= max; i++){
    opts.push(`<option value="${i}" ${i === sel ? "selected" : ""}>Ayat ${i}</option>`);
  }
  return opts.join("");
}

function getCompletedSurahByDate(list){
  const bySurah = new Map();
  for(const s of list){
    const info = getSurahInfo(s.surah);
    if(!info) continue;
    const awal = Number(s.awal) || 1;
    const akhir = Number(s.akhir) || 1;
    const isFull = awal <= 1 && akhir >= info.totalAyat;
    if(!isFull) continue;

    const prev = bySurah.get(info.no);
    if(!prev || String(s.tgl || "").localeCompare(prev.tgl) > 0){
      bySurah.set(info.no, {
        no: info.no,
        name: info.name,
        totalAyat: info.totalAyat,
        tgl: s.tgl || today()
      });
    }
  }

  const grouped = new Map();
  for(const item of bySurah.values()){
    if(!grouped.has(item.tgl)) grouped.set(item.tgl, []);
    grouped.get(item.tgl).push(item);
  }

  return [...grouped.entries()]
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([tgl, surahs])=>({
      tgl,
      surahs: surahs.sort((a,b)=>a.no - b.no)
    }));
}

/* ===== Sinkronisasi Firebase per-item (anti saling menimpa) ===== */
const COLS = ["peserta","setoran","quotes","materi","reels"];
const emptySync = () => ({ peserta:{}, setoran:{}, quotes:{}, materi:{}, reels:{} });
let lastSynced = emptySync();
const toMap = arr => Object.fromEntries((arr || []).map(x => [x.id, x]));
const fromMap = obj => obj ? Object.values(obj) : [];
const snapshotMaps = () => JSON.parse(JSON.stringify(
  Object.fromEntries(COLS.map(c => [c, toMap(S[c])]))
));

function buildUpdates(){
  const ups = {};
  for(const col of COLS){
    const cur = toMap(S[col]);
    const prev = lastSynced[col] || {};
    for(const id in cur){
      if(JSON.stringify(cur[id]) !== JSON.stringify(prev[id])) ups[`${col}/${id}`] = cur[id];
    }
    for(const id in prev){
      if(!(id in cur)) ups[`${col}/${id}`] = null;
    }
  }
  return ups;
}

async function pushFirebaseState(){
  if(!dbRef) return false;
  const ups = buildUpdates();
  if(!Object.keys(ups).length) return true;
  const snap = snapshotMaps();
  try{
    await update(dbRef, ups);
    lastSynced = snap;
    return true;
  }catch(err){
    console.error("Firebase write error:", err);
    toast("Gagal menyimpan ke server. Periksa Rules Firebase.");
    return false;
  }
}

function applyRemote(val){
  applyingRemote = true;
  S = normalizeState({
    peserta: fromMap(val?.peserta),
    setoran: fromMap(val?.setoran),
    quotes:  fromMap(val?.quotes),
    materi:  fromMap(val?.materi),
    reels:   fromMap(val?.reels),
    updatedAt: Date.now()
  });
  lastSynced = snapshotMaps();
  saveLocal();
  applyingRemote = false;
  if(activeRole && !uploading){
    const el = document.activeElement;
    const typing = el && $("view").contains(el) && /INPUT|TEXTAREA|SELECT/.test(el.tagName);
    if(!typing) render();
  }
}

// Setelah login: baca & tulis semua data (termasuk setoran hafalan).
async function startFullSync(){
  stopPublic();
  stopFull();
  if(!fbDb || !fbCfg) return;
  dbRef = ref(fbDb, `rooms/${fbCfg.room}/v2`);
  try{
    const snap = await get(dbRef);
    if(snap.exists()){
      applyRemote(snap.val());
    }else{
      const old = await get(ref(fbDb, `rooms/${fbCfg.room}/state`));
      if(old.exists()) S = normalizeState(old.val());
    }

    // Migrasi sekali jalan: pindahkan data lama di browser ke Firebase, lalu hapus dari browser.
    try{
      const legacyRaw = localStorage.getItem(STORAGE_KEY);
      if(legacyRaw){
        const legacy = normalizeState(JSON.parse(legacyRaw));
        for(const c of ["setoran","quotes","materi"]){
          const ids = new Set(S[c].map(x => x.id));
          legacy[c].forEach(x => { if(!ids.has(x.id)) S[c].push(x); });
        }
        if(await pushFirebaseState()) localStorage.removeItem(STORAGE_KEY);
      }else if(!snap.exists()){
        await pushFirebaseState();
      }
    }catch(e){ console.error("Migrasi data lokal gagal:", e); }

    unsubDb = onValue(dbRef, s => {
      if(s.exists()) applyRemote(s.val());
    }, err => {
      console.error("Firebase listener error:", err);
      toast("Tidak bisa membaca data server. Periksa Rules Firebase.");
    });
    if(activeRole && !uploading) render();
  }catch(err){
    console.error("Full sync error:", err);
    toast("Gagal terhubung ke Firebase.");
  }
}

/* ===== Reels Link (YouTube, Instagram, TikTok) ===== */
function parseReelLink(raw){
  const url = safeUrl(raw);
  if(!url) return null;
  let u;
  try{ u = new URL(url); }catch(e){ return null; }
  const host = u.hostname.replace(/^www\.|^m\.|^vm\.|^vt\./i, "").toLowerCase();

  let ytId = null;
  if(host === "youtu.be"){
    ytId = u.pathname.replace(/^\//, "").split("/")[0] || null;
  }else if(host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")){
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{6,})/);
    ytId = m ? m[1] : u.searchParams.get("v");
  }
  if(ytId){
    const cleanId = ytId.replace(/[^\w-]/g, "");
    return {
      platform: "YouTube",
      url,
      embedUrl: `https://www.youtube.com/embed/${encodeURIComponent(cleanId)}?autoplay=1&rel=0`,
      thumb: `https://i.ytimg.com/vi/${encodeURIComponent(cleanId)}/hqdefault.jpg`,
      canEmbed: true
    };
  }

  if(host.endsWith("instagram.com")){
    const m = u.pathname.match(/^\/(?:reels?|reel|p|tv)\/([A-Za-z0-9_-]+)/);
    const code = m ? m[1] : "";
    return {
      platform: "Instagram",
      url,
      embedUrl: code ? `https://www.instagram.com/reel/${encodeURIComponent(code)}/embed/` : "",
      thumb: code ? `https://www.instagram.com/p/${encodeURIComponent(code)}/media/?size=l` : "",
      canEmbed: Boolean(code)
    };
  }

  if(host.endsWith("tiktok.com")){
    const m = u.pathname.match(/\/video\/(\d+)/);
    const vid = m ? m[1] : "";
    return {
      platform: "TikTok",
      url,
      embedUrl: vid ? `https://www.tiktok.com/embed/v2/${encodeURIComponent(vid)}` : "",
      thumb: "",
      canEmbed: Boolean(vid)
    };
  }

  return {
    platform: host || "Video",
    url,
    embedUrl: "",
    thumb: "",
    canEmbed: false
  };
}

/* ===== Slide (carousel) ===== */
const slidePos = {};
let carTimers = [];
function stopCarTimers(){ carTimers.forEach(clearInterval); carTimers = []; }

function carousel(id, slides, opts = {}){
  if(!slides.length) return "";
  return `<div class="car ${opts.cls || ""}" data-car="${id}" ${opts.auto ? 'data-auto="1"' : ""}>
    <div class="car-track">${slides.map(h => `<div class="car-slide">${h}</div>`).join("")}</div>
    ${slides.length > 1 ? `<button type="button" class="car-btn prev" aria-label="Sebelumnya">‹</button>
    <button type="button" class="car-btn next" aria-label="Berikutnya">›</button>
    <div class="car-dots">${slides.map((_, i) => `<span class="car-dot${i === 0 ? " on" : ""}"></span>`).join("")}</div>` : ""}
  </div>`;
}

function initCarousels(root){
  stopCarTimers();
  root.querySelectorAll(".car").forEach(car => {
    const id = car.dataset.car;
    const track = car.querySelector(".car-track");
    const slides = [...track.children];
    const dots = [...car.querySelectorAll(".car-dot")];
    const step = () => slides.length > 1 ? (slides[1].offsetLeft - slides[0].offsetLeft) : track.clientWidth;
    const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
    const idx = () => atEnd() && slides.length > 1 ? slides.length - 1 : Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / (step() || 1))));
    const goto = i => track.scrollTo({ left: i * step(), behavior: "smooth" });
    const paint = () => { const i = idx(); slidePos[id] = i; dots.forEach((d, k) => d.classList.toggle("on", k === i)); };
    const next = () => atEnd() ? track.scrollTo({ left: 0, behavior: "smooth" }) : goto(Math.min(slides.length - 1, Math.round(track.scrollLeft / (step() || 1)) + 1));
    const prev = () => track.scrollLeft <= 2 ? track.scrollTo({ left: track.scrollWidth, behavior: "smooth" }) : goto(Math.max(0, Math.round(track.scrollLeft / (step() || 1)) - 1));

    if(slidePos[id]) track.scrollTo({ left: slidePos[id] * step(), behavior: "auto" });
    paint();
    track.addEventListener("scroll", paint, { passive: true });
    car.querySelector(".prev")?.addEventListener("click", prev);
    car.querySelector(".next")?.addEventListener("click", next);

    // Sembunyikan panah & titik jika semua slide sudah muat di layar
    if(track.scrollWidth <= track.clientWidth + 2){
      car.querySelectorAll(".car-btn,.car-dots").forEach(el => el.style.display = "none");
    }

    // Jeda video yang keluar dari layar
    if("IntersectionObserver" in window){
      const io = new IntersectionObserver(es => es.forEach(e => {
        if(e.intersectionRatio < 0.5) e.target.querySelectorAll("video").forEach(v => v.pause());
      }), { root: track, threshold: [0, 0.5] });
      slides.forEach(sl => io.observe(sl));
    }

    // Geser otomatis (khusus quotes di halaman publik)
    if(car.dataset.auto && slides.length > 1){
      let hold = false;
      car.addEventListener("pointerenter", () => hold = true);
      car.addEventListener("pointerleave", () => hold = false);
      carTimers.push(setInterval(() => { if(!hold && !document.hidden) next(); }, 6000));
    }
  });
}

async function bindPublicActions(){
  const root = $("publicView");
  root.querySelectorAll("[data-public-like]").forEach(btn => btn.addEventListener("click", async () => {
    const col = btn.dataset.publicLike, id = btn.dataset.itemId;
    if(!fbDb || !fbCfg || !fbAuth?.currentUser){ toast("Like publik belum siap. Aktifkan Anonymous Authentication di Firebase."); return; }
    const visitor = publicVisitorId();
    const reactionRef = ref(fbDb, `rooms/${fbCfg.room}/publicLikes/${col}/${id}/${visitor}`);
    btn.disabled = true;
    try{
      if(publicLikeInfo(col,id).mine) await remove(reactionRef);
      else await set(reactionRef, true);
    }catch(err){
      console.error("Public like error:", err);
      toast("Like belum tersimpan. Periksa Rules Firebase.");
    }finally{ btn.disabled = false; }
  }));
  root.querySelectorAll("[data-public-share]").forEach(btn => btn.addEventListener("click", async () => {
    const col = btn.dataset.publicShare, id = btn.dataset.itemId;
    const item = (S[col] || []).find(x=>x.id===id);
    if(!item) return;
    const title = col === "quotes" ? "Quote Ngaji Bareng" : col === "reels" ? (item.judul || "Video Ngaji Bareng") : (item.judul || "Materi Ngaji Bareng");
    const shareUrl = new URL(window.location.href); shareUrl.hash = `${col}-${id}`;
    const data = { title, text: col === "quotes" ? item.text : (item.judul || "Lihat berbagi dari Ngaji Bareng"), url:shareUrl.href };
    try{
      if(navigator.share) await navigator.share(data);
      else if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(`${data.text}\n${data.url}`); toast("Tautan berhasil disalin."); }
      else { window.prompt("Salin tautan ini:", shareUrl.href); }
    }catch(err){ if(err?.name !== "AbortError") { console.error("Share error:",err); toast("Tidak dapat membagikan tautan."); } }
  }));
}

async function imageToSquareDataUrl(file){
  if(!file || !file.type.startsWith("image/")) return "";
  if(file.size > 10 * 1024 * 1024) throw new Error("Ukuran foto maksimal 10 MB.");
  const objectUrl = URL.createObjectURL(file);
  try{
    const img = await new Promise((resolve,reject)=>{
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error("Foto tidak dapat dibaca."));
      el.src = objectUrl;
    });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = Math.floor((img.naturalWidth - side) / 2);
    const sy = Math.floor((img.naturalHeight - side) / 2);
    const canvas = document.createElement("canvas");
    canvas.width = 720;
    canvas.height = 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, sx, sy, side, side, 0, 0, 720, 720);
    return canvas.toDataURL("image/jpeg", 0.78);
  }finally{
    URL.revokeObjectURL(objectUrl);
  }
}

async function compressVideoIfNeeded(file, onStatus) {
  if (file.size <= 6 * 1024 * 1024 || typeof MediaRecorder === "undefined") {
    return file;
  }

  onStatus("Mengoptimalkan ukuran video agar cepat terkirim…");

  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.src = url;
    video.muted = true;
    video.playsInline = true;

    video.onloadedmetadata = () => {
      const maxW = 720;
      const scale = video.videoWidth > maxW ? maxW / video.videoWidth : 1;
      const w = Math.round(video.videoWidth * scale);
      const h = Math.round(video.videoHeight * scale);

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");

      const canvasStream = canvas.captureStream(24);
      try {
        const vidStream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
        if (vidStream) {
          vidStream.getAudioTracks().forEach(t => canvasStream.addTrack(t));
        }
      } catch (e) {}

      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")
        ? "video/webm;codecs=vp8,opus"
        : (MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "");

      if (!mime) {
        URL.revokeObjectURL(url);
        resolve(file);
        return;
      }

      const chunks = [];
      const recorder = new MediaRecorder(canvasStream, {
        mimeType: mime,
        videoBitsPerSecond: 1_200_000
      });

      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        URL.revokeObjectURL(url);
        const blob = new Blob(chunks, { type: mime });
        if (blob.size > 0 && blob.size < file.size) {
          const ext = mime.includes("mp4") ? "mp4" : "webm";
          resolve(new File([blob], `reel.${ext}`, { type: mime }));
        } else {
          resolve(file);
        }
      };

      video.onplay = () => {
        recorder.start(250);
        const draw = () => {
          if (video.paused || video.ended) return;
          ctx.drawImage(video, 0, 0, w, h);
          const pct = Math.min(99, Math.round((video.currentTime / (video.duration || 1)) * 100));
          onStatus(`Mengompresi video… ${pct}%`);
          requestAnimationFrame(draw);
        };
        draw();
      };

      video.onended = () => {
        if (recorder.state !== "inactive") recorder.stop();
      };

      video.onerror = () => {
        URL.revokeObjectURL(url);
        resolve(file);
      };

      video.play().catch(() => {
        URL.revokeObjectURL(url);
        resolve(file);
      });
    };

    video.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(file);
    };
  });
}

function bindReelPlay(root){
  root.querySelectorAll("[data-reel-play]").forEach(box => {
    const activate = () => {
      const id = box.dataset.reelPlay;
      const r = (S.reels || []).find(x => x.id === id);
      if(!r) return;
      const info = parseReelLink(r.url);
      if(!info) return;
      if(info.canEmbed && info.embedUrl){
        const iframe = document.createElement("iframe");
        iframe.className = "reel-frame";
        iframe.src = info.embedUrl;
        iframe.title = r.judul || "Video reels";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        box.replaceWith(iframe);
      }else{
        window.open(info.url, "_blank", "noopener,noreferrer");
      }
    };
    box.addEventListener("click", activate);
    box.addEventListener("keydown", ev => {
      if(ev.key === "Enter" || ev.key === " "){
        ev.preventDefault();
        activate();
      }
    });
  });
}

function bindReelEvents(){
  bindReelPlay($("view"));

  const urlInp = $("reelUrlInput");
  const prevBox = $("reelLinkPreview");
  const prevImg = $("reelLinkPrevImg");
  const prevPlat = $("reelLinkPrevPlat");
  const prevNote = $("reelLinkPrevNote");

  const updatePreview = () => {
    if(!urlInp || !prevBox) return;
    const raw = urlInp.value.trim();
    if(!raw){
      prevBox.classList.remove("show");
      return;
    }
    const info = parseReelLink(raw);
    prevBox.classList.add("show");
    if(!info){
      prevPlat.textContent = "Tautan tidak valid";
      prevNote.textContent = "Masukkan tautan YouTube, Instagram, atau TikTok yang valid.";
      prevImg.style.display = "none";
      return;
    }
    prevPlat.textContent = info.platform;
    if(info.thumb){
      prevImg.src = info.thumb;
      prevImg.style.display = "block";
      prevImg.onerror = () => { prevImg.style.display = "none"; };
    }else{
      prevImg.style.display = "none";
    }
    prevNote.textContent = info.canEmbed
      ? "Siap diputar langsung saat diklik di Beranda publik."
      : "Akan dibuka di tab baru saat diklik.";
  };

  if(urlInp){
    urlInp.addEventListener("input", updatePreview);
    urlInp.addEventListener("change", updatePreview);
  }

  const rForm = $("reelLinkForm");
  if(rForm){
    rForm.addEventListener("submit", async e => {
      e.preventDefault();
      if(uploading) return;
      const judul = $("reelJudul").value.trim();
      const rawUrl = $("reelUrlInput").value.trim();
      const info = parseReelLink(rawUrl);
      if(!judul){ toast("Isi judul video dulu."); return; }
      if(!info){ toast("Masukkan link video YouTube, Instagram, atau TikTok yang valid."); return; }

      const submitBtn = $("reelLinkSubmit");
      uploading = true;
      if(submitBtn) submitBtn.disabled = true;

      try{
        S.reels = Array.isArray(S.reels) ? S.reels : [];
        S.reels.push({
          id: uid(),
          pid: activeRole,
          judul,
          url: info.url,
          thumb: info.thumb || "",
          platform: info.platform,
          likes: [],
          createdAt: Date.now()
        });
        uploading = false;
        await persistState();
        toast("Link reels berhasil dibagikan!");
        render();
      }catch(err){
        console.error("Save reel link error:", err);
        uploading = false;
        if(submitBtn) submitBtn.disabled = false;
        toast("Gagal menyimpan link reels.");
      }
    });
  }

  document.querySelectorAll("[data-r-like]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const r = (S.reels || []).find(x => x.id === btn.dataset.rLike);
      if(!r) return;
      r.likes = Array.isArray(r.likes) ? r.likes : [];
      r.likes = r.likes.includes(activeRole) ? r.likes.filter(x => x !== activeRole) : [...r.likes, activeRole];
      await persistState();
      render();
    });
  });

  document.querySelectorAll("[data-r-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ok = await ask("Hapus reels ini?");
      if(!ok) return;
      S.reels = (S.reels || []).filter(x => x.id !== btn.dataset.rDel);
      await persistState();
      toast("Reels dihapus.");
      render();
    });
  });
}

    updateAyatSummary();
  });

  akhirInp.addEventListener("change", () => {
    const awal = Number(awalInp.value) || 1;
    const akhir = Number(akhirInp.value) || 1;
    if(akhir < awal) awalInp.value = String(akhir);
    updateAyatSummary();
  });

  updateAyatSummary();

  if($("cancelEditBtn")){
    $("cancelEditBtn").addEventListener("click", () => {
      editId = null;
      tab = "hist";
      render();
    });
  }

  $("setorForm").addEventListener("submit", async e => {
    e.preventDefault();
    const jenis = document.querySelector('input[name="jenis"]:checked')?.value || "Ziyadah";
    const nilai = document.querySelector('input[name="nilai"]:checked')?.value || "Lancar";
    const surah = Number(surahSel.value) || 1;
    const info = getSurahInfo(surah);
    const maxAyat = info ? info.totalAyat : 999;
    let awal = Math.max(1, Math.min(maxAyat, Number(awalInp.value) || 1));
    let akhir = Math.max(1, Math.min(maxAyat, Number(akhirInp.value) || maxAyat));
    if(akhir < awal){
      const tmp = awal; awal = akhir; akhir = tmp;
    }
    const ayat = akhir - awal + 1;
    const tgl = $("fTgl").value || today();
    const catatan = $("fCatatan").value.trim();
    const materiLabel = info ? `${info.no}. ${info.name} (${awal}–${akhir})` : "";

    if(editing){
      editing.jenis = jenis;
      editing.surah = surah;
      editing.awal = awal;
      editing.akhir = akhir;
      editing.materi = materiLabel;
      editing.ayat = ayat;
      editing.tgl = tgl;
      editing.nilai = nilai;
      editing.catatan = catatan;
      editId = null;
      await persistState();
      toast("Setoran diperbarui.");
      tab = "hist";
    }else{
      S.setoran.push({
        id: uid(),
        pid: pesertaId,
        penilai: penilaiId,
        jenis,
        surah,
        awal,
        akhir,
        materi: materiLabel,
        ayat,
        tgl,
        nilai,
        catatan,
        createdAt: Date.now()
      });
      await persistState();
      toast("Setoran tersimpan!");
      tab = "hist";
    }
    render();
  });
  bindTopBarLogout();
}

function exportHistJpg(rows){
  const W = 1280;
  const pad = 48;
  const headerH = 126;
  const theadH = 44;
  const rowH = 54;
  const footerH = 44;
  const bodyRows = rows.length ? rows : [null];
  const H = pad * 2 + headerH + theadH + bodyRows.length * rowH + footerH;

  const canvas = document.createElement("canvas");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = "#f6f3ea";
  ctx.fillRect(0, 0, W, H);

  const cardX = pad - 12;
  const cardY = pad - 12;
  const cardW = W - (pad - 12) * 2;
  const cardH = H - (pad - 12) * 2;
  ctx.fillStyle = "#fffefb";
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 18);
  ctx.fill();
  ctx.strokeStyle = "#e3decb";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const bannerY = pad + 4;
  ctx.fillStyle = "#0a4f3a";
  ctx.beginPath();
  ctx.roundRect(pad + 6, bannerY, W - (pad + 6) * 2, 86, 14);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 28px Georgia, serif";
  ctx.fillText("Buku Setoran Hafalan", pad + 26, bannerY + 38);

  ctx.fillStyle = "#d2ebdc";
  ctx.font = "500 14px system-ui, -apple-system, sans-serif";
  ctx.fillText(`Dicetak pada ${fmt(today())}  ·  Total ${rows.length} catatan setoran`, pad + 26, bannerY + 64);

  const cols = [
    { label: "Tanggal", x: pad + 14, w: 130 },
    { label: "Peserta", x: pad + 148, w: 195 },
    { label: "Jenis", x: pad + 348, w: 105 },
    { label: "Surah & Ayat", x: pad + 458, w: 255 },
    { label: "Ayat", x: pad + 718, w: 55 },
    { label: "Nilai", x: pad + 778, w: 135 },
    { label: "Catatan", x: pad + 918, w: 295 }
  ];

  const tableTop = pad + headerH;
  ctx.fillStyle = "#e1ece2";
  ctx.beginPath();
  ctx.roundRect(pad + 6, tableTop, W - (pad + 6) * 2, theadH, 10);
  ctx.fill();

  ctx.fillStyle = "#0a4f3a";
  ctx.font = "700 13px system-ui, -apple-system, sans-serif";
  for(const c of cols){
    ctx.fillText(c.label, c.x, tableTop + 27);
  }

  const clipText = (txt, maxW) => {
    const s = String(txt ?? "–");
    if(ctx.measureText(s).width <= maxW) return s;
    let out = s;
    while(out.length > 1 && ctx.measureText(out + "…").width > maxW){
      out = out.slice(0, -1);
    }
    return out + "…";
  };

  let y = tableTop + theadH;
  if(!rows.length){
    ctx.fillStyle = "#62726a";
    ctx.font = "500 15px system-ui, -apple-system, sans-serif";
    ctx.fillText("Belum ada data setoran pada filter ini.", pad + 20, y + 32);
  }else{
    rows.forEach((s, idx) => {
      if(idx % 2 === 1){
        ctx.fillStyle = "#faf8f1";
        ctx.fillRect(pad + 6, y, W - (pad + 6) * 2, rowH);
      }
      ctx.strokeStyle = "#e3decb";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad + 6, y + rowH);
      ctx.lineTo(W - pad - 6, y + rowH);
      ctx.stroke();

      const info = getSurahInfo(s.surah);
      const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");

      ctx.fillStyle = "#1d2b25";
      ctx.font = "500 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(fmt(s.tgl), cols[0].w), cols[0].x, y + 32);

      ctx.font = "700 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(pName(s.pid), cols[1].w), cols[1].x, y + 32);

      ctx.font = "600 13px system-ui, -apple-system, sans-serif";
      ctx.fillStyle = "#0f6b4f";
      ctx.fillText(clipText(s.jenis, cols[2].w), cols[2].x, y + 32);

      ctx.fillStyle = "#1d2b25";
      ctx.font = "500 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(sr, cols[3].w), cols[3].x, y + 32);
      ctx.fillText(String(s.ayat || 0), cols[4].x, y + 32);

      const nColor = s.nilai === "Lancar" ? ["#dcf0e5", "#0f6b4f"]
                   : s.nilai === "Cukup Lancar" ? ["#f6ebc9", "#8a6410"]
                   : ["#f6dcd4", "#a2432f"];
      ctx.fillStyle = nColor[0];
      ctx.beginPath();
      ctx.roundRect(cols[5].x, y + 14, 122, 26, 999);
      ctx.fill();
      ctx.fillStyle = nColor[1];
      ctx.font = "700 12px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(s.nilai, 110), cols[5].x + 10, y + 31);

      ctx.fillStyle = "#62726a";
      ctx.font = "400 13px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(s.catatan || "–", cols[6].w), cols[6].x, y + 32);

      y += rowH;
    });
  }

  ctx.fillStyle = "#62726a";
  ctx.font = "500 12px system-ui, -apple-system, sans-serif";
  ctx.fillText("Buku Setoran Hafalan Al-Qur’an · Reski & Ima", pad + 14, H - pad + 4);

  canvas.toBlob(blob => {
    if(!blob){
      toast("Gagal membuat file JPG.");
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `buku-setoran-${today()}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("File JPG berhasil diunduh!");
  }, "image/jpeg", 0.94);
}

function renderHist(){
  const qLower = flt.q.trim().toLowerCase();
  const rows = sorted(S.setoran).filter(s => {
    if(flt.nilai && s.nilai !== flt.nilai) return false;
    if(flt.jenis && s.jenis !== flt.jenis) return false;
    if(qLower){
      const info = getSurahInfo(s.surah);
      const hay = `${pName(s.pid)} ${pName(s.penilai)} ${s.jenis} ${s.nilai} ${s.catatan} ${s.materi} ${info ? info.name : ""}`.toLowerCase();
      if(!hay.includes(qLower)) return false;
    }
    return true;
  });

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Riwayat Setoran</h1>
        <p class="lead">Semua catatan setoran Ziyadah &amp; Muroja’ah Reski dan Ima.</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" type="button" id="printBtn">Cetak / PDF</button>
        <button class="btn ghost sm" type="button" id="jpgBtn">Cetak JPG</button>
        <button class="btn sm" type="button" id="histAddBtn">+ Catat Setoran</button>
        <button class="top-logout-btn" type="button" data-action="logout" aria-label="Keluar dari akun">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <input id="fSearch" type="search" value="${esc(flt.q)}" placeholder="Cari nama, surah, atau catatan…">
        <select id="fJenis">
          <option value="">Semua jenis</option>
          <option value="Ziyadah" ${flt.jenis==="Ziyadah"?"selected":""}>Ziyadah</option>
          <option value="Muroja'ah" ${flt.jenis==="Muroja'ah"?"selected":""}>Muroja'ah</option>
        </select>
        <select id="fNilai">
          <option value="">Semua penilaian</option>
          ${NILAI.map(n => `<option value="${esc(n)}" ${flt.nilai===n?"selected":""}>${esc(n)}</option>`).join("")}
        </select>
      </div>

      <div class="tbl">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Peserta</th>
              <th>Jenis &amp; Surah</th>
              <th>Ayat</th>
              <th>Penilai</th>
              <th>Nilai</th>
              <th>Catatan</th>
              <th style="text-align:right">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length ? rows.map(s => {
              const info = getSurahInfo(s.surah);
              const surahTxt = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
              return `
                <tr>
                  <td>${fmt(s.tgl)}</td>
                  <td><strong>${esc(pName(s.pid))}</strong></td>
                  <td><span class="tag">${esc(s.jenis)}</span><div style="margin-top:4px">${esc(surahTxt)}</div></td>
                  <td>${s.ayat || 0}</td>
                  <td>${esc(pName(s.penilai))}</td>
                  <td>${chip(s.nilai)}</td>
                  <td>${esc(s.catatan || "–")}</td>
                  <td class="act">
                    <button class="btn ghost sm" type="button" data-edit="${esc(s.id)}">Edit</button>
                    <button class="btn danger sm" type="button" data-del="${esc(s.id)}">Hapus</button>
                  </td>
                </tr>
              `;
            }).join("") : '<tr><td colspan="8" class="empty">Tidak ada setoran yang sesuai dengan filter.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $("fSearch").addEventListener("input", () => { flt.q = $("fSearch").value; render(); });
  $("fJenis").addEventListener("change", () => { flt.jenis = $("fJenis").value; render(); });
  $("fNilai").addEventListener("change", () => { flt.nilai = $("fNilai").value; render(); });
  $("histAddBtn").addEventListener("click", () => { tab = "add"; editId = null; render(); });

  $("printBtn").addEventListener("click", () => {
    $("print").innerHTML = `
      <h1>Buku Setoran Hafalan</h1>
      <p>Dicetak pada ${esc(fmt(today()))}</p>
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Peserta</th><th>Jenis</th><th>Surah</th><th>Ayat</th><th>Nilai</th><th>Catatan</th></tr>
        </thead>
        <tbody>
          ${rows.map(s => {
            const info = getSurahInfo(s.surah);
            const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
            return `<tr><td>${fmt(s.tgl)}</td><td>${esc(pName(s.pid))}</td><td>${esc(s.jenis)}</td><td>${esc(sr)}</td><td>${s.ayat||0}</td><td>${esc(s.nilai)}</td><td>${esc(s.catatan||"–")}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
    window.print();
  });

  $("jpgBtn").addEventListener("click", () => {
    exportHistJpg(rows);
  });

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      editId = btn.dataset.edit;
      tab = "add";
      render();
    });
  });

  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ok = await ask("Hapus catatan setoran ini?");
      if(!ok) return;
      S.setoran = S.setoran.filter(x => x.id !== btn.dataset.del);
      await persistState();
      toast("Setoran dihapus.");
      render();
    });
  });
  bindTopBarLogout();
}

function renderUser(){
  if(selP){
    const p = S.peserta.find(x => x.id === selP);
    if(!p){ selP = null; return renderUser(); }
    const list = sorted(S.setoran.filter(s => s.pid === p.id));
    const ay = ayatOf(list);
    const pct = Math.min(100, Math.round((ay / Math.max(1, p.target)) * 100));

    $("view").innerHTML = `
      <button class="back" type="button" id="backPesertaBtn">← Kembali ke Daftar Peserta</button>
      <div class="top-bar">
        <div>
          <h1>${esc(p.nama)}</h1>
          <p class="lead">Target hafalan: ${p.target} ayat Ziyadah · Tercapai ${ay} ayat (${pct}%)</p>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="prog-top"><strong>Progress Target</strong><span>${pct}%</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>

        ${renderCompletedSurahSection(list, `Surah Lengkap Terselesaikan — ${p.nama}`)}

        <div class="card">
          <h2>Riwayat Setoran ${esc(p.nama)}</h2>
          <div class="list" style="margin-top:12px">
            ${list.length ? list.map(s => {
              const info = getSurahInfo(s.surah);
              const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
              return `
                <div class="row">
                  <div>
                    <strong><span class="tag">${esc(s.jenis)}</span> ${esc(sr)}</strong>
                    <small>${fmt(s.tgl)} · Penilai: ${esc(pName(s.penilai))}${s.ayat ? ` · ${s.ayat} ayat` : ""}${s.catatan ? ` · "${esc(s.catatan)}"` : ""}</small>
                  </div>
                  ${chip(s.nilai)}
                </div>
              `;
            }).join("") : '<div class="empty">Belum ada setoran untuk peserta ini.</div>'}
          </div>
        </div>
      </div>
    `;

    $("backPesertaBtn").addEventListener("click", () => { selP = null; renderUser(); });
    return;
  }

  $("view").innerHTML = `
    ${topBar("Peserta", "Profil peserta dan pengaturan target ayat Ziyadah masing-masing.")}

    <div class="grid-2">
      ${S.peserta.map(p => {
        const list = S.setoran.filter(s => s.pid === p.id);
        const ay = ayatOf(list);
        const pct = Math.min(100, Math.round((ay / Math.max(1, p.target)) * 100));
        return `
          <div class="card">
            <div class="prog-top">
              <strong>${esc(p.nama)}</strong>
              <span>${pct}%</span>
            </div>
            <div class="prog-meta">${ay} / ${p.target} ayat Ziyadah · ${list.length} setoran</div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div class="field" style="margin-top:14px;margin-bottom:10px">
              <label for="tgt_${esc(p.id)}">Target Ziyadah (ayat)</label>
              <input id="tgt_${esc(p.id)}" type="number" min="1" max="6236" value="${p.target}">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn sm" type="button" data-save-tgt="${esc(p.id)}">Simpan Target</button>
              <button class="btn ghost sm" type="button" data-detail-p="${esc(p.id)}">Lihat Detail</button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;

  document.querySelectorAll("[data-save-tgt]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.saveTgt;
      const val = Math.max(1, Number($("tgt_" + id).value) || 600);
      const targetObj = S.peserta.find(x => x.id === id);
      if(targetObj){
        targetObj.target = val;
        await persistState();
        toast("Target diperbarui!");
        renderUser();
      }
    });
  });

  document.querySelectorAll("[data-detail-p]").forEach(btn => {
    btn.addEventListener("click", () => {
      selP = btn.dataset.detailP;
      renderUser();
    });
  });
  bindTopBarLogout();
}

function render(){
  renderNav();
  if(tab === "home") renderHome();
  else if(tab === "dash") renderDash();
  else if(tab === "add") renderAdd();
  else if(tab === "hist") renderHist();
  else if(tab === "user") renderUser();
  else renderHome();
}

async function boot(){
  setupBroadcast();
  setupAuthEvents();
  await initFirebaseSync();

  let savedSession = null;
  try{
    savedSession = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
  }catch(e){}

  if(savedSession && (savedSession === "p1" || savedSession === "p2")){
    enterApp(savedSession);
  }else{
    showPublic();
  }
}

boot();
</script>
