<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Setoran Hafalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea;
  --surface:#fffefb;
  --ink:#1d2b25;
  --mute:#62726a;
  --line:#e3decb;
  --em:#0f6b4f;
  --em-d:#0a4f3a;
  --sage:#e1ece2;
  --sage-d:#b7cfbc;
  --ok:#0f6b4f;
  --ok-bg:#dcf0e5;
  --mid:#8a6410;
  --mid-bg:#f6ebc9;
  --bad:#a2432f;
  --bad-bg:#f6dcd4;
  --shadow:0 10px 28px rgba(15,61,46,.06);
  --shadow-lg:0 18px 42px rgba(10,45,34,.14);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1713;
    --surface:#16201b;
    --ink:#eaf1ec;
    --mute:#9cb0a5;
    --line:#27362f;
    --em:#4bc094;
    --em-d:#7dd7b3;
    --sage:#1e2f27;
    --sage-d:#324b3c;
    --ok:#7dd7b3;
    --ok-bg:#1c352a;
    --mid:#e4c05c;
    --mid-bg:#362e15;
    --bad:#ee9a86;
    --bad-bg:#3d201a;
    --shadow:0 10px 28px rgba(0,0,0,.28);
    --shadow-lg:0 20px 44px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%, rgba(15,107,79,.08), transparent 42%),
    radial-gradient(circle at 92% 12%, rgba(138,100,16,.06), transparent 38%),
    var(--bg);
  color:var(--ink);
  font:15.5px/1.58 Figtree,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.hidden{display:none!important}

/* Layar Masuk */
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px;
}
.login-card{
  width:100%;
  max-width:410px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px 26px;
  box-shadow:var(--shadow-lg);
}
.login-brand{
  font-family:Amiri,serif;
  font-size:34px;
  line-height:1.12;
  color:var(--em-d);
  margin:0 0 6px;
}
.login-sub{
  color:var(--mute);
  margin:0 0 22px;
  font-size:14px;
}
.field{margin-bottom:15px}
.field:last-of-type{margin-bottom:14px}
label{
  display:block;
  font-weight:600;
  font-size:13.5px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--em);
  background:var(--surface);
  box-shadow:0 0 0 3px rgba(15,107,79,.12);
}
.pass-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.pass-wrap input{padding-right:44px}
.eye-btn{
  position:absolute;
  right:8px;
  background:none;
  border:0;
  color:var(--mute);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:color .15s ease, background-color .15s ease;
}
.eye-btn:hover{
  color:var(--ink);
  background:rgba(0,0,0,.06);
}
.remember-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  font-size:13.5px;
}
.remember-row input[type="checkbox"]{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--em);
  cursor:pointer;
}
.remember-row label{
  margin:0;
  font-weight:500;
  cursor:pointer;
}
textarea{min-height:92px;resize:vertical}
.err-box{
  background:var(--bad-bg);
  color:var(--bad);
  border:1px solid transparent;
  border-radius:12px;
  padding:10px 12px;
  font-size:13.5px;
  font-weight:600;
  margin-bottom:14px;
}

/* Tata Letak Utama */
.app{
  display:grid;
  grid-template-columns:244px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:linear-gradient(180deg, var(--em-d) 0%, #073c2c 100%);
  color:#eaf4ee;
  padding:28px 16px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:8px;
  box-shadow:4px 0 24px rgba(0,0,0,.06);
}
.brand{
  font-family:Amiri,serif;
  font-size:30px;
  line-height:1.1;
  margin:0 8px 2px;
}
.brand-sub{
  font-size:12.5px;
  opacity:.78;
  margin:0 8px 14px;
}
.user-pill{
  margin:0 4px 10px;
  padding:11px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
}
.user-pill small{display:block;opacity:.76;font-size:11.5px;letter-spacing:.02em}
.user-pill strong{display:block;font-size:14.5px;margin-top:2px}
.sync-badge{
  margin:0 4px 12px;
  padding:7px 11px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  font-size:12px;
  display:flex;
  align-items:center;
  gap:7px;
  opacity:.92;
}
.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#7dd7b3;
  flex:none;
}
.sync-dot.warn{background:#e4c05c}
.sync-dot.err{background:#ee9a86}
nav{display:flex;flex-direction:column;gap:4px}
nav button{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  border:0;
  color:inherit;
  padding:10px 12px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
  font-weight:500;
  font-size:14px;
  transition:background-color .16s ease, transform .16s ease;
}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:rgba(255,255,255,.1)}
nav button[aria-current=page]{
  background:var(--bg);
  color:#0a4f3a;
  font-weight:700;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.side-foot{
  margin-top:auto;
  display:grid;
  gap:8px;
  padding:0 4px;
}

main{
  padding:30px clamp(16px,3.5vw,42px) 56px;
  max-width:1060px;
  width:100%;
  min-width:0;
}
.top-bar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:22px;
}
h1{
  font-family:Amiri,serif;
  font-size:clamp(29px,4.2vw,39px);
  line-height:1.14;
  color:var(--em-d);
  margin:0 0 4px;
}
.lead{
  color:var(--mute);
  margin:0;
  font-size:14.5px;
  max-width:60ch;
}
.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-left:auto;
}
.top-logout-btn{
  border:1px solid var(--bad-bg);
  background:var(--bad-bg);
  color:var(--bad);
  padding:8px 14px;
  border-radius:10px;
  font-weight:600;
  font-size:13.5px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:filter .16s ease, transform .14s ease, background-color .16s ease;
  white-space:nowrap;
}
.top-logout-btn:hover{
  filter:brightness(.97);
}
.top-logout-btn:active{
  transform:translateY(1px);
}
h2{
  font-size:17px;
  margin:0;
  font-weight:700;
}
.sec-sub{
  color:var(--mute);
  font-size:13.5px;
  margin:4px 0 0;
}
.sec-head{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 22px;
  min-width:0;
  box-shadow:var(--shadow);
  transition:border-color .18s ease, transform .18s ease;
}
.stack{display:grid;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.stat b{
  display:block;
  font-size:31px;
  line-height:1.12;
  font-weight:700;
  color:var(--em-d);
  letter-spacing:-.02em;
}
.stat span{
  display:block;
  font-size:13.5px;
  color:var(--mute);
  margin-top:5px;
}
.stat.main{
  background:linear-gradient(135deg, var(--em-d) 0%, var(--em) 100%);
  border-color:transparent;
  color:#eaf4ee;
}
.stat.main b{color:#fff}
.stat.main span{color:#d2ebdc}

.bar{
  height:9px;
  background:var(--sage);
  border-radius:999px;
  overflow:hidden;
  margin-top:11px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg, var(--em) 0%, var(--em-d) 100%);
  border-radius:999px;
  transition:width .3s ease;
}
.stat.main .bar{background:rgba(255,255,255,.22)}
.stat.main .bar>i{background:#d4f0df}

.prog-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:var(--bg);
}
.prog-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}
.prog-top strong{font-size:15.5px}
.prog-top span{font-size:14px;font-weight:700;color:var(--em-d)}
.prog-meta{
  font-size:13px;
  color:var(--mute);
  margin-top:4px;
}

.quote-box{
  display:grid;
  gap:12px;
  margin-bottom:16px;
}
.quote-item{
  border:1px solid var(--line);
  border-left:4px solid var(--em);
  border-radius:14px;
  padding:14px 16px;
  background:var(--bg);
}
.quote-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:13.5px;
}
.quote-time{color:var(--mute);font-size:12px}
.quote-body{
  margin:8px 0 12px;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.quote-foot{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.like-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .16s ease;
}
.like-btn:hover{border-color:var(--sage-d)}
.like-btn.liked{
  border-color:#d88b9c;
  background:#fff0f3;
  color:#b4234b;
}

/* Kartu Sapaan Gambar di Beranda */
.welcome-banner{
  display:flex;
  align-items:center;
  gap:18px;
  padding:16px 20px;
}
.welcome-banner img{
  width:118px;
  height:118px;
  object-fit:contain;
  border-radius:16px;
  background:#ffffff;
  padding:4px;
  flex:none;
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}
.welcome-banner-text h2{
  font-family:Amiri,serif;
  font-size:24px;
  color:var(--em-d);
  margin:0 0 4px;
}
.welcome-banner-text p{
  margin:0;
  color:var(--mute);
  font-size:14px;
}
@media (max-width:520px){
  .welcome-banner{
    flex-direction:column;
    text-align:center;
  }
}

/* Materi Belajar di Beranda */
.materi-list{
  display:grid;
  gap:12px;
  margin-top:14px;
}
.materi-card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px 17px;
  background:var(--bg);
}
.materi-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}
.materi-title{
  margin:4px 0 0;
  font-size:16px;
  font-weight:700;
}
.materi-body{
  margin:8px 0 10px;
  font-size:14.5px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.materi-link{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:13.5px;
  font-weight:600;
  color:var(--em-d);
  text-decoration:none;
  word-break:break-all;
}
.materi-link:hover{text-decoration:underline}

.list{display:flex;flex-direction:column}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0;padding-top:2px}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

.done-surah-list{
  display:grid;
  gap:10px;
}
.done-group{
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 15px;
  background:var(--bg);
}
.done-date{
  font-size:13px;
  font-weight:700;
  color:var(--em-d);
  margin-bottom:8px;
}
.done-items{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.done-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 11px;
  border-radius:999px;
  background:var(--ok-bg);
  color:var(--ok);
  font-size:13px;
  font-weight:600;
}

.chip{
  display:inline-block;
  font-size:12.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.Lancar{background:var(--ok-bg);color:var(--ok)}
.Cukup{background:var(--mid-bg);color:var(--mid)}
.Ulang{background:var(--bad-bg);color:var(--bad)}
.tag{
  display:inline-block;
  background:var(--sage);
  color:var(--em-d);
  font-size:12.5px;
  font-weight:600;
  padding:2px 9px;
  border-radius:999px;
}

.btn{
  border:1px solid var(--em);
  background:var(--em);
  color:#fff;
  padding:9.5px 16px;
  border-radius:11px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:filter .16s ease, transform .14s ease, background-color .16s ease;
}
@media (prefers-color-scheme:dark){
  .btn{color:#091510}
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{
  background:transparent;
  color:var(--em-d);
  border-color:var(--sage-d);
}
.btn.light{
  background:rgba(255,255,255,.14);
  color:#fff;
  border-color:rgba(255,255,255,.28);
}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{
  background:transparent;
  color:var(--bad);
  border-color:var(--bad-bg);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.form-grid .full{grid-column:1/-1}
.readonly-box{
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  font-weight:600;
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500;font-size:14px}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{
  display:block;
  padding:8.5px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
  cursor:pointer;
  transition:all .16s ease;
}
.seg input:checked+span{
  background:var(--sage);
  border-color:var(--em);
  color:var(--em-d);
  font-weight:700;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px}
th,td{
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:14px;
}
th{color:var(--mute);font-weight:600;font-size:12.5px}
tbody tr:hover{background:rgba(15,107,79,.03)}
td.act{white-space:nowrap;text-align:right}
.empty{
  text-align:center;
  color:var(--mute);
  padding:28px 12px;
  font-size:14px;
}
.back{
  background:none;
  border:0;
  color:var(--em-d);
  font-weight:600;
  font-size:14px;
  padding:0 0 10px;
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--em-d);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:600;
  font-size:13.5px;
  z-index:80;
  box-shadow:var(--shadow-lg);
}
dialog{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--surface);
  color:var(--ink);
  max-width:420px;
  width:calc(100% - 32px);
  padding:22px;
  box-shadow:var(--shadow-lg);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-act{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:16px;
}
#print{display:none}

@media (max-width:900px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{display:block}
  aside{
    position:fixed;
    left:0;right:0;bottom:0;top:auto;
    height:auto;
    flex-direction:row;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:40;
    box-shadow:0 -4px 20px rgba(0,0,0,.14);
  }
  .brand,.brand-sub,.user-pill,.sync-badge{display:none}
  .side-foot{
    margin-top:0;
    display:flex;
    align-items:center;
    padding:0 2px;
    flex:none;
  }
  .side-foot .btn.sm{
    padding:7px 9px;
    font-size:11.5px;
    border-radius:9px;
    white-space:nowrap;
  }
  nav{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
  nav button{
    flex-direction:column;
    gap:2px;
    font-size:11px;
    padding:6px 2px;
    flex:1;
    align-items:center;
  }
  nav button svg{width:17px;height:17px}
  main{padding:20px 14px 92px}
  .card{padding:17px 16px;border-radius:16px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){
  .grid-2,.grid-4,.form-grid,.filters{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .login-wrap,.app,.toast,dialog{display:none!important}
  #print{display:block;font-family:Figtree,sans-serif}
  #print h1{color:#0a4f3a}
  #print table{min-width:0}
  #print th,#print td{font-size:12px;border-bottom:1px solid #bbb}
}
</style>
</head>
<body>

<section class="login-wrap" id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="off">
    <p class="login-brand">Buku Setoran</p>
    <p class="login-sub">Masuk menggunakan username dan sandi peserta untuk membuka buku hafalan.</p>
    <div id="loginErr" class="err-box hidden" role="alert"></div>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" required placeholder="Masukkan username">
    </div>
    <div class="field">
      <label for="loginPass">Sandi</label>
      <div class="pass-wrap">
        <input id="loginPass" type="password" required placeholder="Masukkan sandi">
        <button class="eye-btn" type="button" id="togglePassBtn" aria-label="Lihat atau sembunyikan sandi" aria-pressed="false">

function getSurahInfo(surahNum){
  const idx = Number(surahNum) - 1;
  if(idx < 0 || idx >= SURAH.length) return null;
  return { no: idx + 1, name: SURAH[idx][0], totalAyat: SURAH[idx][1] };
}

function getCompletedSurahByDate(list){
  const bySurah = new Map();
  for(const s of list){
    const info = getSurahInfo(s.surah);
    if(!info) continue;
    const awal = Number(s.awal) || 1;
    const akhir = Number(s.akhir) || 1;
    const isFull = awal <= 1 && akhir >= info.totalAyat;
    if(!isFull) continue;

    const prev = bySurah.get(info.no);
    if(!prev || String(s.tgl || "").localeCompare(prev.tgl) > 0){
      bySurah.set(info.no, {
        no: info.no,
        name: info.name,
        totalAyat: info.totalAyat,
        tgl: s.tgl || today()
      });
    }
  }

  const grouped = new Map();
  for(const item of bySurah.values()){
    if(!grouped.has(item.tgl)) grouped.set(item.tgl, []);
    grouped.get(item.tgl).push(item);
  }

  return [...grouped.entries()]
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([tgl, surahs])=>({
      tgl,
      surahs: surahs.sort((a,b)=>a.no - b.no)
    }));
}

function today(){

}
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function weekStart(){
  const d = new Date();
  const k = (d.getDay() + 6) % 7;
  return daysAgo(k);
}

function normalizeState(raw){
  if(raw && typeof raw === "object" && !Array.isArray(raw)){
    if(Array.isArray(raw.setoran) && !raw.setoran.length && raw.setoranMap && typeof raw.setoranMap === "object"){
      raw.setoran = Object.values(raw.setoranMap);
    }
    if(Array.isArray(raw.quotes) && !raw.quotes.length && raw.quotesMap && typeof raw.quotesMap === "object"){
      raw.quotes = Object.values(raw.quotesMap);
    }
    if(Array.isArray(raw.materi) && !raw.materi.length && raw.materiMap && typeof raw.materiMap === "object"){
      raw.materi = Object.values(raw.materiMap);
    }
  }
  const p1T = raw?.peserta?.find(p=>p.id==="p1")?.target || 600;
  const p2T = raw?.peserta?.find(p=>p.id==="p2")?.target || 600;
  const quotes = Array.isArray(raw?.quotes)
    ? raw.quotes
        .filter(q=>["p1","p2"].includes(q.pid) && Number.isFinite(Number(q.createdAt)) && (Date.now() - Number(q.createdAt) < 24*60*60*1000))
        .map(q=>({
          id: String(q.id || uid()),
          pid: q.pid,
          text: String(q.text || ""),
          likes: Array.isArray(q.likes) ? q.likes.filter(x=>["p1","p2"].includes(x)) : [],
          createdAt: Number(q.createdAt)
        }))
    : [];
  const materi = Array.isArray(raw?.materi)
    ? raw.materi
        .filter(m=>["p1","p2"].includes(m.pid) && String(m.judul || m.isi || "").trim())
        .map(m=>({
          id: String(m.id || uid()),
          pid: m.pid,
          judul: String(m.judul || "Catatan Materi").trim(),
          kategori: MATERI_KAT.includes(m.kategori) ? m.kategori : "Lainnya",
          isi: String(m.isi || "").trim(),
          tautan: String(m.tautan || "").trim(),
          likes: Array.isArray(m.likes) ? m.likes.filter(x=>["p1","p2"].includes(x)) : [],
          createdAt: Number(m.createdAt) || Date.now()
        }))
    : [];
  const setoran = Array.isArray(raw?.setoran)
    ? raw.setoran
        .filter(s=>["p1","p2"].includes(s.pid) && s.penilai !== s.pid)
        .map(s=>({
          id: String(s.id || uid()),
          pid: s.pid,
          penilai: ["p1","p2"].includes(s.penilai) ? s.penilai : partnerIdOf(s.pid),
          jenis: s.jenis === "Muroja'ah" ? "Muroja'ah" : "Ziyadah",
          surah: Number(s.surah) || 1,
          awal: Number(s.awal) || 1,
          akhir: Number(s.akhir) || 1,
          materi: String(s.materi || ""),
          ayat: Number(s.ayat) || 0,
          tgl: String(s.tgl || today()),
          nilai: NILAI.includes(s.nilai) ? s.nilai : "Lancar",
          catatan: String(s.catatan || ""),
          createdAt: Number(s.createdAt) || Date.now()
        }))
    : [];
  return {
    peserta:[
      { id:"p1", nama:"Reski", target:Math.max(1, Number(p1T)||600) },
      { id:"p2", nama:"Ima Cantik Sholeha🌸", target:Math.max(1, Number(p2T)||600) }
    ],
    setoran,
    quotes,
    materi,
    updatedAt: Number(raw?.updatedAt) || Date.now()
  };
}

function toFirebasePayload(stateObj){
  return {
    peserta: stateObj.peserta,
    setoran: stateObj.setoran,
    quotes: stateObj.quotes,
    materi: stateObj.materi,
    updatedAt: Number(stateObj.updatedAt) || Date.now()
  };
}

async function persistState(){
  S.updatedAt = Date.now();
  saveLocal();
  if(bc){
    try{ bc.postMessage({ type:"state", state:S }); }catch(e){}
  }
  if(!applyingRemote){
    await pushFirebaseState(S);
  }
}

function applyIncomingState(raw){
  if(!raw || typeof raw !== "object") return;
  const incoming = normalizeState(raw);
  const localTs = Number(S.updatedAt) || 0;
  const remoteTs = Number(incoming.updatedAt) || 0;
  if(remoteTs >= localTs && JSON.stringify(incoming) !== JSON.stringify(S)){
    applyingRemote = true;
    S = incoming;
    saveLocal();
    if(activeRole) render();
    applyingRemote = false;
  }
}

async function pushFirebaseState(stateObj){
  if(!dbRef) return;
  try{
    await set(dbRef, toFirebasePayload(stateObj));
  }catch(err){
    console.error("Firebase write error:", err);
  }
}

async function initFirebaseSync(){
  if(typeof unsubDb === "function"){
    try{ unsubDb(); }catch(e){}
    unsubDb = null;
  }
  dbRef = null;

  const cfg = getFirebaseConfig();
  if(!cfg.databaseURL) return;

  try{
    const appName = "buku-setoran-firebase-app";
    const fbApp = initializeApp({
      apiKey: cfg.apiKey || "AIzaSyDummyKeyForRealtimeDB",
      authDomain: cfg.authDomain || undefined,
      databaseURL: cfg.databaseURL,
      projectId: cfg.projectId || undefined,
      storageBucket: cfg.storageBucket || undefined,
      messagingSenderId: cfg.messagingSenderId || undefined,
      appId: cfg.appId || undefined
    }, appName);

    const db = getDatabase(fbApp);
    dbRef = ref(db, `rooms/${cfg.room}/state`);

    const snap = await get(dbRef);
    if(snap.exists()){
      applyIncomingState(snap.val());
    }else if((S.setoran && S.setoran.length) || (S.quotes && S.quotes.length) || (S.materi && S.materi.length)){
      await set(dbRef, toFirebasePayload(S));
    }

    unsubDb = onValue(dbRef, snapshot => {
      if(snapshot.exists()){
        applyIncomingState(snapshot.val());
      }
    }, err => {
      console.error("Firebase listener error:", err);
    });
  }catch(err){
    console.error("Firebase init error:", err);
  }
}

function setupBroadcast(){
  if("BroadcastChannel" in window){
    bc = new BroadcastChannel(CHANNEL_NAME);
    bc.onmessage = ev => {
      if(ev.data?.type === "state") applyIncomingState(ev.data.state);
    };
  }
  window.addEventListener("storage", ev => {
    if(ev.key === STORAGE_KEY && ev.newValue){
      try{ applyIncomingState(JSON.parse(ev.newValue)); }catch(e){}
    }
    if(ev.key === SESSION_KEY && !ev.newValue && activeRole){
      activeRole = null;
      showLogin();
    }
  });
}

      return;

    $("loginErr").classList.add("hidden");
    try{
      if($("rememberMe").checked){
        localStorage.setItem(REMEMBER_KEY, JSON.stringify({ user: u, pass: p }));
      }else{
        localStorage.removeItem(REMEMBER_KEY);

    }catch(err){}
    enterApp(acc.role);
  });

  if($("sideLogoutBtn")) $("sideLogoutBtn").addEventListener("click", logout);
}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</svg>
      <span>${label}</span>
    </button>
  `).join("");

  $("nav").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      tab = btn.dataset.tab;
      if(tab !== "add") editId = null;
      if(tab !== "user") selP = null;
      render();
    });
  });
}

function renderQuotesSection(){
  const activeQuotes = (S.quotes || [])
    .filter(q => Date.now() - Number(q.createdAt || 0) < 24*60*60*1000)
    .sort((a,b) => Number(b.createdAt) - Number(a.createdAt));

  return `
    <section class="card">
      <div class="sec-head">
        <div>
          <h2>Quotes Hari Ini</h2>
          <p class="sec-sub">Pesan penyemangat  · otomatis hilang setelah 24 jam</p>
        </div>
        <span class="tag">${activeQuotes.length} Quote Aktif</span>
      </div>

      <div class="quote-box">
        ${activeQuotes.length ? activeQuotes.map(q => {
          const likes = Array.isArray(q.likes) ? q.likes : [];
          const likedByMe = likes.includes(activeRole);
          return `
            <article class="quote-item">
              <div class="quote-head">
                <strong>${esc(pName(q.pid))}</strong>
                <span class="quote-time">${esc(fmtTime(q.createdAt))}</span>
              </div>
              <p class="quote-body">${esc(q.text)}</p>
              <div class="quote-foot">
                <button type="button" class="like-btn ${likedByMe ? "liked" : ""}" data-q-like="${esc(q.id)}">
                  ${likedByMe ? "♥" : "♡"} Suka (${likes.length})
                </button>
                ${q.pid === activeRole ? `<button type="button" class="btn danger sm" data-q-del="${esc(q.id)}">Hapus</button>` : ""}
              </div>
            </article>
          `;
        }).join("") : '<div class="empty">Belum ada quote aktif dalam 24 jam terakhir. Tulis penyemangat pertamamu di bawah!</div>'}
      </div>

      <form id="quoteForm">
        <div class="field">
          <label for="quoteText">Tulis Quote untuk ${esc(pName(partnerIdOf(activeRole)))}</label>
          <textarea id="quoteText" maxlength="280" placeholder="" required></textarea>
        </div>
        <button class="btn sm" type="submit">Kirim Quote</button>
      </form>
    </section>
  `;
}

function renderMateriSection(){
  const qLower = materiFilter.q.trim().toLowerCase();
  const list = [...(S.materi || [])]
    .filter(m => {
      if(materiFilter.kat && m.kategori !== materiFilter.kat) return false;
      if(qLower){
        const hay = `${m.judul} ${m.isi} ${m.kategori} ${pName(m.pid)}`.toLowerCase();
        if(!hay.includes(qLower)) return false;
      }
      return true;
    })
    .sort((a,b) => Number(b.createdAt) - Number(a.createdAt));

  return `
    <section class="card">
      <div class="sec-head">
        <div>
          <h2>Sharing Materi Belajar Bersama</h2>
          <p class="sec-sub">Simpan dan bagikan ringkasan materi, kaidah tajwid, kosakata, atau catatan belajar berdua</p>
        </div>
        <span class="tag">${(S.materi || []).length} Materi</span>
      </div>

      <form id="materiForm" class="form-grid" style="margin-bottom:20px">
        <div class="field">
          <label for="matJudul">Judul / Topik Materi</label>
          <input id="matJudul" type="text" maxlength="120" required placeholder="">
        </div>
        <div class="field">
          <label for="matKat">Kategori</label>
          <select id="matKat">
            ${MATERI_KAT.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("")}
          </select>
        </div>
        <div class="field full">
          <label for="matIsi">Isi / Ringkasan Materi</label>
          <textarea id="matIsi" maxlength="2000" required placeholder=""></textarea>
        </div>
        <div class="field full">
          <label for="matLink">Tautan Referensi (opsional)</label>
          <input id="matLink" type="text" placeholder="">
        </div>
        <div class="full">
          <button class="btn" type="submit">Bagikan Materi</button>
        </div>
      </form>

      <div class="filters">
        <input id="matSearch" type="search" value="${esc(materiFilter.q)}" placeholder="Cari judul, isi, atau pemateri…">
        <select id="matFilterKat">
          <option value="">Semua kategori</option>
          ${MATERI_KAT.map(k => `<option value="${esc(k)}" ${materiFilter.kat===k?"selected":""}>${esc(k)}</option>`).join("")}
        </select>
        <button class="btn ghost sm" type="button" id="matResetBtn">Reset Filter</button>
      </div>

      <div class="materi-list">
        ${list.length ? list.map(m => {
          const likes = Array.isArray(m.likes) ? m.likes : [];
          const likedByMe = likes.includes(activeRole);
          const validUrl = safeUrl(m.tautan);
          return `
            <article class="materi-card">
              <div class="materi-top">
                <div>
                  <span class="tag">${esc(m.kategori)}</span>
                  <h3 class="materi-title">${esc(m.judul)}</h3>
                </div>
                <span class="quote-time">${esc(pName(m.pid))} · ${esc(fmtTime(m.createdAt))}</span>
              </div>
              <p class="materi-body">${esc(m.isi)}</p>
              ${validUrl ? `<div style="margin-bottom:10px"><a class="materi-link" href="${esc(validUrl)}" target="_blank" rel="noopener noreferrer">↗ Buka tautan referensi</a></div>` : ""}
              <div class="quote-foot">
                <button type="button" class="like-btn ${likedByMe ? "liked" : ""}" data-m-like="${esc(m.id)}">
                  ${likedByMe ? "♥" : "♡"} Paham / Suka (${likes.length})
                </button>
                ${m.pid === activeRole ? `<button type="button" class="btn danger sm" data-m-del="${esc(m.id)}">Hapus</button>` : ""}
              </div>
            </article>
          `;
        }).join("") : '<div class="empty">Belum ada materi belajar yang cocok dengan filter atau belum dibagikan.</div>'}
      </div>
    </section>
  `;
}

function bindHomeEvents(){
  const qForm = $("quoteForm");
  if(qForm){
    qForm.addEventListener("submit", async e => {
      e.preventDefault();
      const text = $("quoteText").value.trim();
      if(!text) return;
      S.quotes = (S.quotes || []).filter(q => Date.now() - Number(q.createdAt || 0) < 24*60*60*1000);
      S.quotes.push({
        id: uid(),
        pid: activeRole,
        text,
        likes: [],
        createdAt: Date.now()
      });
      await persistState();
      toast("Quote terkirim!");
      render();
    });
  }

  document.querySelectorAll("[data-q-like]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.qLike;
      const q = (S.quotes || []).find(x => x.id === id);
      if(!q) return;
      q.likes = Array.isArray(q.likes) ? q.likes : [];
      if(q.likes.includes(activeRole)){
        q.likes = q.likes.filter(x => x !== activeRole);
      }else{
        q.likes.push(activeRole);
      }
      await persistState();
      render();
    });
  });

  document.querySelectorAll("[data-q-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ok = await ask("Hapus quote ini?");
      if(!ok) return;
      S.quotes = (S.quotes || []).filter(x => x.id !== btn.dataset.qDel);
      await persistState();
      toast("Quote dihapus.");
      render();
    });
  });

  const mForm = $("materiForm");
  if(mForm){
    mForm.addEventListener("submit", async e => {
      e.preventDefault();
      const judul = $("matJudul").value.trim();
      const kategori = $("matKat").value;
      const isi = $("matIsi").value.trim();
      const tautan = $("matLink").value.trim();
      if(!judul || !isi) return;
      S.materi = Array.isArray(S.materi) ? S.materi : [];
      S.materi.push({
        id: uid(),
        pid: activeRole,
        judul,
        kategori,
        isi,
        tautan,
        likes: [],
        createdAt: Date.now()
      });
      await persistState();
      toast("Materi belajar dibagikan!");
      render();
    });
  }

  const matSearch = $("matSearch");
  if(matSearch){
    matSearch.addEventListener("input", () => {
      materiFilter.q = matSearch.value;
      render();
    });
  }
  const matKat = $("matFilterKat");
  if(matKat){
    matKat.addEventListener("change", () => {
      materiFilter.kat = matKat.value;
      render();
    });
  }
  const matReset = $("matResetBtn");
  if(matReset){
    matReset.addEventListener("click", () => {
      materiFilter = { q:"", kat:"" };
      render();
    });
  }

  document.querySelectorAll("[data-m-like]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.mLike;
      const m = (S.materi || []).find(x => x.id === id);
      if(!m) return;
      m.likes = Array.isArray(m.likes) ? m.likes : [];
      if(m.likes.includes(activeRole)){
        m.likes = m.likes.filter(x => x !== activeRole);
      }else{
        m.likes.push(activeRole);
      }
      await persistState();
      render();
    });
  });

  document.querySelectorAll("[data-m-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ok = await ask("Hapus materi belajar ini?");
      if(!ok) return;
      S.materi = (S.materi || []).filter(x => x.id !== btn.dataset.mDel);
      await persistState();
      toast("Materi dihapus.");
      render();
    });
  });
}

function renderDash(){
  const ws = weekStart();
  const wk = S.setoran.filter(s => s.tgl >= ws);
  const totAyat = ayatOf(S.setoran);
  const wkAyat = ayatOf(wk);

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Ringkasan Hafalan</h1>
        <p class="lead">Pantau capaian hafalan baru (Ziyadah) dan muroja’ah bersama🌼.</p>
      </div>
      <div class="top-actions">
        <button class="btn sm" type="button" id="dashAddBtn">+ Catat Setoran</button>
        <button class="top-logout-btn" type="button" data-action="logout" aria-label="Keluar dari akun">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>

    <div class="stack">
      <div class="grid-4">
        <div class="card stat main"><b>${totAyat}</b><span>Total ayat Ziyadah</span></div>
        <div class="card stat"><b>${wkAyat}</b><span>Ziyadah pekan ini</span></div>
        <div class="card stat"><b>${S.setoran.length}</b><span>Total setoran tercatat</span></div>
        <div class="card stat"><b>${wk.length}</b><span>Setoran pekan ini</span></div>
      </div>

      <section class="card">
        <div class="sec-head">
          <div>
            <h2>Progres Target Peserta</h2>
            <p class="sec-sub">Dihitung dari akumulasi ayat Ziyadah masing-masing peserta</p>
          </div>
        </div>
        <div class="grid-2">
          ${S.peserta.map(p => {
            const list = S.setoran.filter(s => s.pid === p.id);
            const ay = ayatOf(list);
            const pct = Math.min(100, Math.round((ay / Math.max(1, p.target)) * 100));
            return `
              <div class="prog-item">
                <div class="prog-top">
                  <strong>${esc(p.nama)}</strong>
                  <span>${pct}%</span>
                </div>
                <div class="prog-meta">${ay} / ${p.target} ayat Ziyadah · ${list.length} setoran</div>
                <div class="bar"><i style="width:${pct}%"></i></div>
              </div>
            `;
          }).join("")}
        </div>
      </section>

      ${renderCompletedSurahSection(S.setoran)}

      <section class="card">
        <div class="sec-head">
          <div>
            <h2>Setoran Terbaru</h2>
            <p class="sec-sub">5 catatan setoran terakhir</p>
          </div>
          <button class="btn ghost sm" type="button" id="dashAllBtn">Lihat Semua</button>
        </div>
        <div class="list">
          ${sorted(S.setoran).slice(0,5).map(s => {
            const info = getSurahInfo(s.surah);
            const label = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "Setoran");
            return `
              <div class="row">
                <div>
                  <strong>${esc(pName(s.pid))}</strong> · <span class="tag">${esc(s.jenis)}</span> · ${esc(label)}
                  <small>${fmt(s.tgl)} · Penilai: ${esc(pName(s.penilai))}${s.ayat ? ` · ${s.ayat} ayat` : ""}${s.catatan ? ` · "${esc(s.catatan)}"` : ""}</small>
                </div>
                ${chip(s.nilai)}
              </div>
            `;
          }).join("") || '<div class="empty">Belum ada setoran yang dicatat.</div>'}
        </div>
      </section>
    </div>
  `;

  $("dashAddBtn").addEventListener("click", () => { tab = "add"; editId = null; render(); });
  $("dashAllBtn").addEventListener("click", () => { tab = "hist"; render(); });
  bindTopBarLogout();
}

function renderAdd(){
  const editing = editId ? S.setoran.find(s => s.id === editId) : null;
  const pesertaId = editing ? editing.pid : activeRole;
  const penilaiId = editing ? editing.penilai : partnerIdOf(pesertaId);
  const curSurah = editing ? editing.surah : 1;
  const curJenis = editing ? editing.jenis : "Ziyadah";
  const curAwal = editing ? editing.awal : 1;
  const info0 = getSurahInfo(curSurah) || { no:1, name:"Al-Fatihah", totalAyat:7 };
  const curAkhir = editing ? editing.akhir : Math.min(info0.totalAyat, curAwal);
  const curTgl = editing ? editing.tgl : today();
  const curNilai = editing ? editing.nilai : "Lancar";
  const curCatatan = editing ? editing.catatan : "";

  $("view").innerHTML = `
    ${topBar(editing ? "Edit Setoran" : "Catat Setoran", "Penilai otomatis diatur  agar saling menyimak setoran🌸.")}

    <form class="card" id="setorForm">
      <div class="form-grid">
        <div class="field">
          <label>Peserta Setor</label>
          <div class="readonly-box">${esc(pName(pesertaId))}</div>
        </div>
        <div class="field">
          <label>Penyimak / Penilai</label>
          <div class="readonly-box">${esc(pName(penilaiId))}</div>
        </div>

        <div class="field full">
          <label>Jenis Setoran</label>
          <div class="seg">
            ${["Ziyadah", "Muroja'ah"].map(j => `
              <label>
                <input type="radio" name="jenis" value="${esc(j)}" ${curJenis===j?"checked":""}>
                <span>${esc(j)}</span>
              </label>
            `).join("")}
          </div>
        </div>

        <div class="field">
          <label for="fSurah">Surah</label>
          <select id="fSurah">
            ${SURAH.map(([nama, ay], i) => `<option value="${i+1}" ${Number(curSurah)===(i+1)?"selected":""}>${i+1}. ${esc(nama)} (${ay} ayat)</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label for="fTgl">Tanggal Setor</label>
          <input id="fTgl" type="date" value="${esc(curTgl)}" required>
        </div>

        <div class="field">
          <label for="fAwal">Ayat Awal</label>
          <input id="fAwal" type="number" min="1" max="${info0.totalAyat}" value="${Number(curAwal)||1}" required>
        </div>

        <div class="field">
          <label for="fAkhir">Ayat Akhir</label>
          <input id="fAkhir" type="number" min="1" max="${info0.totalAyat}" value="${Number(curAkhir)||1}" required>
        </div>

        <div class="field full">
          <label>Penilaian</label>
          <div class="seg">
            ${NILAI.map(n => `
              <label>
                <input type="radio" name="nilai" value="${esc(n)}" ${curNilai===n?"checked":""}>
                <span>${esc(n)}</span>
              </label>
            `).join("")}
          </div>
        </div>

        <div class="field full">
          <label for="fCatatan">Catatan / Koreksi Tajwid (opsional)</label>
          <textarea id="fCatatan" placeholder="Contoh: Lancar di ayat 1–5, perhatikan mad thabi’i di akhir ayat...">${esc(curCatatan)}</textarea>
        </div>

        <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="submit">${editing ? "Simpan Perubahan" : "Simpan Setoran"}</button>
          ${editing ? `<button class="btn ghost" type="button" id="cancelEditBtn">Batal Edit</button>` : ""}
        </div>
      </div>
    </form>
  `;

  const surahSel = $("fSurah");
  const awalInp = $("fAwal");
  const akhirInp = $("fAkhir");

  surahSel.addEventListener("change", () => {
    const info = getSurahInfo(surahSel.value);
    if(!info) return;
    awalInp.max = info.totalAyat;
    akhirInp.max = info.totalAyat;
    if(Number(awalInp.value) > info.totalAyat) awalInp.value = 1;
    if(Number(akhirInp.value) > info.totalAyat) akhirInp.value = info.totalAyat;
  });

  if($("cancelEditBtn")){
    $("cancelEditBtn").addEventListener("click", () => {
      editId = null;
      tab = "hist";
      render();
    });
  }

  $("setorForm").addEventListener("submit", async e => {
    e.preventDefault();
    const jenis = document.querySelector('input[name="jenis"]:checked')?.value || "Ziyadah";
    const nilai = document.querySelector('input[name="nilai"]:checked')?.value || "Lancar";
    const surah = Number(surahSel.value) || 1;
    const info = getSurahInfo(surah);
    const maxAyat = info ? info.totalAyat : 999;
    let awal = Math.max(1, Math.min(maxAyat, Number(awalInp.value) || 1));
    let akhir = Math.max(1, Math.min(maxAyat, Number(akhirInp.value) || 1));
    if(akhir < awal){
      const tmp = awal; awal = akhir; akhir = tmp;
    }
    const ayat = akhir - awal + 1;
    const tgl = $("fTgl").value || today();
    const catatan = $("fCatatan").value.trim();
    const materiLabel = info ? `${info.no}. ${info.name} (${awal}–${akhir})` : "";

    if(editing){
      editing.jenis = jenis;
      editing.surah = surah;
      editing.awal = awal;
      editing.akhir = akhir;
      editing.materi = materiLabel;
      editing.ayat = ayat;
      editing.tgl = tgl;
      editing.nilai = nilai;
      editing.catatan = catatan;
      editId = null;
      await persistState();
      toast("Setoran diperbarui.");
      tab = "hist";
    }else{
      S.setoran.push({
        id: uid(),
        pid: pesertaId,
        penilai: penilaiId,
        jenis,
        surah,
        awal,
        akhir,
        materi: materiLabel,
        ayat,
        tgl,
        nilai,
        catatan,
        createdAt: Date.now()
      });
      await persistState();
      toast("Setoran tersimpan!");
      tab = "hist";
    }
    render();
  });
  bindTopBarLogout();
}

function exportHistJpg(rows){
  const W = 1280;
  const pad = 48;
  const headerH = 126;
  const theadH = 44;
  const rowH = 54;
  const footerH = 44;
  const bodyRows = rows.length ? rows : [null];
  const H = pad * 2 + headerH + theadH + bodyRows.length * rowH + footerH;

  const canvas = document.createElement("canvas");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // Latar belakang krem hangat
  ctx.fillStyle = "#f6f3ea";
  ctx.fillRect(0, 0, W, H);

  // Kartu utama
  const cardX = pad - 12;
  const cardY = pad - 12;
  const cardW = W - (pad - 12) * 2;
  const cardH = H - (pad - 12) * 2;
  ctx.fillStyle = "#fffefb";
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 18);
  ctx.fill();
  ctx.strokeStyle = "#e3decb";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Banner judul
  const bannerY = pad + 4;
  ctx.fillStyle = "#0a4f3a";
  ctx.beginPath();
  ctx.roundRect(pad + 6, bannerY, W - (pad + 6) * 2, 86, 14);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 28px Georgia, serif";
  ctx.fillText("Buku Setoran Hafalan", pad + 26, bannerY + 38);

  ctx.fillStyle = "#d2ebdc";
  ctx.font = "500 14px system-ui, -apple-system, sans-serif";
  ctx.fillText(`Dicetak pada ${fmt(today())}  ·  Total ${rows.length} catatan setoran`, pad + 26, bannerY + 64);

  // Kolom tabel
  const cols = [
    { label: "Tanggal", x: pad + 14, w: 130 },
    { label: "Peserta", x: pad + 148, w: 195 },
    { label: "Jenis", x: pad + 348, w: 105 },
    { label: "Surah & Ayat", x: pad + 458, w: 255 },
    { label: "Ayat", x: pad + 718, w: 55 },
    { label: "Nilai", x: pad + 778, w: 135 },
    { label: "Catatan", x: pad + 918, w: 295 }
  ];

  const tableTop = pad + headerH;
  ctx.fillStyle = "#e1ece2";
  ctx.beginPath();
  ctx.roundRect(pad + 6, tableTop, W - (pad + 6) * 2, theadH, 10);
  ctx.fill();

  ctx.fillStyle = "#0a4f3a";
  ctx.font = "700 13px system-ui, -apple-system, sans-serif";
  for(const c of cols){
    ctx.fillText(c.label, c.x, tableTop + 27);
  }

  const clipText = (txt, maxW) => {
    const s = String(txt ?? "–");
    if(ctx.measureText(s).width <= maxW) return s;
    let out = s;
    while(out.length > 1 && ctx.measureText(out + "…").width > maxW){
      out = out.slice(0, -1);
    }
    return out + "…";
  };

  let y = tableTop + theadH;
  if(!rows.length){
    ctx.fillStyle = "#62726a";
    ctx.font = "500 15px system-ui, -apple-system, sans-serif";
    ctx.fillText("Belum ada data setoran pada filter ini.", pad + 20, y + 32);
  }else{
    rows.forEach((s, idx) => {
      if(idx % 2 === 1){
        ctx.fillStyle = "#faf8f1";
        ctx.fillRect(pad + 6, y, W - (pad + 6) * 2, rowH);
      }
      ctx.strokeStyle = "#e3decb";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad + 6, y + rowH);
      ctx.lineTo(W - pad - 6, y + rowH);
      ctx.stroke();

      const info = getSurahInfo(s.surah);
      const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");

      ctx.fillStyle = "#1d2b25";
      ctx.font = "500 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(fmt(s.tgl), cols[0].w), cols[0].x, y + 32);

      ctx.font = "700 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(pName(s.pid), cols[1].w), cols[1].x, y + 32);

      ctx.font = "600 13px system-ui, -apple-system, sans-serif";
      ctx.fillStyle = "#0f6b4f";
      ctx.fillText(clipText(s.jenis, cols[2].w), cols[2].x, y + 32);

      ctx.fillStyle = "#1d2b25";
      ctx.font = "500 13.5px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(sr, cols[3].w), cols[3].x, y + 32);
      ctx.fillText(String(s.ayat || 0), cols[4].x, y + 32);

      // Badge nilai
      const nColor = s.nilai === "Lancar" ? ["#dcf0e5", "#0f6b4f"]
                   : s.nilai === "Cukup Lancar" ? ["#f6ebc9", "#8a6410"]
                   : ["#f6dcd4", "#a2432f"];
      ctx.fillStyle = nColor[0];
      ctx.beginPath();
      ctx.roundRect(cols[5].x, y + 14, 122, 26, 999);
      ctx.fill();
      ctx.fillStyle = nColor[1];
      ctx.font = "700 12px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(s.nilai, 110), cols[5].x + 10, y + 31);

      ctx.fillStyle = "#62726a";
      ctx.font = "400 13px system-ui, -apple-system, sans-serif";
      ctx.fillText(clipText(s.catatan || "–", cols[6].w), cols[6].x, y + 32);

      y += rowH;
    });
  }

  ctx.fillStyle = "#62726a";
  ctx.font = "500 12px system-ui, -apple-system, sans-serif";
  ctx.fillText("Buku Setoran Hafalan Al-Qur’an · Reski & Ima", pad + 14, H - pad + 4);

  canvas.toBlob(blob => {
    if(!blob){
      toast("Gagal membuat file JPG.");
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `buku-setoran-${today()}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("File JPG berhasil diunduh!");
  }, "image/jpeg", 0.94);
}

function renderHist(){
  const qLower = flt.q.trim().toLowerCase();
  const rows = sorted(S.setoran).filter(s => {
    if(flt.nilai && s.nilai !== flt.nilai) return false;
    if(flt.jenis && s.jenis !== flt.jenis) return false;
    if(qLower){
      const info = getSurahInfo(s.surah);
      const hay = `${pName(s.pid)} ${pName(s.penilai)} ${s.jenis} ${s.nilai} ${s.catatan} ${s.materi} ${info ? info.name : ""}`.toLowerCase();
      if(!hay.includes(qLower)) return false;
    }
    return true;
  });

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Riwayat Setoran</h1>
        <p class="lead">Semua catatan setoran Ziyadah &amp; Muroja’ah Reski dan Ima.</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" type="button" id="printBtn">Cetak / PDF</button>
        <button class="btn ghost sm" type="button" id="jpgBtn">Cetak JPG</button>
        <button class="btn sm" type="button" id="histAddBtn">+ Catat Setoran</button>
        <button class="top-logout-btn" type="button" data-action="logout" aria-label="Keluar dari akun">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <input id="fSearch" type="search" value="${esc(flt.q)}" placeholder="Cari nama, surah, atau catatan…">
        <select id="fJenis">
          <option value="">Semua jenis</option>
          <option value="Ziyadah" ${flt.jenis==="Ziyadah"?"selected":""}>Ziyadah</option>
          <option value="Muroja'ah" ${flt.jenis==="Muroja'ah"?"selected":""}>Muroja'ah</option>
        </select>
        <select id="fNilai">
          <option value="">Semua penilaian</option>
          ${NILAI.map(n => `<option value="${esc(n)}" ${flt.nilai===n?"selected":""}>${esc(n)}</option>`).join("")}
        </select>
      </div>

      <div class="tbl">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Peserta</th>
              <th>Jenis &amp; Surah</th>
              <th>Ayat</th>
              <th>Penilai</th>
              <th>Nilai</th>
              <th>Catatan</th>
              <th style="text-align:right">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${rows.length ? rows.map(s => {
              const info = getSurahInfo(s.surah);
              const surahTxt = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
              return `
                <tr>
                  <td>${fmt(s.tgl)}</td>
                  <td><strong>${esc(pName(s.pid))}</strong></td>
                  <td><span class="tag">${esc(s.jenis)}</span><div style="margin-top:4px">${esc(surahTxt)}</div></td>
                  <td>${s.ayat || 0}</td>
                  <td>${esc(pName(s.penilai))}</td>
                  <td>${chip(s.nilai)}</td>
                  <td>${esc(s.catatan || "–")}</td>
                  <td class="act">
                    <button class="btn ghost sm" type="button" data-edit="${esc(s.id)}">Edit</button>
                    <button class="btn danger sm" type="button" data-del="${esc(s.id)}">Hapus</button>
                  </td>
                </tr>
              `;
            }).join("") : '<tr><td colspan="8" class="empty">Tidak ada setoran yang sesuai dengan filter.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $("fSearch").addEventListener("input", () => { flt.q = $("fSearch").value; render(); });
  $("fJenis").addEventListener("change", () => { flt.jenis = $("fJenis").value; render(); });
  $("fNilai").addEventListener("change", () => { flt.nilai = $("fNilai").value; render(); });
  $("histAddBtn").addEventListener("click", () => { tab = "add"; editId = null; render(); });

  $("printBtn").addEventListener("click", () => {
    $("print").innerHTML = `
      <h1>Buku Setoran Hafalan</h1>
      <p>Dicetak pada ${esc(fmt(today()))}</p>
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Peserta</th><th>Jenis</th><th>Surah</th><th>Ayat</th><th>Nilai</th><th>Catatan</th></tr>
        </thead>
        <tbody>
          ${rows.map(s => {
            const info = getSurahInfo(s.surah);
            const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
            return `<tr><td>${fmt(s.tgl)}</td><td>${esc(pName(s.pid))}</td><td>${esc(s.jenis)}</td><td>${esc(sr)}</td><td>${s.ayat||0}</td><td>${esc(s.nilai)}</td><td>${esc(s.catatan||"–")}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
    window.print();
  });

  $("jpgBtn").addEventListener("click", () => {
    exportHistJpg(rows);
  });

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      editId = btn.dataset.edit;
      tab = "add";
      render();
    });
  });

  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ok = await ask("Hapus catatan setoran ini?");
      if(!ok) return;
      S.setoran = S.setoran.filter(x => x.id !== btn.dataset.del);
      await persistState();
      toast("Setoran dihapus.");
      render();
    });
  });
  bindTopBarLogout();
}

function renderUser(){
  if(selP){
    const p = S.peserta.find(x => x.id === selP);
    if(!p){ selP = null; return renderUser(); }
    const list = sorted(S.setoran.filter(s => s.pid === p.id));
    const ay = ayatOf(list);
    const pct = Math.min(100, Math.round((ay / Math.max(1, p.target)) * 100));

    $("view").innerHTML = `
      <button class="back" type="button" id="backPesertaBtn">← Kembali ke Daftar Peserta</button>
      <div class="top-bar">
        <div>
          <h1>${esc(p.nama)}</h1>
          <p class="lead">Target hafalan: ${p.target} ayat Ziyadah · Tercapai ${ay} ayat (${pct}%)</p>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="prog-top"><strong>Progress Target</strong><span>${pct}%</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>

        ${renderCompletedSurahSection(list, `Surah Lengkap Terselesaikan — ${p.nama}`)}

        <div class="card">
          <h2>Riwayat Setoran ${esc(p.nama)}</h2>
          <div class="list" style="margin-top:12px">
            ${list.length ? list.map(s => {
              const info = getSurahInfo(s.surah);
              const sr = info ? `${info.no}. ${info.name} (${s.awal}–${s.akhir})` : (s.materi || "–");
              return `
                <div class="row">
                  <div>
                    <strong><span class="tag">${esc(s.jenis)}</span> ${esc(sr)}</strong>
                    <small>${fmt(s.tgl)} · Penilai: ${esc(pName(s.penilai))}${s.ayat ? ` · ${s.ayat} ayat` : ""}${s.catatan ? ` · "${esc(s.catatan)}"` : ""}</small>
                  </div>
                  ${chip(s.nilai)}
                </div>
              `;
            }).join("") : '<div class="empty">Belum ada setoran untuk peserta ini.</div>'}
          </div>
        </div>
      </div>
    `;

    $("backPesertaBtn").addEventListener("click", () => { selP = null; renderUser(); });
    return;
  }

  $("view").innerHTML = `
    ${topBar("Peserta", "Profil peserta dan pengaturan target ayat Ziyadah masing-masing.")}

    <div class="grid-2">
      ${S.peserta.map(p => {
        const list = S.setoran.filter(s => s.pid === p.id);
        const ay = ayatOf(list);
        const pct = Math.min(100, Math.round((ay / Math.max(1, p.target)) * 100));
        return `
          <div class="card">
            <div class="prog-top">
              <strong>${esc(p.nama)}</strong>
              <span>${pct}%</span>
            </div>
            <div class="prog-meta">${ay} / ${p.target} ayat Ziyadah · ${list.length} setoran</div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div class="field" style="margin-top:14px;margin-bottom:10px">
              <label for="tgt_${esc(p.id)}">Target Ziyadah (ayat)</label>
              <input id="tgt_${esc(p.id)}" type="number" min="1" max="6236" value="${p.target}">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn sm" type="button" data-save-tgt="${esc(p.id)}">Simpan Target</button>
              <button class="btn ghost sm" type="button" data-detail-p="${esc(p.id)}">Lihat Detail</button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;

  document.querySelectorAll("[data-save-tgt]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.saveTgt;
      const val = Math.max(1, Number($("tgt_" + id).value) || 600);
      const targetObj = S.peserta.find(x => x.id === id);
      if(targetObj){
        targetObj.target = val;
        await persistState();
        toast("Target diperbarui!");
        renderUser();
      }
    });
  });

  document.querySelectorAll("[data-detail-p]").forEach(btn => {
    btn.addEventListener("click", () => {
      selP = btn.dataset.detailP;
      renderUser();
    });
  });
  bindTopBarLogout();
}

function render(){
  renderNav();
  if(tab === "home") renderHome();
  else if(tab === "dash") renderDash();
  else if(tab === "add") renderAdd();
  else if(tab === "hist") renderHist();
  else if(tab === "user") renderUser();
  else renderHome();
}

async function boot(){
  loadLocal();
  setupBroadcast();
  setupAuthEvents();
  await initFirebaseSync();

  let savedSession = null;
  try{
    savedSession = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
  }catch(e){}

  if(savedSession && (savedSession === "p1" || savedSession === "p2")){
    enterApp(savedSession);
  }else{
    showLogin();
  }
}

boot();
</script>
