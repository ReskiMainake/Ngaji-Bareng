<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Setoran Hafalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea;
  --surface:#fffefb;
  --ink:#1d2b25;
  --mute:#62726a;
  --line:#e3decb;
  --em:#0f6b4f;
  --em-d:#0a4f3a;
  --sage:#e1ece2;
  --sage-d:#b7cfbc;
  --ok:#0f6b4f;
  --ok-bg:#dcf0e5;
  --mid:#8a6410;
  --mid-bg:#f6ebc9;
  --bad:#a2432f;
  --bad-bg:#f6dcd4;
  --shadow:0 10px 28px rgba(15,61,46,.06);
  --shadow-lg:0 18px 42px rgba(10,45,34,.14);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1713;
    --surface:#16201b;
    --ink:#eaf1ec;
    --mute:#9cb0a5;
    --line:#27362f;
    --em:#4bc094;
    --em-d:#7dd7b3;
    --sage:#1e2f27;
    --sage-d:#324b3c;
    --ok:#7dd7b3;
    --ok-bg:#1c352a;
    --mid:#e4c05c;
    --mid-bg:#362e15;
    --bad:#ee9a86;
    --bad-bg:#3d201a;
    --shadow:0 10px 28px rgba(0,0,0,.28);
    --shadow-lg:0 20px 44px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%, rgba(15,107,79,.08), transparent 42%),
    radial-gradient(circle at 92% 12%, rgba(138,100,16,.06), transparent 38%),
    var(--bg);
  color:var(--ink);
  font:15.5px/1.58 Figtree,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.hidden{display:none!important}

/* Layar Masuk */
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px;
}
.login-card{
  width:100%;
  max-width:410px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px 26px;
  box-shadow:var(--shadow-lg);
}
.login-brand{
  font-family:Amiri,serif;
  font-size:34px;
  line-height:1.12;
  color:var(--em-d);
  margin:0 0 6px;
}
.login-sub{
  color:var(--mute);
  margin:0 0 22px;
  font-size:14px;
}
.field{margin-bottom:15px}
.field:last-of-type{margin-bottom:14px}
label{
  display:block;
  font-weight:600;
  font-size:13.5px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--em);
  background:var(--surface);
  box-shadow:0 0 0 3px rgba(15,107,79,.12);
}
.pass-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.pass-wrap input{padding-right:44px}
.eye-btn{
  position:absolute;
  right:8px;
  background:none;
  border:0;
  color:var(--mute);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:color .15s ease, background-color .15s ease;
}
.eye-btn:hover{
  color:var(--ink);
  background:rgba(0,0,0,.06);
}
.remember-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  font-size:13.5px;
}
.remember-row input[type="checkbox"]{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--em);
  cursor:pointer;
}
.remember-row label{
  margin:0;
  font-weight:500;
  cursor:pointer;
}
textarea{min-height:92px;resize:vertical}
.err-box{
  background:var(--bad-bg);
  color:var(--bad);
  border:1px solid transparent;
  border-radius:12px;
  padding:10px 12px;
  font-size:13.5px;
  font-weight:600;
  margin-bottom:14px;
}

/* Tata Letak Utama */
.app{
  display:grid;
  grid-template-columns:244px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:linear-gradient(180deg, var(--em-d) 0%, #073c2c 100%);
  color:#eaf4ee;
  padding:28px 16px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:8px;
  box-shadow:4px 0 24px rgba(0,0,0,.06);
}
.brand{
  font-family:Amiri,serif;
  font-size:30px;
  line-height:1.1;
  margin:0 8px 2px;
}
.brand-sub{
  font-size:12.5px;
  opacity:.78;
  margin:0 8px 14px;
}
.user-pill{
  margin:0 4px 10px;
  padding:11px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.12);
  font-size:13px;
}
.user-pill small{display:block;opacity:.76;font-size:11.5px;letter-spacing:.02em}
.user-pill strong{display:block;font-size:14.5px;margin-top:2px}
.sync-badge{
  margin:0 4px 12px;
  padding:7px 11px;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  font-size:12px;
  display:flex;
  align-items:center;
  gap:7px;
  opacity:.92;
}
.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#7dd7b3;
  flex:none;
}
.sync-dot.warn{background:#e4c05c}
.sync-dot.err{background:#ee9a86}
nav{display:flex;flex-direction:column;gap:4px}
nav button{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  border:0;
  color:inherit;
  padding:10.5px 12px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
  font-weight:500;
  font-size:14.5px;
  transition:background-color .16s ease, transform .16s ease;
}
nav button svg{width:19px;height:19px;flex:none}
nav button:hover{background:rgba(255,255,255,.1)}
nav button[aria-current=page]{
  background:var(--bg);
  color:#0a4f3a;
  font-weight:700;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}
.side-foot{
  margin-top:auto;
  display:grid;
  gap:8px;
  padding:0 4px;
}

main{
  padding:30px clamp(16px,3.5vw,42px) 56px;
  max-width:1060px;
  width:100%;
  min-width:0;
}
.top-bar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:22px;
}
h1{
  font-family:Amiri,serif;
  font-size:clamp(29px,4.2vw,39px);
  line-height:1.14;
  color:var(--em-d);
  margin:0 0 4px;
}
.lead{
  color:var(--mute);
  margin:0;
  font-size:14.5px;
  max-width:60ch;
}
.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
h2{
  font-size:17px;
  margin:0;
  font-weight:700;
}
.sec-sub{
  color:var(--mute);
  font-size:13.5px;
  margin:4px 0 0;
}
.sec-head{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 22px;
  min-width:0;
  box-shadow:var(--shadow);
  transition:border-color .18s ease, transform .18s ease;
}
.stack{display:grid;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.stat b{
  display:block;
  font-size:31px;
  line-height:1.12;
  font-weight:700;
  color:var(--em-d);
  letter-spacing:-.02em;
}
.stat span{
  display:block;
  font-size:13.5px;
  color:var(--mute);
  margin-top:5px;
}
.stat.main{
  background:linear-gradient(135deg, var(--em-d) 0%, var(--em) 100%);
  border-color:transparent;
  color:#eaf4ee;
}
.stat.main b{color:#fff}
.stat.main span{color:#d2ebdc}

.bar{
  height:9px;
  background:var(--sage);
  border-radius:999px;
  overflow:hidden;
  margin-top:11px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg, var(--em) 0%, var(--em-d) 100%);
  border-radius:999px;
  transition:width .3s ease;
}
.stat.main .bar{background:rgba(255,255,255,.22)}
.stat.main .bar>i{background:#d4f0df}

.prog-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:var(--bg);
}
.prog-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}
.prog-top strong{font-size:15.5px}
.prog-top span{font-size:14px;font-weight:700;color:var(--em-d)}
.prog-meta{
  font-size:13px;
  color:var(--mute);
  margin-top:4px;
}

.quote-box{
  display:grid;
  gap:12px;
  margin-bottom:16px;
}
.quote-item{
  border:1px solid var(--line);
  border-left:4px solid var(--em);
  border-radius:14px;
  padding:14px 16px;
  background:var(--bg);
}
.quote-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:13.5px;
}
.quote-time{color:var(--mute);font-size:12px}
.quote-body{
  margin:8px 0 12px;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.quote-foot{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.like-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .16s ease;
}
.like-btn:hover{border-color:var(--sage-d)}
.like-btn.liked{
  border-color:#d88b9c;
  background:#fff0f3;
  color:#b4234b;
}

.list{display:flex;flex-direction:column}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0;padding-top:2px}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

.done-surah-list{
  display:grid;
  gap:10px;
}
.done-group{
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 15px;
  background:var(--bg);
}
.done-date{
  font-size:13px;
  font-weight:700;
  color:var(--em-d);
  margin-bottom:8px;
}
.done-items{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.done-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 11px;
  border-radius:999px;
  background:var(--ok-bg);
  color:var(--ok);
  font-size:13px;
  font-weight:600;
}

.chip{
  display:inline-block;
  font-size:12.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.Lancar{background:var(--ok-bg);color:var(--ok)}
.Cukup{background:var(--mid-bg);color:var(--mid)}
.Ulang{background:var(--bad-bg);color:var(--bad)}
.tag{
  display:inline-block;
  background:var(--sage);
  color:var(--em-d);
  font-size:12.5px;
  font-weight:600;
  padding:2px 9px;
  border-radius:999px;
}

.btn{
  border:1px solid var(--em);
  background:var(--em);
  color:#fff;
  padding:9.5px 16px;
  border-radius:11px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:filter .16s ease, transform .14s ease, background-color .16s ease;
}
@media (prefers-color-scheme:dark){
  .btn{color:#091510}
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{
  background:transparent;
  color:var(--em-d);
  border-color:var(--sage-d);
}
.btn.light{
  background:rgba(255,255,255,.12);
  color:#fff;
  border-color:rgba(255,255,255,.22);
}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{
  background:transparent;
  color:var(--bad);
  border-color:var(--bad-bg);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.form-grid .full{grid-column:1/-1}
.readonly-box{
  padding:10.5px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  font-weight:600;
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500;font-size:14px}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{
  display:block;
  padding:8.5px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
  cursor:pointer;
  transition:all .16s ease;
}
.seg input:checked+span{
  background:var(--sage);
  border-color:var(--em);
  color:var(--em-d);
  font-weight:700;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px}
th,td{
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:14px;
}
th{color:var(--mute);font-weight:600;font-size:12.5px}
tbody tr:hover{background:rgba(15,107,79,.03)}
td.act{white-space:nowrap;text-align:right}
.empty{
  text-align:center;
  color:var(--mute);
  padding:28px 12px;
  font-size:14px;
}
.back{
  background:none;
  border:0;
  color:var(--em-d);
  font-weight:600;
  font-size:14px;
  padding:0 0 10px;
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--em-d);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:600;
  font-size:13.5px;
  z-index:50;
  box-shadow:var(--shadow-lg);
}
dialog{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--surface);
  color:var(--ink);
  max-width:420px;
  width:calc(100% - 32px);
  padding:22px;
  box-shadow:var(--shadow-lg);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-act{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:16px;
}
#print{display:none}

@media (max-width:900px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{display:block}
  aside{
    position:fixed;
    left:0;right:0;bottom:0;top:auto;
    height:auto;
    flex-direction:row;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:30;
    box-shadow:0 -4px 20px rgba(0,0,0,.14);
  }
  .brand,.brand-sub,.user-pill,.sync-badge,.side-foot{display:none}
  nav{flex-direction:row;width:100%;justify-content:space-around}
  nav button{
    flex-direction:column;
    gap:2px;
    font-size:11.5px;
    padding:6px 4px;
    flex:1;
    align-items:center;
  }
  main{padding:20px 14px 92px}
  .card{padding:17px 16px;border-radius:16px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){
  .grid-2,.grid-4,.form-grid,.filters{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .login-wrap,.app,.toast,dialog{display:none!important}
  #print{display:block;font-family:Figtree,sans-serif}
  #print h1{color:#0a4f3a}
  #print table{min-width:0}
  #print th,#print td{font-size:12px;border-bottom:1px solid #bbb}
}
</style>
</head>
<body>

<section class="login-wrap" id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="off">
    <p class="login-brand">Buku Setoran</p>
    <p class="login-sub">Masuk menggunakan username dan sandi peserta untuk membuka buku hafalan.</p>
    <div id="loginErr" class="err-box hidden" role="alert"></div>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" required placeholder="Masukkan username">
    </div>
    <div class="field">
      <label for="loginPass">Sandi</label>
      <div class="pass-wrap">
        <input id="loginPass" type="password" required placeholder="Masukkan sandi">
        <button class="eye-btn" type="button" id="togglePassBtn" aria-label="Lihat atau sembunyikan sandi" aria-pressed="false">
          <svg id="eyeIcon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="remember-row">
      <input id="rememberMe" type="checkbox">
      <label for="rememberMe">Ingat saya (simpan username & sandi otomatis)</label>
    </div>
    <button class="btn" type="submit" style="width:100%">Masuk</button>
  </form>
</section>

<div class="app hidden" id="mainApp">
  <aside>
    <p class="brand">Buku Setoran</p>
    <p class="brand-sub">Catatan hafalan Al-Qur’an</p>
    <div class="user-pill">
      <small id="sideRoleLabel">Akun aktif</small>
      <strong id="sideUserName">–</strong>
    </div>
    <div class="sync-badge" id="syncBadge" title="Status sinkronisasi Firebase">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Menyiapkan Firebase…</span>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn light sm" type="button" id="sideLogoutBtn">Keluar</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="print"></div>

<dialog id="dlg">
  <p id="dlgMsg" style="margin:0"></p>
  <div class="dlg-act">
    <button class="btn ghost sm" type="button" id="dlgNo">Batal</button>
    <button class="btn sm" type="button" id="dlgYes">Ya</button>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

const CREDENTIALS = {
  reski: { role: "p1", pass: "ReskiMainake", nama: "Reski" },
  ima:   { role: "p2", pass: "ImaSholeha",   nama: "Ima Cantik Sholeha🌸", isAdmin: false }
};

const STORAGE_KEY = "buku-setoran-state-v1";
const SESSION_KEY = "buku-setoran-session-v1";
const REMEMBER_KEY = "buku-setoran-remember-v1";
const FIREBASE_CFG_KEY = "buku-setoran-firebase-cfg-v1";
const CHANNEL_NAME = "buku-setoran-channel-v1";

function getSurahInfo(surahNum){
  const idx = Number(surahNum) - 1;
  if(idx < 0 || idx >= SURAH.length) return null;
  return { no: idx + 1, name: SURAH[idx][0], totalAyat: SURAH[idx][1] };
}

function getCompletedSurahByDate(list){
  const bySurah = new Map();
  for(const s of list){
    const info = getSurahInfo(s.surah);
    if(!info) continue;
    const awal = Number(s.awal) || 1;
    const akhir = Number(s.akhir) || 1;
    const isFull = awal <= 1 && akhir >= info.totalAyat;
    if(!isFull) continue;

    const prev = bySurah.get(info.no);
    if(!prev || String(s.tgl || "").localeCompare(prev.tgl) > 0){
      bySurah.set(info.no, {
        no: info.no,
        name: info.name,
        totalAyat: info.totalAyat,
        tgl: s.tgl || today()
      });
    }
  }

  const grouped = new Map();
  for(const item of bySurah.values()){
    if(!grouped.has(item.tgl)) grouped.set(item.tgl, []);
    grouped.get(item.tgl).push(item);
  }

  return [...grouped.entries()]
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .map(([tgl, surahs])=>({
      tgl,
      surahs: surahs.sort((a,b)=>a.no - b.no)
    }));
}

function renderCompletedSurahSection(list, titleText="Ringkasan Surah Terselesaikan (Lengkap)"){

  return `

function today(){
  const d = new Date();
  return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function weekStart(){
  const d = new Date();
  const k = (d.getDay() + 6) % 7;
  return daysAgo(k);
}

}
function normalizeState(raw){
  if(raw && typeof raw === "object" && !Array.isArray(raw)){
    if(Array.isArray(raw.setoran) && !raw.setoran.length && raw.setoranMap && typeof raw.setoranMap === "object"){
      raw.setoran = Object.values(raw.setoranMap);
    }
    if(Array.isArray(raw.quotes) && !raw.quotes.length && raw.quotesMap && typeof raw.quotesMap === "object"){
      raw.quotes = Object.values(raw.quotesMap);
    }
  }
  const p1T = raw?.peserta?.find(p=>p.id==="p1")?.target || 600;
  const p2T = raw?.peserta?.find(p=>p.id==="p2")?.target || 600;
  const quotes = Array.isArray(raw?.quotes)
    ? raw.quotes
        .filter(q=>["p1","p2"].includes(q.pid) && Number.isFinite(Number(q.createdAt)) && (Date.now() - Number(q.createdAt) < 24*60*60*1000))
        .map(q=>({
          id: String(q.id || uid()),
          pid: q.pid,
          text: String(q.text || ""),
          likes: Array.isArray(q.likes) ? q.likes.filter(x=>["p1","p2"].includes(x)) : [],
          createdAt: Number(q.createdAt)
        }))
    : [];
  const setoran = Array.isArray(raw?.setoran)
    ? raw.setoran
        .filter(s=>["p1","p2"].includes(s.pid) && s.penilai !== s.pid)
        .map(s=>({
          id: String(s.id || uid()),
          pid: s.pid,
          penilai: ["p1","p2"].includes(s.penilai) ? s.penilai : partnerIdOf(s.pid),
          jenis: s.jenis === "Muroja'ah" ? "Muroja'ah" : "Ziyadah",
          surah: Number(s.surah) || 1,
          awal: Number(s.awal) || 1,
          akhir: Number(s.akhir) || 1,
          materi: String(s.materi || ""),
          ayat: Number(s.ayat) || 0,
          tgl: String(s.tgl || today()),
          nilai: NILAI.includes(s.nilai) ? s.nilai : "Lancar",
          catatan: String(s.catatan || ""),
          createdAt: Number(s.createdAt) || Date.now()
        }))
    : [];
  return {
    peserta:[
      { id:"p1", nama:"Reski", target:Math.max(1, Number(p1T)||600) },
      { id:"p2", nama:"Ima Cantik Sholeha🌸", target:Math.max(1, Number(p2T)||600) }
    ],
    setoran,
    quotes,
    updatedAt: Number(raw?.updatedAt) || Date.now()
  };
}

function toFirebasePayload(stateObj){
  return {
    peserta: stateObj.peserta,
    setoran: stateObj.setoran,
    quotes: stateObj.quotes,
    updatedAt: Number(stateObj.updatedAt) || Date.now()
  };
}

async function persistState(){
  S.updatedAt = Date.now();
  saveLocal();
  if(bc){
    try{ bc.postMessage({ type:"state", state:S }); }catch(e){}
  }
  if(!applyingRemote){
    await pushFirebaseState(S);
  }
}

function applyIncomingState(raw){
  if(!raw || typeof raw !== "object") return;
  const incoming = normalizeState(raw);
  const localTs = Number(S.updatedAt) || 0;
  const remoteTs = Number(incoming.updatedAt) || 0;
  if(remoteTs >= localTs && JSON.stringify(incoming) !== JSON.stringify(S)){
    applyingRemote = true;
    S = incoming;
    saveLocal();
    if(activeRole) render();
    applyingRemote = false;
  }
}

async function pushFirebaseState(stateObj){
  if(!dbRef){
    setSyncBadge("warn", "Mode Lokal (Belum terhubung Firebase)");
    return;
  }
  try{
    setSyncBadge("warn", "Menyimpan ke Firebase…");
    await set(dbRef, toFirebasePayload(stateObj));
    setSyncBadge("ok", "Terhubung Firebase Realtime");
  }catch(err){
    console.error("Firebase write error:", err);
    setSyncBadge("err", "Gagal simpan ke Firebase (cek Rules)");
  }
}

async function initFirebaseSync(){
  if(typeof unsubDb === "function"){
    try{ unsubDb(); }catch(e){}
    unsubDb = null;
  }
  dbRef = null;

  const cfg = getFirebaseConfig();
  if(!cfg.databaseURL){
    setSyncBadge("warn", "Mode Lokal (Isi Database URL Firebase)");
    return;
  }

  try{
    const appName = "buku-setoran-firebase-app";
    const fbApp = initializeApp({
      apiKey: cfg.apiKey || "AIzaSyDummyKeyForRealtimeDB",
      authDomain: cfg.authDomain || undefined,
      databaseURL: cfg.databaseURL,
      projectId: cfg.projectId || undefined,
      storageBucket: cfg.storageBucket || undefined,
      messagingSenderId: cfg.messagingSenderId || undefined,
      appId: cfg.appId || undefined
    }, appName);

    const db = getDatabase(fbApp);
    dbRef = ref(db, `rooms/${cfg.room}/state`);
    setSyncBadge("warn", "Menghubungkan ke Firebase…");

    const snap = await get(dbRef);
    if(snap.exists()){
      applyIncomingState(snap.val());
    }else if((S.setoran && S.setoran.length) || (S.quotes && S.quotes.length)){
      await set(dbRef, toFirebasePayload(S));
    }

    unsubDb = onValue(dbRef, snapshot => {
      if(snapshot.exists()){
        applyIncomingState(snapshot.val());
      }
      setSyncBadge("ok", "Terhubung Firebase Realtime");
    }, err => {
      console.error("Firebase listener error:", err);
      setSyncBadge("err", "Akses Firebase ditolak / offline");
    });
  }catch(err){
    console.error("Firebase init error:", err);
    setSyncBadge("err", "Konfigurasi Firebase tidak valid");
  }
}

function setupBroadcast(){
  if("BroadcastChannel" in window){
    bc = new BroadcastChannel(CHANNEL_NAME);
    bc.onmessage = ev => {
      if(ev.data?.type === "state") applyIncomingState(ev.data.state);
    };
  }
  window.addEventListener("storage", ev => {
    if(ev.key === STORAGE_KEY && ev.newValue){
      try{ applyIncomingState(JSON.parse(ev.newValue)); }catch(e){}
    }
    if(ev.key === SESSION_KEY && !ev.newValue && activeRole){
      logout(false);
    }
    if(ev.key === FIREBASE_CFG_KEY){
      initFirebaseSync();
    }
  });
}

          ${quotes.length ? quotes.map(q=>{
            const likes = Array.isArray(q.likes) ? q.likes : [];
            const likedByMe = likes.includes(activeRole);
            const timeStr = new Date(q.createdAt).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
            return `
              <div class="quote-item">
                <div class="quote-head">
                  <strong>${esc(pName(q.pid))}</strong>
                  <span class="quote-time">Hari ini · ${timeStr}</span>
                </div>
                <p class="quote-body">${esc(q.text)}</p>
                <div class="quote-foot">
                  <button type="button" class="like-btn ${likedByMe ? "liked" : ""}" data-like="${q.id}">
                    ${likedByMe ? "♥" : "♡"} Suka (${likes.length})
                  </button>
                  ${q.pid === activeRole ? `<button type="button" class="btn ghost sm" data-delq="${q.id}">Hapus</button>` : ""}
                </div>
              </div>
            `;
          }).join("") : '<div class="empty">Belum ada quotes aktif dalam 24 jam terakhir.</div>'}
        </div>

        <form id="quoteForm">
          <div class="field">
            <label for="quoteInput">Tulis quote untuk hari ini</label>
            <textarea id="quoteInput" maxlength="280" placeholder="Tulis pesan semangat, nasihat, atau quote singkat..."></textarea>
          </div>
          <button class="btn sm" type="submit">Kirim Quote</button>
        </form>
      </section>

      <section class="card">
        <div class="sec-head">
          <h2>Setoran Terbaru</h2>
          <button class="btn ghost sm" type="button" id="allHistBtn">Lihat semua</button>
        </div>
        <div class="list">
          ${rec.length ? rec.map(s=>`
            <div class="row">
              <div>
                <strong>${esc(pName(s.pid))}</strong> · <span class="tag">${esc(s.jenis)}</span> ${esc(s.materi)}
                <small>${fmt(s.tgl)} · Dinilai oleh ${esc(pName(s.penilai))}${s.catatan?" · "+esc(s.catatan):""}</small>
              </div>
              ${chip(s.nilai)}
            </div>
          `).join("") : '<div class="empty">Belum ada data setoran.</div>'}
        </div>
      </section>
    </div>
  `;

  $("topLogoutBtn").onclick = () => logout(true);
  $("goSetorBtn").onclick = () => { editId = null; tab = "add"; render(); };
  $("allHistBtn").onclick = () => { tab = "hist"; render(); };

  $("quoteForm").onsubmit = async ev => {
    ev.preventDefault();
    cleanExpiredQuotes();
    const txt = $("quoteInput").value.trim();
    if(!txt){
      toast("Tulis quote terlebih dahulu.");
      return;
    }
    S.quotes.push({
      id: uid(),
      pid: activeRole,
      text: txt,
      likes: [],
      createdAt: Date.now()
    });
    await persistState();
    toast("Quote terkirim.");
    dash();
  };

  $("view").querySelectorAll("[data-like]").forEach(btn=>{
    btn.onclick = async () => {
      cleanExpiredQuotes();
      const q = S.quotes.find(x=>x.id===btn.dataset.like);
      if(!q) return;
      if(!Array.isArray(q.likes)) q.likes = [];
      if(q.likes.includes(activeRole)){
        q.likes = q.likes.filter(x=>x!==activeRole);
      }else{
        q.likes.push(activeRole);
      }
      await persistState();
      dash();
    };
  });

  $("view").querySelectorAll("[data-delq]").forEach(btn=>{
    btn.onclick = async () => {
      const ok = await ask("Hapus quote ini?", "Hapus");
      if(!ok) return;
      S.quotes = S.quotes.filter(x=>x.id!==btn.dataset.delq);
      await persistState();
      toast("Quote dihapus.");
      dash();
    };
  });
}

function surahOpts(sel){
  return SURAH.map(([n,a],i)=>`<option value="${i+1}" ${+(sel||1)===i+1?"selected":""}>${i+1}. ${esc(n)} (${a} ayat)</option>`).join("");
}

function formView(){
  const cur = editId ? S.setoran.find(s=>s.id===editId) : null;
  const targetPid = cur ? cur.pid : activeRole;
  const penilaiId = cur ? cur.penilai : partnerIdOf(targetPid);
  const v = cur || { pid:targetPid, penilai:penilaiId, jenis:"Ziyadah", surah:1, awal:1, akhir:1, tgl:today(), nilai:"Lancar", catatan:"" };
  const sInfo = SURAH[(v.surah||1)-1] || SURAH[0];

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>${cur ? "Ubah Setoran" : "Catat & Nilai Setoran"}</h1>
        <p class="lead">Penyetor otomatis mengikuti akun aktif (<strong>${esc(pName(targetPid))}</strong>) dan dinilai oleh <strong>${esc(pName(penilaiId))}</strong>.</p>
      </div>
    </div>
    <form class="card form-grid" id="f">
      <div>
        <label>Penyetor</label>
        <div class="readonly-box">${esc(pName(targetPid))}</div>
      </div>
      <div>
        <label>Penilai</label>
        <div class="readonly-box">${esc(pName(penilaiId))}</div>
      </div>
      <div>
        <label>Jenis Setoran</label>
        <div class="seg">
          ${["Ziyadah","Muroja'ah"].map(j=>`<label><input type="radio" name="jenis" value="${j}" ${v.jenis===j?"checked":""}><span>${j}</span></label>`).join("")}
        </div>
      </div>
      <div>
        <label for="tgl">Tanggal</label>
        <input id="tgl" type="date" value="${esc(v.tgl)}" required>
      </div>
      <div class="full">
        <label for="surah">Surah</label>
        <select id="surah">${surahOpts(v.surah)}</select>
      </div>
      <div>
        <label for="awal">Ayat Awal</label>
        <input id="awal" type="number" min="1" max="${sInfo[1]}" value="${v.awal}" required>
      </div>
      <div>
        <label for="akhir">Ayat Akhir</label>
        <input id="akhir" type="number" min="1" max="${sInfo[1]}" value="${v.akhir}" required>
      </div>
      <div class="full">
        <label>Penilaian</label>
        <div class="seg">
          ${NILAI.map(n=>`<label><input type="radio" name="nilai" value="${n}" ${v.nilai===n?"checked":""}><span>${n}</span></label>`).join("")}
        </div>
      </div>
      <div class="full">
        <label for="catatan">Catatan</label>
        <textarea id="catatan" placeholder="Catatan tajwid, waqaf, atau bagian yang perlu diulang">${esc(v.catatan)}</textarea>
      </div>
      <div class="full" style="display:flex;gap:8px;justify-content:flex-end">
        ${cur ? '<button class="btn ghost" type="button" id="cancel">Batal</button>' : ""}
        <button class="btn" type="submit">${cur ? "Simpan Perubahan" : "Simpan Setoran"}</button>
      </div>
    </form>
  `;

  const surahEl = $("surah"), awalEl = $("awal"), akhirEl = $("akhir");
  surahEl.onchange = () => {
    const max = SURAH[+surahEl.value - 1][1];
    awalEl.max = akhirEl.max = max;
    if(+awalEl.value > max) awalEl.value = 1;
    if(+akhirEl.value > max) akhirEl.value = max;
  };
  if($("cancel")) $("cancel").onclick = () => { editId = null; tab = "hist"; render(); };

  $("f").onsubmit = async ev => {
    ev.preventDefault();
    const max = SURAH[+surahEl.value - 1][1];
    const awal = +awalEl.value, akhir = +akhirEl.value;
    if(awal < 1 || akhir > max || awal > akhir){
      toast(`Rentang ayat harus 1 sampai ${max} dan awal ≤ akhir.`);
      return;
    }
    const jenis = $("f").jenis.value;
    const ayat = akhir - awal + 1;
    const materi = `${SURAH[+surahEl.value - 1][0]} ${awal}–${akhir} (${ayat} ayat)`;
    const rec = {
      id: cur ? cur.id : uid(),
      pid: targetPid,
      penilai: penilaiId,
      jenis,
      surah: +surahEl.value,
      awal,
      akhir,
      materi,
      ayat,
      tgl: $("tgl").value,
      nilai: $("f").nilai.value,
      catatan: $("catatan").value.trim(),
      createdAt: cur ? cur.createdAt : Date.now()
    };
    if(cur) S.setoran = S.setoran.map(x=>x.id===cur.id ? rec : x);
    else S.setoran.push(rec);
    await persistState();
    toast(cur ? "Setoran diperbarui." : "Setoran tersimpan.");
    editId = null; tab = "hist"; render();
  };
}

function hist(){
  const q = flt.q.trim().toLowerCase();
  const rows = sorted(S.setoran).filter(s =>
    (!flt.nilai || s.nilai===flt.nilai) &&
    (!flt.jenis || s.jenis===flt.jenis) &&
    (!q || [pName(s.pid), pName(s.penilai), s.materi, s.catatan].some(x=>String(x||"").toLowerCase().includes(q)))
  );

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Riwayat Setoran</h1>
        <p class="lead">Seluruh catatan setoran dan penilaian Reski & Ima Cantik Sholeha🌸.</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" type="button" id="printBtn">Cetak PDF</button>
        <button class="btn sm" type="button" id="newBtn">+ Catat Setoran</button>
      </div>
    </div>
    <div class="card">
      <div class="filters">
        <input id="q" type="search" placeholder="Cari penyetor, penilai, surah, atau catatan..." value="${esc(flt.q)}">
        <select id="fJenis">
          <option value="">Semua jenis</option>
          <option value="Ziyadah" ${flt.jenis==="Ziyadah"?"selected":""}>Ziyadah</option>
          <option value="Muroja'ah" ${flt.jenis==="Muroja'ah"?"selected":""}>Muroja'ah</option>
        </select>
        <select id="fNilai">
          <option value="">Semua penilaian</option>
          ${NILAI.map(n=>`<option value="${n}" ${flt.nilai===n?"selected":""}>${n}</option>`).join("")}
        </select>
      </div>
      <div class="tbl">
        <table>
          <thead>
            <tr><th>Tanggal</th><th>Penyetor</th><th>Penilai</th><th>Jenis</th><th>Materi</th><th>Nilai</th><th>Catatan</th><th></th></tr>
          </thead>
          <tbody>
            ${rows.length ? rows.map(s=>`
              <tr>
                <td>${fmt(s.tgl)}</td>
                <td><strong>${esc(pName(s.pid))}</strong></td>
                <td>${esc(pName(s.penilai))}</td>
                <td><span class="tag">${esc(s.jenis)}</span></td>
                <td>${esc(s.materi)}</td>
                <td>${chip(s.nilai)}</td>
                <td>${esc(s.catatan||"–")}</td>
                <td class="act">
                  <button class="btn ghost sm" data-e="${s.id}">Ubah</button>
                  <button class="btn danger sm" data-d="${s.id}">Hapus</button>
                </td>
              </tr>
            `).join("") : '<tr><td colspan="8" class="empty">Tidak ada data yang cocok dengan filter.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $("q").oninput = e => { flt.q = e.target.value; hist(); };
  $("fJenis").onchange = e => { flt.jenis = e.target.value; hist(); };
  $("fNilai").onchange = e => { flt.nilai = e.target.value; hist(); };
  $("newBtn").onclick = () => { editId = null; tab = "add"; render(); };
  $("printBtn").onclick = () => {
    $("print").innerHTML = `
      <h1>Rekap Setoran Hafalan</h1>
      <p>Dicetak ${fmt(today())} · ${rows.length} catatan</p>
      <table>
        <thead><tr><th>Tanggal</th><th>Penyetor</th><th>Penilai</th><th>Jenis</th><th>Materi</th><th>Nilai</th><th>Catatan</th></tr></thead>
        <tbody>${rows.map(s=>`<tr><td>${fmt(s.tgl)}</td><td>${esc(pName(s.pid))}</td><td>${esc(pName(s.penilai))}</td><td>${esc(s.jenis)}</td><td>${esc(s.materi)}</td><td>${esc(s.nilai)}</td><td>${esc(s.catatan||"–")}</td></tr>`).join("")}</tbody>
      </table>
    `;
    window.print();
  };
  $("view").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ editId=b.dataset.e; tab="add"; render(); });
  $("view").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
    if(!await ask("Hapus catatan setoran ini?")) return;
    S.setoran = S.setoran.filter(x=>x.id!==b.dataset.d);
    await persistState();
    toast("Setoran dihapus.");
    hist();
  });
}

function pesertaView(){
  if(selP){
    const p = S.peserta.find(x=>x.id===selP);
    if(!p){ selP = null; return pesertaView(); }
    const l = sorted(S.setoran.filter(s=>s.pid===p.id));
    const ay = ayatOf(l);
    const pct = p.target ? Math.min(100, Math.round(ay/p.target*100)) : 0;

    $("view").innerHTML = `
      <button class="back" type="button" id="backBtn">← Kembali ke daftar peserta</button>
      <div class="top-bar">
        <div>
          <h1>${esc(p.nama)}</h1>
          <p class="lead">${ay} / ${p.target} ayat Ziyadah (${pct}%) · ${l.length} setoran tercatat</p>
        </div>
        <button class="btn sm" type="button" id="addForBtn">+ Catat Setoran</button>
      </div>
      <div class="stack">
        <div class="card">
          <div class="prog-top"><strong>Target Ziyadah</strong><span>${ay} / ${p.target} ayat (${pct}%)</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        ${renderCompletedSurahSection(l, `Surah Terselesaikan — ${p.nama}`)}
        <div class="card">
          <h2>Riwayat Setoran ${esc(p.nama)}</h2>
          <div class="list" style="margin-top:10px">
            ${l.length ? l.map(s=>`
              <div class="row">
                <div>
                  <strong><span class="tag">${esc(s.jenis)}</span> ${esc(s.materi)}</strong>
                  <small>${fmt(s.tgl)} · Dinilai oleh ${esc(pName(s.penilai))}${s.catatan?" · "+esc(s.catatan):""}</small>
                </div>
                ${chip(s.nilai)}
              </div>
            `).join("") : '<div class="empty">Belum ada setoran untuk peserta ini.</div>'}
          </div>
        </div>
      </div>
    `;
    $("backBtn").onclick = () => { selP = null; pesertaView(); };
    $("addForBtn").onclick = () => { editId = null; tab = "add"; render(); };
    return;
  }

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Daftar Peserta</h1>
        <p class="lead">Atur target hafalan dan pantau pencapaian surah tiap peserta.</p>
      </div>
    </div>
    <div class="stack">
      <div class="grid-2">
        ${S.peserta.map(p=>{
          const l = S.setoran.filter(s=>s.pid===p.id);
          const ay = ayatOf(l);
          const pct = p.target ? Math.min(100, Math.round(ay/p.target*100)) : 0;
          return `
            <div class="card">
              <div class="prog-top"><strong>${esc(p.nama)}</strong><span>${pct}%</span></div>
              <div class="prog-meta">${ay} / ${p.target} ayat Ziyadah · ${l.length} setoran</div>
              <div class="bar"><i style="width:${pct}%"></i></div>
              <form class="form-grid" data-p="${p.id}" style="margin-top:14px">
                <div>
                  <label>Target (ayat)</label>
                  <input type="number" min="1" name="target" value="${p.target}" required>
                </div>
                <div style="display:flex;align-items:flex-end">
                  <button class="btn ghost sm" type="submit">Simpan Target</button>
                </div>
              </form>
              <div style="margin-top:12px">
                <button class="btn sm" type="button" data-open="${p.id}">Lihat Detail</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;

  $("view").querySelectorAll("form[data-p]").forEach(f=>f.onsubmit=async ev=>{
    ev.preventDefault();
    const p = S.peserta.find(x=>x.id===f.dataset.p);
    p.target = Math.max(1, +f.target.value || 600);
    await persistState();
    toast("Target tersimpan.");
    pesertaView();
  });
  $("view").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ selP=b.dataset.open; pesertaView(); });
}

function init(){
  loadLocal();
  setupBroadcast();
  initFirebaseSync();

  $("togglePassBtn").onclick = () => {
    const nextVisible = $("loginPass").type === "password";
    setEyeState(nextVisible);
  };

  $("loginForm").onsubmit = ev => {
    ev.preventDefault();
    const u = $("loginUser").value.trim().toLowerCase();
    const p = $("loginPass").value;
    const found = CREDENTIALS[u];

    if(!found || found.pass !== p){
      $("loginErr").textContent = "Username atau sandi tidak sesuai.";
      $("loginErr").classList.remove("hidden");
      return;
    }

    if($("rememberMe").checked){
      localStorage.setItem(REMEMBER_KEY, JSON.stringify({
        user: $("loginUser").value.trim(),
        pass: p
      }));
    }else{
      localStorage.removeItem(REMEMBER_KEY);
    }

    $("loginErr").classList.add("hidden");
    activeRole = found.role;
    tab = "dash";
    editId = null;
    selP = null;
    sessionStorage.setItem(SESSION_KEY, activeRole);
    showApp();
    toast(`Selamat datang, ${found.nama}`);
  };

  $("sideLogoutBtn").onclick = () => logout(true);

  const savedSession = sessionStorage.getItem(SESSION_KEY);
  if(savedSession && ["p1","p2"].includes(savedSession)){
    activeRole = savedSession;
    showApp();
  }else{
    applyRememberedLogin();
  }
}

init();
</script>
