<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Setoran Hafalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea;
  --surface:#fffefb;
  --ink:#1d2b25;
  --mute:#62726a;
  --line:#e3decb;
  --em:#0f6b4f;
  --em-d:#0a4f3a;
  --sage:#e1ece2;
  --sage-d:#b7cfbc;
  --ok:#0f6b4f;
  --ok-bg:#dcf0e5;
  --mid:#8a6410;
  --mid-bg:#f6ebc9;
  --bad:#a2432f;
  --bad-bg:#f6dcd4;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111915;
    --surface:#18231e;
    --ink:#e8efe9;
    --mute:#9cb0a5;
    --line:#293831;
    --em:#4bc094;
    --em-d:#7dd7b3;
    --sage:#203129;
    --sage-d:#344e3d;
    --ok:#7dd7b3;
    --ok-bg:#1e382c;
    --mid:#e4c05c;
    --mid-bg:#383016;
    --bad:#ee9a86;
    --bad-bg:#3f221b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.55 Figtree,system-ui,-apple-system,sans-serif;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.hidden{display:none!important}

/* Layar Masuk */
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px;
}
.login-card{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px 24px;
  box-shadow:0 12px 32px rgba(0,0,0,.06);
}
.login-brand{
  font-family:Amiri,serif;
  font-size:34px;
  line-height:1.1;
  color:var(--em-d);
  margin:0 0 6px;
}
.login-sub{
  color:var(--mute);
  font-size:14px;
  margin:0 0 22px;
}
.field{margin-bottom:14px}
.field:last-of-type{margin-bottom:18px}
label{
  display:block;
  font-weight:600;
  font-size:13.5px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
}
textarea{min-height:88px;resize:vertical}
.err-box{
  background:var(--bad-bg);
  color:var(--bad);
  border:1px solid transparent;
  border-radius:11px;
  padding:10px 12px;
  font-size:13.5px;
  font-weight:600;
  margin-bottom:14px;
}

/* Tata Letak Utama */
.app{
  display:grid;
  grid-template-columns:236px minmax(0,1fr);
  min-height:100vh;
}
aside{
  background:var(--em-d);
  color:#eaf4ee;
  padding:26px 16px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.brand{
  font-family:Amiri,serif;
  font-size:28px;
  line-height:1.1;
  margin:0 8px 2px;
}
.brand-sub{
  font-size:12.5px;
  opacity:.78;
  margin:0 8px 18px;
}
.user-pill{
  margin:0 4px 12px;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.1);
  font-size:13px;
}
.user-pill small{display:block;opacity:.75;font-size:11.5px}
.user-pill strong{display:block;font-size:14px;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  border:0;
  color:inherit;
  padding:10px 12px;
  border-radius:11px;
  cursor:pointer;
  text-align:left;
  font-weight:500;
  font-size:14.5px;
}
nav button svg{width:19px;height:19px;flex:none}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current=page]{
  background:#f6f3ea;
  color:#0a4f3a;
  font-weight:700;
}
.side-foot{
  margin-top:auto;
  display:grid;
  gap:8px;
  padding:0 4px;
}

main{
  padding:28px clamp(16px,3.5vw,40px) 52px;
  max-width:1040px;
  width:100%;
  min-width:0;
}
.top-bar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:22px;
}
h1{
  font-family:Amiri,serif;
  font-size:clamp(28px,4.2vw,38px);
  line-height:1.15;
  color:var(--em-d);
  margin:0 0 4px;
}
.lead{
  color:var(--mute);
  margin:0;
  font-size:14.5px;
  max-width:58ch;
}
.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
h2{
  font-size:17px;
  margin:0;
  font-weight:700;
}
.sec-sub{
  color:var(--mute);
  font-size:13.5px;
  margin:4px 0 0;
}
.sec-head{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  min-width:0;
}
.stack{display:grid;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.stat b{
  display:block;
  font-size:30px;
  line-height:1.15;
  font-weight:700;
  color:var(--em-d);
}
.stat span{
  display:block;
  font-size:13.5px;
  color:var(--mute);
  margin-top:4px;
}
.stat.main{
  background:var(--em-d);
  border-color:var(--em-d);
  color:#eaf4ee;
}
.stat.main b{color:#fff}
.stat.main span{color:#c9e2d2}

.bar{
  height:9px;
  background:var(--sage);
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;
}
.bar>i{
  display:block;
  height:100%;
  background:var(--em);
  border-radius:999px;
  transition:width .25s ease;
}
.stat.main .bar{background:rgba(255,255,255,.2)}
.stat.main .bar>i{background:#c5e8d2}

.prog-item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  background:var(--bg);
}
.prog-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}
.prog-top strong{font-size:15.5px}
.prog-top span{font-size:13.5px;font-weight:700;color:var(--em-d)}
.prog-meta{
  font-size:13px;
  color:var(--mute);
  margin-top:4px;
}

.quote-box{
  display:grid;
  gap:12px;
  margin-bottom:16px;
}
.quote-item{
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  background:var(--bg);
}
.quote-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:13px;
}
.quote-time{color:var(--mute);font-size:12.5px}
.quote-body{
  margin:8px 0 12px;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.quote-foot{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.like-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.like-btn.liked{
  border-color:#d88b9c;
  background:#fff0f3;
  color:#b4234b;
}

.list{display:flex;flex-direction:column}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0;padding-top:2px}
.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}

.chip{
  display:inline-block;
  font-size:12.5px;
  font-weight:600;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.Lancar{background:var(--ok-bg);color:var(--ok)}
.Cukup{background:var(--mid-bg);color:var(--mid)}
.Ulang{background:var(--bad-bg);color:var(--bad)}
.tag{
  display:inline-block;
  background:var(--sage);
  color:var(--em-d);
  font-size:12.5px;
  font-weight:600;
  padding:2px 9px;
  border-radius:999px;
}

.btn{
  border:1px solid var(--em);
  background:var(--em);
  color:#fff;
  padding:9px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
@media (prefers-color-scheme:dark){
  .btn{color:#091510}
}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{
  background:transparent;
  color:var(--em-d);
  border-color:var(--sage-d);
}
.btn.light{
  background:rgba(255,255,255,.12);
  color:#fff;
  border-color:rgba(255,255,255,.22);
}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{
  background:transparent;
  color:var(--bad);
  border-color:var(--bad-bg);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.form-grid .full{grid-column:1/-1}
.readonly-box{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
  font-weight:600;
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:500;font-size:14px}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{
  display:block;
  padding:8px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  cursor:pointer;
}
.seg input:checked+span{
  background:var(--sage);
  border-color:var(--em);
  color:var(--em-d);
  font-weight:700;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px}
th,td{
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  font-size:14px;
}
th{color:var(--mute);font-weight:600;font-size:12.5px}
td.act{white-space:nowrap;text-align:right}
.empty{
  text-align:center;
  color:var(--mute);
  padding:28px 12px;
  font-size:14px;
}
.back{
  background:none;
  border:0;
  color:var(--em-d);
  font-weight:600;
  font-size:14px;
  padding:0 0 10px;
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--em-d);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:600;
  font-size:13.5px;
  z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
dialog{
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  color:var(--ink);
  max-width:420px;
  width:calc(100% - 32px);
  padding:20px;
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-act{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:16px;
}
#print{display:none}

@media (max-width:900px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{display:block}
  aside{
    position:fixed;
    left:0;right:0;bottom:0;top:auto;
    height:auto;
    flex-direction:row;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:30;
  }
  .brand,.brand-sub,.user-pill,.side-foot{display:none}
  nav{flex-direction:row;width:100%;justify-content:space-around}
  nav button{
    flex-direction:column;
    gap:2px;
    font-size:11.5px;
    padding:6px 4px;
    flex:1;
    align-items:center;
  }
  main{padding:20px 14px 92px}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:600px){
  .grid-2,.grid-4,.form-grid,.filters{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .login-wrap,.app,.toast,dialog{display:none!important}
  #print{display:block;font-family:Figtree,sans-serif}
  #print h1{color:#0a4f3a}
  #print table{min-width:0}
  #print th,#print td{font-size:12px;border-bottom:1px solid #bbb}
}
</style>
</head>
<body>

<section class="login-wrap" id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="off">
    <p class="login-brand">Buku Setoran</p>
    <p class="login-sub">Masuk menggunakan username dan sandi peserta untuk membuka buku hafalan.</p>
    <div id="loginErr" class="err-box hidden" role="alert"></div>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" required placeholder="Masukkan username">
    </div>
    <div class="field">
      <label for="loginPass">Sandi</label>
      <input id="loginPass" type="password" required placeholder="Masukkan sandi">
    </div>
    <button class="btn" type="submit" style="width:100%">Masuk</button>
  </form>
</section>

<div class="app hidden" id="mainApp">
  <aside>
    <p class="brand">Buku Setoran</p>
    <p class="brand-sub">Catatan hafalan Al-Qur’an</p>
    <div class="user-pill">
      <small>Akun aktif</small>
      <strong id="sideUserName">–</strong>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn light sm" type="button" id="sideSyncBtn">Pengaturan Cloud</button>
      <button class="btn light sm" type="button" id="sideLogoutBtn">Keluar</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="print"></div>

<dialog id="dlg">
  <p id="dlgMsg" style="margin:0"></p>
  <div class="dlg-act">
    <button class="btn ghost sm" type="button" id="dlgNo">Batal</button>
    <button class="btn sm" type="button" id="dlgYes">Ya</button>
  </div>
</dialog>

<dialog id="syncDlg">
  <h2 style="margin-bottom:6px">Pengaturan Sinkronisasi Cloud</h2>
  <p class="sec-sub" style="margin-bottom:12px">Tempelkan konfigurasi Firebase Realtime Database atau URL webhook agar data tersinkronisasi antar perangkat.</p>
  <div class="field">
    <label for="cfgJson">Konfigurasi Firebase (JSON)</label>
    <textarea id="cfgJson" placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"https://...firebaseio.com","projectId":"...","appId":"..."}'></textarea>
  </div>
  <div class="field" style="margin-bottom:0">
    <label for="cfgRoom">Kode Ruang Bersama</label>
    <input id="cfgRoom" type="text" placeholder="buku-setoran-reski-ima">
  </div>
  <div class="dlg-act">
    <button class="btn ghost sm" type="button" id="syncCancel">Tutup</button>
    <button class="btn sm" type="button" id="syncSave">Simpan</button>
  </div>
</dialog>

function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function weekStart(){
  const d = new Date();
  const k = (d.getDay() + 6) % 7;
  return daysAgo(k);
}
function defaultState(){
  return {
    peserta:[
      { id:"p1", nama:"Reski", target:600 },
      { id:"p2", nama:"Ima Cantik Sholeha🌸", target:600 }
    ],
    setoran:[],
    quotes:[],
    updatedAt:Date.now()
  };
}
function normalizeState(raw){
  const p1T = raw?.peserta?.find(p=>p.id==="p1")?.target || 600;
  const p2T = raw?.peserta?.find(p=>p.id==="p2")?.target || 600;
  const quotes = Array.isArray(raw?.quotes)
    ? raw.quotes
        .filter(q=>["p1","p2"].includes(q.pid) && Number.isFinite(Number(q.createdAt)) && (Date.now() - Number(q.createdAt) < 24*60*60*1000))
        .map(q=>({
          id: String(q.id || uid()),
          pid: q.pid,
          text: String(q.text || ""),
          likes: Array.isArray(q.likes) ? q.likes.filter(x=>["p1","p2"].includes(x)) : [],
          createdAt: Number(q.createdAt)
        }))
    : [];
  const setoran = Array.isArray(raw?.setoran)
    ? raw.setoran
        .filter(s=>["p1","p2"].includes(s.pid) && s.penilai !== s.pid)
        .map(s=>({
          id: String(s.id || uid()),
          pid: s.pid,
          penilai: ["p1","p2"].includes(s.penilai) ? s.penilai : partnerIdOf(s.pid),
          jenis: s.jenis === "Muroja'ah" ? "Muroja'ah" : "Ziyadah",
          surah: Number(s.surah) || 1,
          awal: Number(s.awal) || 1,
          akhir: Number(s.akhir) || 1,
          materi: String(s.materi || ""),
          ayat: Number(s.ayat) || 0,
          tgl: String(s.tgl || today()),
          nilai: NILAI.includes(s.nilai) ? s.nilai : "Lancar",
          catatan: String(s.catatan || ""),
          createdAt: Number(s.createdAt) || Date.now()
        }))
    : [];
  return {
    peserta:[
      { id:"p1", nama:"Reski", target:Math.max(1, Number(p1T)||600) },
      { id:"p2", nama:"Ima Cantik Sholeha🌸", target:Math.max(1, Number(p2T)||600) }
    ],
    setoran,
    quotes,
    updatedAt: Number(raw?.updatedAt) || Date.now()
  };
}

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role","status");
  el.textContent = msg;
  document.body.append(el);
  setTimeout(()=>el.remove(), 2200);
}
function ask(msg, yesLabel="Hapus"){
  return new Promise(resolve=>{
    $("dlgMsg").textContent = msg;
    $("dlgYes").textContent = yesLabel;
    const d = $("dlg");
    d.showModal();
    const finish = val => { d.close(); resolve(val); };
    $("dlgYes").onclick = () => finish(true);
    $("dlgNo").onclick = () => finish(false);
  });
}
function chip(n){
  return `<span class="chip ${nCls(n)}">${esc(n)}</span>`;
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) S = normalizeState(JSON.parse(raw));
  }catch(e){}
  saveLocal();
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  }catch(e){
    toast("Penyimpanan lokal penuh.");
  }
}
async function persistState(){
  S.updatedAt = Date.now();
  saveLocal();
  if(bc){
    try{ bc.postMessage({ type:"state", state:S }); }catch(e){}
  }
  if(!applyingRemote && cloudWriteFn){
    try{ await cloudWriteFn(S); }catch(e){ console.error(e); }
  }
}

function applyIncomingState(raw){
  if(!raw || typeof raw !== "object") return;
  const incoming = normalizeState(raw);
  if(incoming.updatedAt >= (S.updatedAt || 0) && JSON.stringify(incoming) !== JSON.stringify(S)){
    applyingRemote = true;
    S = incoming;
    saveLocal();
    if(activeRole) render();
    applyingRemote = false;
  }
}

function setupBroadcast(){
  if("BroadcastChannel" in window){
    bc = new BroadcastChannel(CHANNEL_NAME);
    bc.onmessage = ev => {
      if(ev.data?.type === "state") applyIncomingState(ev.data.state);
    };
  }
  window.addEventListener("storage", ev => {
    if(ev.key === STORAGE_KEY && ev.newValue){
      try{ applyIncomingState(JSON.parse(ev.newValue)); }catch(e){}
    }
    if(ev.key === SESSION_KEY && !ev.newValue && activeRole){
      logout(false);
    }
  });
}

function getCloudConfig(){
  try{
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed?.cfg?.databaseURL) return parsed;
  }catch(e){}
  return null;
}

async function connectCloud(){
  if(typeof cloudUnsub === "function"){
    try{ cloudUnsub(); }catch(e){}
    cloudUnsub = null;
  }
  cloudWriteFn = null;
  const saved = getCloudConfig();
  if(!saved) return;

  try{
    const [{ initializeApp, getApps, deleteApp }, { getDatabase, ref, onValue, set, get }] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js")
    ]);
    for(const app of getApps()){
      await deleteApp(app).catch(()=>{});
    }
    const app = initializeApp(saved.cfg);
    const db = getDatabase(app);
    const room = (saved.room || "buku-setoran-reski-ima").trim() || "buku-setoran-reski-ima";
    const stateRef = ref(db, `rooms/${room}/state`);

    cloudWriteFn = val => set(stateRef, val);
    const snap0 = await get(stateRef);
    if(snap0.exists()){
      applyIncomingState(snap0.val());
    }else if(S.setoran.length || S.quotes.length){
      await set(stateRef, S);
    }
    cloudUnsub = onValue(stateRef, snap => {
      if(snap.exists()) applyIncomingState(snap.val());
    });
  }catch(err){
    console.error("Gagal menghubungkan cloud:", err);
  }
}

function openSyncModal(){
  const saved = getCloudConfig();
  $("cfgJson").value = saved?.cfg ? JSON.stringify(saved.cfg, null, 2) : "";
  $("cfgRoom").value = saved?.room || "buku-setoran-reski-ima";
  $("syncDlg").showModal();
}

function showApp(){
  $("loginScreen").classList.add("hidden");
  $("mainApp").classList.remove("hidden");
  $("sideUserName").textContent = pName(activeRole);
  render();
}
function logout(clearStorageSession=true){
  activeRole = null;
  editId = null;
  selP = null;
  if(clearStorageSession) sessionStorage.removeItem(SESSION_KEY);
  $("mainApp").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("loginForm").reset();
  $("loginErr").classList.add("hidden");
}

function cleanExpiredQuotes(){
  const before = S.quotes.length;
  S.quotes = S.quotes.filter(q=>Number.isFinite(Number(q.createdAt)) && (Date.now() - Number(q.createdAt) < 24*60*60*1000));
  if(S.quotes.length !== before) persistState();
}

function renderNav(){
  $("nav").innerHTML = TABS.map(([k,l])=>`
    <button type="button" data-t="${k}" ${tab===k?'aria-current="page"':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>
      <span>${l}</span>
    </button>
  `).join("");
  $("nav").querySelectorAll("button").forEach(btn=>{
    btn.onclick = () => {
      if(btn.dataset.t === "add") editId = null;
      tab = btn.dataset.t;
      if(tab !== "user") selP = null;
      render();
      window.scrollTo(0,0);
    };
  });
}

function render(){
  renderNav();
  ({ dash, add:formView, hist, user:pesertaView })[tab]();
}

function dash(){
  cleanExpiredQuotes();
  const tot = S.setoran.length;
  const ay = ayatOf(S.setoran);
  const tg = S.peserta.reduce((acc,p)=>acc + (+p.target||0), 0);
  const pct = tg ? Math.min(100, Math.round(ay/tg*100)) : 0;
  const wk = S.setoran.filter(s=>s.tgl >= weekStart()).length;
  const rec = sorted(S.setoran).slice(0,6);
  const quotes = [...S.quotes].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Assalamu’alaikum🕌</h1>
        <p class="lead">Masuk sebagai <strong>${esc(pName(activeRole))}</strong>. Pantau progress hafalan kedua peserta dan saling berbagi quotes.</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" type="button" id="topSyncBtn">Pengaturan Cloud</button>
        <button class="btn danger sm" type="button" id="topLogoutBtn">Keluar</button>
      </div>
    </div>

    <div class="stack">
      <div class="grid-4">
        <div class="card stat main">
          <b>${ay}</b>
          <span>ayat Ziyadah terkumpul</span>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        <div class="card stat">
          <b>${pct}%</b>
          <span>capaian dari ${tg} ayat</span>
        </div>
        <div class="card stat">
          <b>${wk}</b>
          <span>setoran minggu ini</span>
        </div>
        <div class="card stat">
          <b>${tot}</b>
          <span>total catatan setoran</span>
        </div>
      </div>

      <section class="card">
        <div class="sec-head">
          <div>
            <h2>Progress Peserta</h2>
            <p class="sec-sub">Ringkasan hafalan Reski dan Ima Cantik Sholeha🌸</p>
          </div>
          <button class="btn sm" type="button" id="goSetorBtn">Catat & Nilai Setoran</button>
        </div>
        <div class="grid-2">
          ${S.peserta.map(p=>{
            const list = S.setoran.filter(s=>s.pid===p.id);
            const done = ayatOf(list);
            const pPct = p.target ? Math.min(100, Math.round(done/p.target*100)) : 0;
            return `
              <div class="prog-item">
                <div class="prog-top">
                  <strong>${esc(p.nama)}</strong>
                  <span>${pPct}%</span>
                </div>
                <div class="prog-meta">${done} dari ${p.target} ayat Ziyadah · ${list.length} setoran</div>
                <div class="bar"><i style="width:${pPct}%"></i></div>
              </div>
            `;
          }).join("")}
        </div>
      </section>

      <section class="card">
        <div class="sec-head">
          <div>
            <h2>Quotes Peserta (24 Jam)</h2>
            <p class="sec-sub">Dikirim sebagai <strong>${esc(pName(activeRole))}</strong></p>
          </div>
        </div>
        <form class="quote-box" id="quoteForm">
          <div class="field" style="margin-bottom:0">
            <label for="quoteText">Tulis quotes penyemangat</label>
            <textarea id="quoteText" maxlength="500" placeholder="Tuliskan pesan atau motivasi..." required></textarea>
          </div>
          <div>
            <button class="btn" type="submit">Kirim quotes</button>
          </div>
        </form>
        <div class="stack" style="gap:10px" id="quoteList">
          ${quotes.length ? quotes.map(q=>{
            const likes = Array.isArray(q.likes) ? q.likes : [];
            const liked = likes.includes(activeRole);
            return `
              <article class="quote-item">
                <div class="quote-head">
                  <strong>${esc(pName(q.pid))}</strong>
                  <span class="quote-time">${new Date(q.createdAt).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</span>
                </div>
                <p class="quote-body">${esc(q.text)}</p>
                <div class="quote-foot">
                  <button class="like-btn ${liked?"liked":""}" type="button" data-like="${esc(q.id)}">${liked?"♥ Disukai":"♡ Suka"} · ${likes.length}</button>
                  <button class="btn danger sm" type="button" data-qdel="${esc(q.id)}">Hapus</button>
                </div>
              </article>
            `;
          }).join("") : '<div class="empty">Belum ada quotes hari ini.</div>'}
        </div>
      </section>

      <section class="card">
        <div class="sec-head">
          <h2>Setoran Terbaru</h2>
          <button class="btn ghost sm" type="button" id="goHistBtn">Lihat semua</button>
        </div>
        <div class="list">
          ${rec.length ? rec.map(s=>`
            <div class="row">
              <div>
                <strong>${esc(pName(s.pid))}</strong> <span class="tag">${esc(s.jenis)}</span>
                <small>${esc(s.materi)} · dinilai oleh ${esc(pName(s.penilai))} · ${fmt(s.tgl)}</small>
              </div>
              ${chip(s.nilai)}
            </div>
          `).join("") : '<div class="empty">Belum ada catatan setoran.</div>'}
        </div>
      </section>
    </div>
  `;

  $("topSyncBtn").onclick = openSyncModal;
  $("topLogoutBtn").onclick = () => logout(true);
  $("goSetorBtn").onclick = () => { editId = null; tab = "add"; render(); };
  $("goHistBtn").onclick = () => { tab = "hist"; render(); };

  $("quoteForm").onsubmit = async ev => {
    ev.preventDefault();
    const txt = $("quoteText").value.trim();
    if(!txt){ toast("Quotes tidak boleh kosong."); return; }
    S.quotes.push({ id:uid(), pid:activeRole, text:txt, likes:[], createdAt:Date.now() });
    await persistState();
    dash();
    toast("Quotes terkirim.");
  };

  $("quoteList").querySelectorAll("[data-like]").forEach(btn=>{
    btn.onclick = async () => {
      const q = S.quotes.find(x=>x.id===btn.dataset.like);
      if(!q) return;
      q.likes = Array.isArray(q.likes) ? q.likes : [];
      q.likes = q.likes.includes(activeRole)
        ? q.likes.filter(x=>x!==activeRole)
        : [...q.likes, activeRole];
      await persistState();
      dash();
    };
  });

  $("quoteList").querySelectorAll("[data-qdel]").forEach(btn=>{
    btn.onclick = async () => {
      if(await ask("Hapus quotes ini?")){
        S.quotes = S.quotes.filter(x=>x.id!==btn.dataset.qdel);
        await persistState();
        dash();
        toast("Quotes dihapus.");
      }
    };
  });
}

function formView(){
  const partnerId = partnerIdOf(activeRole);
  const existing = S.setoran.find(s=>s.id===editId);
  if(existing && existing.pid === activeRole) editId = null;

  const item = S.setoran.find(s=>s.id===editId) || {
    pid: partnerId,
    jenis: "Ziyadah",
    surah: 1,
    awal: 1,
    akhir: 1,
    tgl: today(),
    nilai: "Lancar",
    catatan: ""
  };
  const sid = Number(item.surah) || 1;
  const awal = Number(item.awal) || 1;
  const akhir = Number(item.akhir) || awal;

  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>${editId ? "Ubah Penilaian Setoran" : "Setoran & Penilaian"}</h1>
        <p class="lead"><strong>${esc(pName(activeRole))}</strong> menyimak dan menilai hafalan <strong>${esc(pName(partnerId))}</strong>.</p>
      </div>
    </div>

    <form class="card form-grid" id="setorForm" autocomplete="off">
      <div>
        <label>Peserta yang dinilai</label>
        <div class="readonly-box">${esc(pName(partnerId))}</div>
      </div>
      <div>
        <label>Penyimak / penilai</label>
        <div class="readonly-box">${esc(pName(activeRole))}</div>
      </div>
      <div>
        <label for="tgl">Tanggal setoran</label>
        <input type="date" id="tgl" required value="${item.tgl}">
      </div>
      <div>
        <label for="surah">Surah</label>
        <select id="surah" required>
          ${SURAH.map((x,i)=>`<option value="${i+1}" ${sid===i+1?"selected":""}>${i+1}. ${esc(x[0])} (${x[1]} ayat)</option>`).join("")}
        </select>
      </div>
      <div class="full">
        <label>Jenis hafalan</label>
        <div class="seg">
          <label><input type="radio" name="j" value="Ziyadah" ${item.jenis==="Ziyadah"?"checked":""}><span>Ziyadah (hafalan baru)</span></label>
          <label><input type="radio" name="j" value="Muroja'ah" ${item.jenis!=="Ziyadah"?"checked":""}><span>Muroja’ah (mengulang)</span></label>
        </div>
      </div>
      <div>
        <label for="awal">Ayat awal</label>
        <select id="awal" required></select>
      </div>
      <div>
        <label for="akhir">Ayat akhir</label>
        <select id="akhir" required></select>
      </div>
      <div class="full">
        <label for="jumlah">Jumlah ayat terpilih</label>
        <input id="jumlah" readonly value="${Math.max(1, akhir-awal+1)}">
      </div>
      <div class="full">
        <label>Penilaian</label>
        <div class="seg">
          ${NILAI.map(n=>`<label><input type="radio" name="n" value="${n}" ${item.nilai===n?"checked":""}><span>${n}</span></label>`).join("")}
        </div>
      </div>
      <div class="full">
        <label for="cat">Catatan penilaian</label>
        <textarea id="cat" placeholder="Catatan tajwid, kelancaran, atau bagian yang perlu diulang...">${esc(item.catatan||"")}</textarea>
      </div>
      <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" type="submit">${editId ? "Simpan perubahan" : "Simpan penilaian"}</button>
        ${editId ? '<button class="btn ghost" type="button" id="cancelEdit">Batal</button>' : ""}
      </div>
    </form>
  `;

  const syncAyat = (reset=false) => {
    const totalAyat = SURAH[+$("surah").value - 1][1];
    const wantA = reset ? 1 : (+$("awal").value || awal);
    const wantB = reset ? 1 : (+$("akhir").value || akhir);
    $("awal").innerHTML = Array.from({length:totalAyat},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(wantA,totalAyat)?"selected":""}>${i+1}</option>`).join("");
    const a = +$("awal").value;
    $("akhir").innerHTML = Array.from({length:totalAyat-a+1},(_,i)=>`<option value="${a+i}" ${a+i===Math.max(a,Math.min(wantB,totalAyat))?"selected":""}>${a+i}</option>`).join("");
    const b = +$("akhir").value;
    $("jumlah").value = b >= a ? (b - a + 1) : 1;
  };

  $("surah").onchange = () => syncAyat(true);
  $("awal").onchange = () => syncAyat(false);
  $("akhir").onchange = () => syncAyat(false);
  syncAyat(false);

  if($("cancelEdit")){
    $("cancelEdit").onclick = () => { editId = null; tab = "hist"; render(); };
  }

  $("setorForm").onsubmit = async ev => {
    ev.preventDefault();
    const jenis = document.querySelector('input[name="j"]:checked')?.value || "Ziyadah";
    const nilai = document.querySelector('input[name="n"]:checked')?.value || "Lancar";
    const surah = Number($("surah").value);
    const a = Number($("awal").value);
    const b = Number($("akhir").value);
    const batas = SURAH[surah-1]?.[1] || 0;
    const tgl = $("tgl").value;

    if(!tgl || !batas || a < 1 || b < a || b > batas){
      toast("Periksa kembali tanggal dan rentang ayat.");
      return;
    }

    const record = {
      pid: partnerId,
      penilai: activeRole,
      jenis,
      surah,
      awal: a,
      akhir: b,
      materi: `Surah ${SURAH[surah-1][0]} ayat ${a}${b!==a ? "–"+b : ""}`,
      ayat: jenis === "Ziyadah" ? (b - a + 1) : 0,
      tgl,
      nilai,
      catatan: $("cat").value.trim(),
      createdAt: existing?.createdAt || Date.now()
    };

    if(editId && existing){
      Object.assign(existing, record);
    }else{
      S.setoran.push({ id:uid(), ...record });
    }
    editId = null;
    await persistState();
    tab = "hist";
    render();
    toast("Penilaian setoran tersimpan.");
  };
}

function filteredSetoran(){
  const q = flt.q.trim().toLowerCase();
  return sorted(S.setoran).filter(s=>
    (!flt.nilai || s.nilai === flt.nilai) &&
    (!flt.jenis || s.jenis === flt.jenis) &&
    (!q || `${pName(s.pid)} ${pName(s.penilai)} ${s.materi} ${s.catatan||""}`.toLowerCase().includes(q))
  );
}

    </tr>
  `).join("");
}

      <select id="fn">
        <option value="">Semua penilaian</option>
        ${NILAI.map(n=>`<option value="${n}" ${flt.nilai===n?"selected":""}>${n}</option>`).join("")}
      </select>
      <select id="fj">
        <option value="">Semua jenis</option>
        <option value="Ziyadah" ${flt.jenis==="Ziyadah"?"selected":""}>Ziyadah</option>
        <option value="Muroja'ah" ${flt.jenis==="Muroja'ah"?"selected":""}>Muroja’ah</option>
      </select>
    </div>

    <div class="card tbl" style="padding:6px 12px">
      <table>
        ${tableHead(true)}
        <tbody id="histBody">${tableBody(filteredSetoran(), true)}</tbody>
      </table>
    </div>
  `;

  const refreshRows = () => {
    $("histBody").innerHTML = tableBody(filteredSetoran(), true);
    bindRowActions();
  };
  const bindRowActions = () => {
    $("histBody").querySelectorAll("[data-edit]").forEach(btn=>{
      btn.onclick = () => {
        const target = S.setoran.find(x=>x.id===btn.dataset.edit);
        if(!target) return;
        if(target.pid === activeRole){
          toast("Anda tidak dapat menilai atau mengubah penilaian setoran diri sendiri.");
          return;
        }
        editId = target.id;
        tab = "add";
        render();
      };
    });
    $("histBody").querySelectorAll("[data-del]").forEach(btn=>{
      btn.onclick = async () => {
        if(await ask("Hapus catatan setoran ini?")){
          S.setoran = S.setoran.filter(x=>x.id!==btn.dataset.del);
          await persistState();
          refreshRows();
          toast("Setoran dihapus.");
        }
      };
    });
  };

  $("fq").oninput = e => { flt.q = e.target.value; refreshRows(); };
  $("fn").onchange = e => { flt.nilai = e.target.value; refreshRows(); };
  $("fj").onchange = e => { flt.jenis = e.target.value; refreshRows(); };
  $("expJpg").onclick = () => exportJPG(filteredSetoran(), "Rekap Setoran Hafalan");
  $("expPdf").onclick = () => printRecap(filteredSetoran(), "Rekap Setoran Hafalan");
  bindRowActions();
}

function pesertaView(){
  if(selP){ detailPeserta(); return; }
  $("view").innerHTML = `
    <div class="top-bar">
      <div>
        <h1>Progress Peserta</h1>
        <p class="lead">Lihat detail capaian dan riwayat setoran masing-masing peserta.</p>
      </div>
    </div>
    <div class="grid-2">
      ${S.peserta.map(p=>{
        const list = S.setoran.filter(s=>s.pid===p.id);
        const done = ayatOf(list);
        const pct = p.target ? Math.min(100, Math.round(done/p.target*100)) : 0;
        return `
          <div class="card">
            <div class="prog-top">
              <h2>${esc(p.nama)}</h2>
              <span style="font-weight:700;color:var(--em-d)">${pct}%</span>
            </div>
            <p class="sec-sub">${done} dari ${p.target} ayat Ziyadah · ${list.length} setoran</p>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div style="margin-top:14px">
              <button class="btn ghost sm" type="button" data-open-p="${p.id}">Lihat detail</button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
  document.querySelectorAll("[data-open-p]").forEach(btn=>{
    btn.onclick = () => { selP = btn.dataset.openP; render(); window.scrollTo(0,0); };
  });
}

function detailPeserta(){
  const p = S.peserta.find(x=>x.id===selP);
  if(!p){ selP = null; pesertaView(); return; }
  const list = sorted(S.setoran.filter(s=>s.pid===p.id));
  const done = ayatOf(list);
  const pct = p.target ? Math.min(100, Math.round(done/p.target*100)) : 0;
  const countNilai = n => list.filter(s=>s.nilai===n).length;

  $("view").innerHTML = `
    <button class="back" type="button" id="backPeserta">← Semua peserta</button>
    <div class="top-bar">
      <div>
        <h1>${esc(p.nama)}</h1>
        <p class="lead">${done} dari ${p.target} ayat Ziyadah (${pct}%)</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost sm" type="button" id="editTarget">Ubah target</button>
        <button class="btn ghost sm" type="button" id="pJpg">Cetak JPG</button>
        <button class="btn sm" type="button" id="pPdf">Cetak PDF</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <span class="chip Lancar">Lancar ${countNilai("Lancar")}</span>
        <span class="chip Cukup">Cukup Lancar ${countNilai("Cukup Lancar")}</span>
        <span class="chip Ulang">Perlu Diulang ${countNilai("Perlu Diulang")}</span>
        <span class="tag">Total ${list.length} setoran</span>
      </div>
    </div>

    <div class="card tbl" style="padding:6px 12px">
      <table>
        ${tableHead(false)}
        <tbody>${tableBody(list, false)}</tbody>
      </table>
    </div>
  `;

  $("backPeserta").onclick = () => { selP = null; render(); };
  $("pJpg").onclick = () => exportJPG(list, `Rekap Hafalan – ${p.nama}`);
  $("pPdf").onclick = () => printRecap(list, `Rekap Hafalan – ${p.nama}`);
  $("editTarget").onclick = async () => {
    const raw = window.prompt("Target jumlah ayat Ziyadah:", p.target);
    const val = Number(raw);
    if(raw !== null && Number.isFinite(val) && val > 0){
      p.target = Math.round(val);
      await persistState();
      render();
      toast("Target diperbarui.");
    }
  };
}

function printRecap(list, title){
  const rows = sorted(list);
  $("print").innerHTML = `
    <h1>${esc(title)}</h1>
    <p>Dicetak ${esc(fmt(today()))} · ${rows.length} setoran · ${ayatOf(rows)} ayat Ziyadah</p>
    <table>${tableHead(false)}<tbody>${tableBody(rows, false)}</tbody></table>
  `;
  window.print();
}

function xmlEsc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

function exportJPG(list, title){
  const W = 1440, pad = 48, cols = [150,180,140,360,170,170,226];
  const headers = ["Tanggal","Peserta","Jenis","Materi","Penilaian","Penilai","Catatan"];
  const wrap = (val, max) => {
    const words = String(val??"–").split(/\s+/), out = [];
    let line = "";
    for(const w of words){
      const test = line ? `${line} ${w}` : w;
      if(test.length > max && line){ out.push(line); line = w; }
      else line = test;
    }
    if(line) out.push(line);
    return out.length ? out : ["–"];
  };
  const rows = sorted(list).map(s=>[fmt(s.tgl), pName(s.pid), s.jenis, s.materi, s.nilai, pName(s.penilai), s.catatan||"–"]);
  let y = 204;
  const rowBoxes = rows.map(r=>{
    const lines = r.map((v,i)=>wrap(v,[16,20,15,44,18,18,26][i]));
    const h = Math.max(54, ...lines.map(a=>a.length*24+22));
    const box = { lines, y, h };
    y += h;
    return box;
  });
  const H = Math.max(300, y + pad + 20);

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="100%" height="100%" fill="#ffffff"/>
    <rect x="0" y="0" width="${W}" height="14" fill="#0a684d"/>
    <text x="${pad}" y="80" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#123b2e">${xmlEsc(title)}</text>
    <text x="${pad}" y="122" font-family="Arial,sans-serif" font-size="20" fill="#52645d">Dicetak ${xmlEsc(fmt(today()))}  •  ${rows.length} setoran  •  ${ayatOf(list)} ayat Ziyadah</text>
    <rect x="${pad}" y="154" width="${W-pad*2}" height="46" rx="8" fill="#e8f2ee"/>`;

  let hx = pad;
  headers.forEach((h,i)=>{
    svg += `<text x="${hx+12}" y="184" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0a4f3a">${xmlEsc(h)}</text>`;
    hx += cols[i];
  });

  rowBoxes.forEach((rb,idx)=>{
    if(idx % 2 === 1){
      svg += `<rect x="${pad}" y="${rb.y}" width="${W-pad*2}" height="${rb.h}" fill="#f8faf9"/>`;
    }
    let cx = pad;
    rb.lines.forEach((lineArr,cIdx)=>{
      lineArr.forEach((ln,lIdx)=>{
        svg += `<text x="${cx+12}" y="${rb.y + 30 + lIdx*24}" font-family="Arial,sans-serif" font-size="17" fill="#1d2b25">${xmlEsc(ln)}</text>`;
      });
      cx += cols[cIdx];
    });
    svg += `<line x1="${pad}" y1="${rb.y+rb.h}" x2="${W-pad}" y2="${rb.y+rb.h}" stroke="#e4dfd0" stroke-width="1"/>`;
  });

  svg += `</svg>`;
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const a = document.createElement("a");
    a.download = `${title.toLowerCase().replace(/[^a-z0-9]+/gi,"-")}.jpg`;
    a.href = canvas.toDataURL("image/jpeg", 0.92);
    a.click();
    toast("Rekap JPG diunduh.");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

$("loginForm").onsubmit = ev => {
  ev.preventDefault();
  const u = $("loginUser").value.trim().toLowerCase();
  const p = $("loginPass").value;
  const acc = CREDENTIALS[u];
  if(!acc || acc.pass !== p){
    $("loginErr").textContent = "Username atau sandi tidak sesuai.";
    $("loginErr").classList.remove("hidden");
    return;
  }
  $("loginErr").classList.add("hidden");
  activeRole = acc.role;
  tab = "dash";
  editId = null;
  selP = null;
  sessionStorage.setItem(SESSION_KEY, activeRole);
  showApp();
  toast(`Selamat datang, ${acc.nama}`);
};

$("sideLogoutBtn").onclick = () => logout(true);
$("sideSyncBtn").onclick = openSyncModal;
$("syncCancel").onclick = () => $("syncDlg").close();
$("syncSave").onclick = async () => {
  const raw = $("cfgJson").value.trim();
  const room = ($("cfgRoom").value || "buku-setoran-reski-ima").trim();
  if(!raw){
    localStorage.removeItem(SYNC_CFG_KEY);
    await connectCloud();
    $("syncDlg").close();
    toast("Pengaturan cloud dikosongkan.");
    return;
  }
  try{
    const cfg = JSON.parse(raw);
    if(!cfg.databaseURL) throw new Error("databaseURL belum diisi");
    localStorage.setItem(SYNC_CFG_KEY, JSON.stringify({ cfg, room }));
    await connectCloud();
    $("syncDlg").close();
    toast("Konfigurasi cloud tersimpan.");
  }catch(e){
    toast("Format JSON tidak valid atau databaseURL kosong.");
  }
};

loadLocal();
setupBroadcast();
connectCloud();

const savedRole = sessionStorage.getItem(SESSION_KEY);
if(savedRole === "p1" || savedRole === "p2"){
  activeRole = savedRole;
  showApp();
}
</script>
